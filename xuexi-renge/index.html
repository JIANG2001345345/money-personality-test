<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF3D5">
<title>你是哪种学习型人格？20 题测出你的学习方式</title>
<meta name="description" content="专注、方法、耐力三个维度，测出你是突击型、状态型、氛围型、计划型，还是死磕型。">
<style>
/* ===== 学习型人格 · 横线本 / 咖啡 / 橄榄绿 ===== */
:root{
  --paper:#FBF3D5; --ink:#3B2B1F; --olive:#6E8B3D; --rule:#E4D6A8;
  --margin:#D98B72; --dim:#93816A; --line:#E0D2A4;
  --sans:"PingFang SC","Microsoft YaHei",sans-serif;
  --kai:"Kaiti SC","KaiTi","STKaiti","Songti SC",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:repeating-linear-gradient(to bottom,
    transparent 0 27px, rgba(59,43,31,.07) 27px 28px)}
.app{max-width:430px;margin:0 auto;position:relative;min-height:100vh;min-height:100dvh}
.app::before{content:'';position:absolute;left:27px;top:0;bottom:0;width:1px;
  background:rgba(217,139,114,.5);pointer-events:none}
.screen{display:none;flex-direction:column;min-height:100vh;min-height:100dvh;
  padding:24px 22px calc(26px + env(safe-area-inset-bottom)) 40px}
.screen.active{display:flex}
.eyebrow{font-family:var(--kai);font-size:10px;letter-spacing:.22em;color:var(--dim)}
.btn{display:block;width:100%;border:1.5px solid var(--ink);background:var(--ink);
  color:var(--paper);font-family:var(--sans);font-size:14px;font-weight:700;
  letter-spacing:.24em;text-indent:.24em;padding:15px 12px;cursor:pointer;border-radius:0}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);
  font-size:12px;font-weight:600;letter-spacing:.1em;text-indent:.1em;padding:12px 8px}

/* ---------- 封面 ---------- */
.cover{flex:1;display:flex;flex-direction:column;justify-content:center}
.c-top{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid var(--line);padding-bottom:12px}
.c-title{font-family:var(--kai);font-size:clamp(32px,9.8vw,42px);font-weight:700;
  line-height:1.62;letter-spacing:.02em;margin:20px 0 0;color:var(--ink)}
.c-title em{font-style:normal;color:var(--olive)}
.wave{display:block;width:172px;height:12px;margin:2px 0 0}
.lede{font-size:13px;line-height:2.05;color:#6E5B47;margin:22px 0 0}
.cover-foot{display:flex;flex-direction:column;gap:14px;margin-top:26px}
.facts{display:flex;justify-content:space-between;font-family:var(--kai);
  font-size:11px;letter-spacing:.1em;color:var(--dim)}

/* ---------- 答题 ---------- */
#s-quiz{padding-top:26px}
.qtop{display:flex;justify-content:space-between;align-items:baseline}
.q-no{font-family:var(--kai);font-size:13px;color:var(--olive);letter-spacing:.08em}
.q-pct{font-size:10px;letter-spacing:.18em;color:var(--dim)}
.qtrack{height:4px;margin-top:13px;background:rgba(59,43,31,.07)}
.qtrack i{display:block;height:100%;width:var(--w,0);background:var(--olive);
  transform-origin:left;animation:grow .9s cubic-bezier(.2,.9,.3,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.qwrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:56px}
.qkicker{font-family:var(--kai);font-size:11px;letter-spacing:.2em;color:var(--dim);margin:0 0 14px}
.qtext{font-size:22px;font-weight:700;line-height:1.72;letter-spacing:-.005em;
  margin:0 0 22px;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:2px}
.opt{display:flex;align-items:center;gap:13px;width:100%;background:transparent;
  border:0;border-bottom:1px dashed var(--line);padding:14px 2px;text-align:left;
  font-family:var(--sans);font-size:15px;line-height:1.45;color:#4A3627;
  cursor:pointer;transition:opacity .15s,color .15s}
.opt .k{width:19px;height:19px;flex:0 0 auto;border:1.5px solid #B9A784;border-radius:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--paper)}
.opt.sel{color:var(--olive);font-weight:700}
.opt.sel .k{background:var(--olive);border-color:var(--olive)}
.opt.sel .k::after{content:'✓'}
.opt.dim{opacity:.34}
.qfoot{text-align:center;font-family:var(--kai);font-size:11px;letter-spacing:.1em;
  color:var(--dim);margin:0}

/* ---------- 结果 ---------- */
.rtop{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid var(--line);padding-bottom:10px}
.rname{font-family:var(--kai);font-size:clamp(40px,11.6vw,50px);font-weight:700;
  line-height:1.3;margin:20px 0 0;color:var(--ink)}
.rtag{font-family:var(--kai);font-size:14px;letter-spacing:.06em;color:var(--olive);margin:10px 0 0}
.dims,.sec,.advice{margin-top:26px}
.seclab{font-family:var(--kai);font-size:11px;letter-spacing:.2em;color:var(--dim);margin:0 0 12px}
.dim-row{display:flex;align-items:baseline;gap:8px;margin:11px 0}
.dim-row .n{width:38px;flex:0 0 auto;font-family:var(--kai);font-size:13px;color:#5C4735}
.dim-row .dots{flex:1;height:1px;border-bottom:1px dotted #C9B88D;transform:translateY(-4px)}
.dim-row .v{width:30px;flex:0 0 auto;text-align:right;font-family:var(--kai);
  font-size:15px;color:var(--olive);font-weight:700}
.sec .body-text{font-size:13.5px;line-height:2.06;color:#57432F;margin:0;text-align:justify}
.traits{display:flex;flex-wrap:wrap;gap:7px}
.traits span{font-family:var(--kai);font-size:12px;letter-spacing:.08em;color:#5C4735;
  border:1px solid var(--line);padding:5px 12px;background:rgba(255,255,255,.35)}
.quote{font-family:var(--kai);font-size:18px;line-height:1.92;letter-spacing:.04em;
  margin:28px 0 0;padding:14px 0 14px 18px;border-left:2px solid var(--olive);color:var(--ink)}
.advice{border-top:1px dashed var(--line);padding-top:16px}
.advice p:last-child{margin:0;font-size:12.5px;line-height:1.95;color:#6E5B47}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.acts-row{display:flex;gap:10px}
.acts-row .btn{flex:1}
.rfoot{text-align:center;font-family:var(--kai);font-size:10px;letter-spacing:.2em;
  color:var(--dim);margin:26px 0 0}


/* ---------- 共用弹层 ---------- */
.modal{position:fixed;inset:0;background:rgba(8,10,9,.9);display:none;z-index:80;
  padding:24px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal.on{display:flex;flex-direction:column;align-items:center;justify-content:center}
.modal-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px;align-items:center}
.poster-img{width:100%;display:block;border-radius:3px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.modal-tip{font-size:12.5px;line-height:1.8;text-align:center;opacity:.62;margin:0}
.modal-x{margin-top:4px;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;
  font-size:13px;padding:9px 26px;border-radius:2px;letter-spacing:.08em;cursor:pointer}
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,12px);
  background:rgba(20,20,20,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:3px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:90;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

</style>
</head>
<body>
<div class="app">

  <!-- 封面 -->
  <section class="screen active" id="s-cover">
    <div class="cover">
      <div class="c-top">
        <span class="eyebrow">学 习 型 人 格 · STUDY PERSONA</span>
        <span class="eyebrow">NO. 10</span>
      </div>
      <h1 class="c-title">你是哪种<br><em>学习型人格</em>？</h1>
      <svg class="wave" viewBox="0 0 172 12" aria-hidden="true">
        <path d="M2 8 Q 12 2 22 8 T 42 8 T 62 8 T 82 8 T 102 8 T 122 8 T 142 8 T 168 8"
              fill="none" stroke="#6E8B3D" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <p class="lede">同样的两小时，有人能啃完一章，有人只是把书翻开了。差别不在智商，在你是靠什么把自己按在椅子上的。</p>
      <div class="cover-foot">
        <button class="btn" id="btnStart">开 始 测 试</button>
        <div class="facts"><span>20 题</span><span>约 90 秒</span><span>五种人格</span></div>
      </div>
    </div>
  </section>

  <!-- 答题 -->
  <section class="screen" id="s-quiz">
    <div class="qtop"><span class="q-no" id="qCount">01 / 20</span><span class="q-pct" id="qPct">5%</span></div>
    <div class="qtrack"><i id="qBar"></i></div>
    <div class="qwrap">
      <p class="qkicker">如 果 是 你</p>
      <h2 class="qtext" id="qText"></h2>
      <div class="opts" id="opts"></div>
    </div>
    <p class="qfoot">按真实情况选，不是你应该的样子</p>
  </section>

  <!-- 结果 -->
  <section class="screen" id="s-result">
    <div class="rtop"><span class="eyebrow">STUDY REPORT</span><span class="eyebrow" id="rNo">NO.0000</span></div>
    <h2 class="rname" id="rTitle"></h2>
    <p class="rtag" id="rTag"></p>

    <div class="dims">
      <p class="seclab">三 项 得 分</p>
      <div id="rDims"></div>
    </div>
    <div class="sec">
      <p class="seclab">你 是 怎 么 学 的</p>
      <p class="body-text" id="rAnalysis"></p>
    </div>
    <div class="sec">
      <p class="seclab">关 键 词</p>
      <div class="traits" id="rTraits"></div>
    </div>
    <p class="quote" id="rLine"></p>
    <div class="advice">
      <p class="seclab">批 注</p>
      <p id="rAdvice"></p>
    </div>

    <div class="acts">
      <button class="btn" id="btnPoster">生成学习报告</button>
      <div class="acts-row">
        <button class="btn ghost" id="btnShare">复制链接</button>
        <button class="btn ghost" id="btnAgain">再测一次</button>
      </div>
    </div>
    <p class="rfoot">STUDY PERSONA REPORT</p>
  </section>

</div>

<div class="modal" id="modal">
  <div class="modal-card" id="modalBody"></div>
  <button class="modal-x" onclick="closeModal()">关闭</button>
</div>
<div class="toast" id="toast"></div>

/* ===== 共用引擎：抽题 / 打乱 / 计分 / 弹层 / 通用画笔 =====
   每个主题只提供 SKIN 对象和 TEST 数据，其余都走这里。 */

const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';

/* ---------- 二维码（每套主题在 data.js 里配） ---------- */
let QR_IMG = null;
if (TEST.qrImage){
  QR_IMG = new Image();
  QR_IMG.src = TEST.qrImage;
}

/* ---------- 工具 ---------- */
function shuffleArr(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 按维度配比抽题：slots 之和 = TEST.quizLen */
function drawQuiz(){
  const picked = [];
  const slots = shuffleArr(TEST.slots.slice());
  TEST.dims.forEach((m, di) => {
    const pool = shuffleArr(TEST.bank.filter(x => x.d === di));
    picked.push.apply(picked, pool.slice(0, slots[di]));
  });
  return shuffleArr(picked);
}

/* ---------- 状态 ---------- */
const state = { i:0, scores:[], drawn:[], opts:[], total:0, result:null, dims:null };
let locked = false;

/* ---------- 流程 ---------- */
function startQuiz(){
  state.i = 0;
  state.scores = [];
  state.drawn = drawQuiz();
  state.opts = state.drawn.map(q => shuffleArr(q.o.map(o => ({ t:o[0], s:o[1] }))));
  locked = false;
  SKIN.goQuiz();
  SKIN.renderQuestion();
}

function choose(score, el){
  if (locked) return;
  locked = true;
  if (el) el.classList.add('sel');
  state.scores.push(score);
  SKIN.afterChoose(el, score);
  setTimeout(() => {
    locked = false;
    if (state.i < TEST.quizLen - 1){
      state.i++;
      SKIN.renderQuestion();
    } else {
      finish();
    }
  }, SKIN.advanceDelay || 240);
}

function finish(){
  state.total = state.scores.reduce((a,b) => a + b, 0);
  state.result = TEST.results.find(r => state.total >= r.min && state.total <= r.max) || TEST.results[0];

  const sum = [0,0,0], cnt = [0,0,0];
  state.drawn.forEach((q, i) => { sum[q.d] += state.scores[i]; cnt[q.d]++; });
  state.dims = TEST.dims.map((m, d) => ({
    name: m.name,
    pct: Math.max(TEST.pctFloor || 6, Math.min(100, Math.round(sum[d] / (cnt[d] * 3) * 100)))
  }));

  SKIN.goResult();
  SKIN.renderResult();
  window.scrollTo(0,0);
}

/* ---------- 弹层 ---------- */
function openModal(html){
  $('modalBody').innerHTML = html;
  $('modal').classList.add('on');
}
function closeModal(){ $('modal').classList.remove('on'); }

function showPoster(){
  const url = SKIN.buildPoster();
  openModal('<img class="poster-img" src="' + url + '" alt="测试结果海报">'
    + '<p class="modal-tip">长按图片保存到相册<br>电脑上右键另存为</p>');
}

function copyLink(){
  const url = location.href;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(
      () => toast('链接已复制'),
      () => toast('长按地址栏复制链接')
    );
  } else {
    toast('长按地址栏复制链接');
  }
}

let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1900);
}

/* ---------- 画布通用件 ---------- */
function makeCanvas(w, h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function wrapLines(g, text, maxW){
  const out = []; let line = '';
  for (const ch of text){
    if (g.measureText(line + ch).width > maxW && line){ out.push(line); line = ch; }
    else line += ch;
  }
  if (line) out.push(line);
  return out;
}
/* 防伪扭索纹：r = R + A·sin(Nθ) 旋转复制 */
function drawRosette(g, cx, cy, R, amp, N, P, steps, color, alpha, lw){
  g.save();
  g.strokeStyle = color; g.globalAlpha = alpha; g.lineWidth = lw || 0.9;
  for (let k = 0; k < P; k++){
    const rot = k * 2 * Math.PI / (N * P);
    g.beginPath();
    for (let i = 0; i <= steps; i++){
      const t = i / steps * Math.PI * 2;
      const r = R + amp * Math.sin(N * t);
      const a = t + rot;
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  }
  g.restore();
}
function roundRect(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

/* ===== 学习型人格 · 界面层 ===== */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0, 0);
}
const SANS = '"PingFang SC","Microsoft YaHei",sans-serif';
const KAI = '"Kaiti SC","KaiTi","STKaiti","Songti SC",serif';
const PAPER = '#FBF3D5', INK = '#3B2B1F', OLIVE = '#6E8B3D';
const DIM = '#93816A', LINE = '#E0D2A4';

/* 手画的一道波浪线 */
function wave(g, x, y, w, color){
  g.strokeStyle = color; g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath();
  g.moveTo(x, y);
  const seg = 40, n = Math.round(w / seg);
  for (let i = 0; i < n; i++){
    const x0 = x + i * seg;
    g.quadraticCurveTo(x0 + seg / 2, y - 6, x0 + seg, y);
  }
  g.stroke();
  g.lineWidth = 1;
}

const SKIN = {
  advanceDelay: 250,

  goQuiz(){ show('s-quiz'); },
  goResult(){ show('s-result'); },

  renderQuestion(){
    const i = state.i;
    const pct = (i + 1) / TEST.quizLen * 100;
    $('qCount').textContent = String(i + 1).padStart(2, '0') + ' / ' + TEST.quizLen;
    $('qPct').textContent = Math.round(pct) + '%';
    $('qBar').style.width = pct + '%';
    $('qText').textContent = state.drawn[i].q;

    const box = $('opts');
    box.innerHTML = '';
    state.opts[i].forEach((o, k) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      const key = document.createElement('span');
      key.className = 'k';
      const tx = document.createElement('span');
      tx.className = 't'; tx.textContent = o.t;
      b.appendChild(key); b.appendChild(tx);
      b.addEventListener('click', () => choose(o.s, b));
      box.appendChild(b);
    });
  },

  afterChoose(el){
    document.querySelectorAll('.opt').forEach(x => { if (x !== el) x.classList.add('dim'); });
  },

  renderResult(){
    const r = state.result, t = state.total;
    $('rNo').textContent = 'NO.' + String(1000 + t * 37).slice(-4);
    $('rTitle').textContent = r.title;
    $('rTag').textContent = r.tag;
    $('rAnalysis').textContent = r.analysis;
    $('rTraits').innerHTML = r.traits.map(x => '<span>' + x + '</span>').join('');
    $('rLine').textContent = r.line;
    $('rAdvice').textContent = r.advice;
    $('rDims').innerHTML = state.dims.map(d =>
      '<div class="dim-row"><span class="n">' + d.name + '</span>'
      + '<span class="dots"></span>'
      + '<span class="v">' + d.pct + '</span></div>'
    ).join('');
  },

  buildPoster(){
    const W = 750, H = 1200;
    const c = makeCanvas(W, H), g = c.getContext('2d');
    const r = state.result, M = 108, R = W - 62;

    g.fillStyle = PAPER; g.fillRect(0, 0, W, H);

    // 横线 + 左边距红线
    g.strokeStyle = 'rgba(59,43,31,.075)'; g.lineWidth = 1;
    for (let y = 24; y < H; y += 34){
      g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
    }
    g.strokeStyle = 'rgba(217,139,114,.55)';
    g.beginPath(); g.moveTo(96, 0); g.lineTo(96, H); g.stroke();

    // 抬头
    g.fillStyle = DIM; g.font = '10px ' + KAI;
    g.fillText('STUDY PERSONA REPORT', M, 84);
    g.textAlign = 'right';
    g.fillText('NO. ' + String(1000 + state.total * 37).slice(-4), R, 84);
    g.textAlign = 'left';

    // 名字
    g.fillStyle = INK; g.font = '700 76px ' + KAI;
    g.fillText(r.title, M, 210);
    wave(g, M + 2, 240, 60 + r.title.length * 72, OLIVE);

    g.fillStyle = OLIVE; g.font = '17px ' + KAI;
    g.fillText(r.tag, M, 292);

    // 三维度：点线引导
    let dy = 356;
    state.dims.forEach(d => {
      g.fillStyle = '#5C4735'; g.font = '15px ' + KAI;
      g.fillText(d.name, M, dy);
      g.strokeStyle = '#C9B88D'; g.lineWidth = 1.5;
      g.setLineDash([2, 5]);
      g.beginPath(); g.moveTo(M + 62, dy - 5); g.lineTo(R - 48, dy - 5); g.stroke();
      g.setLineDash([]);
      g.fillStyle = OLIVE; g.font = '700 18px ' + KAI;
      g.textAlign = 'right'; g.fillText(String(d.pct), R, dy);
      g.textAlign = 'left';
      dy += 46;
    });

    // 正文
    const AT = 512;
    g.fillStyle = '#57432F'; g.font = '15.5px ' + SANS;
    const al = wrapLines(g, r.analysis, R - M).slice(0, 5);
    al.forEach((ln, i) => g.fillText(ln, M, AT + i * 34));

    // 金句
    const qy = Math.min(772, AT + (al.length - 1) * 34 + 68);
    g.font = '20px ' + KAI;
    const ql = wrapLines(g, r.line, R - M - 20).slice(0, 2);
    g.fillStyle = OLIVE; g.fillRect(M - 16, qy - 26, 3, ql.length > 1 ? 82 : 46);
    g.fillStyle = INK;
    ql.forEach((ln, i) => g.fillText(ln, M - 2, qy + i * 36));

    // 批注：贴在正文与页脚之间，斜一点
    const qEnd = qy + (ql.length > 1 ? 82 : 46);
    g.font = '15px ' + KAI;
    const adv = wrapLines(g, r.advice, R - M - 60).slice(0, 2);
    const nw = R - M, nh = 44 + adv.length * 27;
    const ny = qEnd + Math.max(24, (1000 - qEnd - nh) / 2);
    g.save();
    g.translate(M + nw / 2, ny + nh / 2);
    g.rotate(-1.4 * Math.PI / 180);
    g.fillStyle = '#F3E7B8';
    g.fillRect(-nw / 2, -nh / 2, nw, nh);
    g.fillStyle = '#8A7844'; g.font = '11px ' + KAI;
    g.fillText('批 注', -nw / 2 + 20, -nh / 2 + 26);
    g.fillStyle = '#4A3A28'; g.font = '15px ' + KAI;
    adv.forEach((ln, i) => g.fillText(ln, -nw / 2 + 20, -nh / 2 + 54 + i * 27));
    g.restore();

    // 关键词
    g.fillStyle = '#6E5B47'; g.font = '15px ' + KAI;
    g.fillText(r.traits.join('    ·    '), M, 1012);

    g.strokeStyle = '#DCCB9C'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(M, 1036); g.lineTo(R, 1036); g.stroke();

    const qs = 96, qx = R - qs, qy2 = 1052;
    g.fillStyle = '#FFFFFF';
    roundRect(g, qx - 8, qy2 - 8, qs + 16, qs + 16, 2); g.fill();
    if (QR_IMG) g.drawImage(QR_IMG, qx, qy2, qs, qs);
    else {
      g.fillStyle = '#C9B88D'; g.font = '12px ' + SANS; g.textAlign = 'center';
      g.fillText('二维码', qx + qs / 2, qy2 + 46);
      g.fillText('放这里', qx + qs / 2, qy2 + 66);
      g.textAlign = 'left';
    }
    g.fillStyle = INK; g.font = '700 16px ' + KAI;
    const cl = wrapLines(g, TEST.qrCaption, 450).slice(0, 2);
    cl.forEach((ln, i) => g.fillText(ln, M, 1080 + i * 27));
    g.fillStyle = '#A6977E'; g.font = '11px ' + KAI;
    g.fillText('仅供娱乐 · 不构成学习方法建议', M, 1170);

    return c.toDataURL('image/png');
  }
};

$('btnStart').addEventListener('click', startQuiz);
$('btnAgain').addEventListener('click', startQuiz);
$('btnPoster').addEventListener('click', showPoster);
$('btnShare').addEventListener('click', copyLink);
