<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3EBDD">
<title>你上辈子是什么动物？动物转世档案</title>
<meta name="description" content="野性、群居、敏锐三项残留，测出你的动物前身：鹤、鹿、猫、狐、狼。20 道题，凭第一反应作答。">
<style>
/* ===== 你上辈子是什么动物 · 米纸 / 深绢紫 / 铜金 转世票根 ===== */
:root{
  --paper:#F3EBDD; --deep:#1B1730; --gold:#C08A3E; --gold2:#D8A657;
  --ink:#231C36; --muted:#7C7189; --line:#DED3C0; --card:#FBF6EC;
  --serif:"Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
.app{max-width:430px;margin:0 auto;position:relative;min-height:100vh;min-height:100dvh}
.screen{display:none;flex-direction:column;min-height:100vh;min-height:100dvh;
  padding:24px 22px calc(26px + env(safe-area-inset-bottom))}
.screen.active{display:flex}
.eyebrow{font-family:var(--serif);font-size:9px;letter-spacing:.32em;color:var(--muted)}
.btn{display:block;width:100%;border:0;background:var(--deep);color:var(--paper);
  font-family:var(--serif);font-size:15px;letter-spacing:.3em;text-indent:.3em;
  padding:16px 12px;cursor:pointer;border-radius:2px}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);
  font-size:12px;letter-spacing:.14em;text-indent:.14em;padding:12px 8px}

/* ---------- 票根封面 ---------- */
.cover{flex:1;display:flex;flex-direction:column;justify-content:center}
.ticket{position:relative;background:var(--deep);color:var(--paper);
  padding:24px 24px 18px;border:1px solid rgba(216,166,87,.5);border-radius:3px}
.ticket::before,.ticket::after{content:'';position:absolute;top:-8px;width:16px;height:16px;
  border-radius:50%;background:var(--paper)}
.ticket::before{left:-8px}
.ticket::after{right:-8px}
.tk-top{display:flex;justify-content:space-between;align-items:center;
  font-family:var(--serif);font-size:8.5px;letter-spacing:.28em;color:rgba(243,235,221,.55)}
.tk-top b{color:var(--gold2);font-weight:400}
.c-title{font-family:var(--serif);font-size:clamp(30px,8.8vw,38px);font-weight:600;
  line-height:1.46;letter-spacing:.04em;margin:22px 0 0;color:var(--paper)}
.tk-sub{font-size:11px;letter-spacing:.22em;color:rgba(243,235,221,.55);margin:16px 0 0}
.perf{position:relative;margin:22px -24px 16px;border-top:1px dashed rgba(216,166,87,.45)}
.perf::before,.perf::after{content:'';position:absolute;top:-9px;width:16px;height:16px;
  border-radius:50%;background:var(--paper)}
.perf::before{left:-8px}
.perf::after{right:-8px}
.tk-stub{display:flex;justify-content:space-between;align-items:baseline}
.tk-stub span{font-family:var(--serif);font-size:9px;letter-spacing:.3em;color:var(--gold2)}
.tk-stub b{font-family:var(--serif);font-size:15px;letter-spacing:.3em;font-weight:400;
  color:rgba(243,235,221,.75)}
.lede{font-size:13px;line-height:1.95;color:#5F5568;margin:22px 0 0}
.cover-foot{display:flex;flex-direction:column;gap:14px;margin-top:24px}
.facts{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.14em;color:var(--muted)}

/* ---------- 答题 ---------- */
#s-quiz{padding-top:26px}
.qtop{display:flex;justify-content:space-between;align-items:baseline}
.q-no{font-family:var(--serif);font-size:12px;letter-spacing:.16em;color:var(--gold)}
.q-pct{font-size:10px;letter-spacing:.18em;color:var(--muted)}
.qtrack{height:2px;margin-top:13px;background:var(--line)}
.qtrack i{display:block;height:100%;width:var(--w,0);background:var(--gold);
  transform-origin:left;animation:grow .9s cubic-bezier(.2,.9,.3,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.qwrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:56px}
.qkicker{font-family:var(--serif);font-size:9px;letter-spacing:.38em;color:var(--muted);margin:0 0 16px}
.qtext{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.72;
  letter-spacing:.02em;margin:0 0 26px;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);
  border:1px solid var(--line);border-radius:2px;padding:15px 14px;text-align:left;
  font-family:var(--sans);font-size:14.5px;line-height:1.5;color:#3A3048;
  cursor:pointer;transition:border-color .15s,opacity .15s}
.opt .k{width:22px;flex:0 0 auto;text-align:center;font-family:var(--serif);
  font-size:12px;color:var(--gold)}
.opt.sel{border-color:var(--gold);background:#FFF9EC}
.opt.dim{opacity:.4}
.qfoot{text-align:center;font-family:var(--serif);font-size:10px;letter-spacing:.2em;
  color:var(--muted);margin:0}

/* ---------- 结果 ---------- */
.rtop{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid var(--line);padding-bottom:10px}
.rname{font-family:var(--serif);font-size:clamp(46px,13vw,58px);font-weight:600;
  line-height:1.14;letter-spacing:.08em;margin:24px 0 0;color:var(--deep)}
.rrule{width:56px;height:2px;background:var(--gold);margin:14px 0 0}
.rtag{font-size:12px;letter-spacing:.05em;color:var(--muted);margin:12px 0 0}
.dims,.sec,.advice{margin-top:26px}
.seclab{font-family:var(--serif);font-size:9px;letter-spacing:.3em;color:var(--muted);margin:0 0 12px}
.dim-row{display:flex;align-items:center;gap:11px;margin:12px 0}
.dim-row .n{width:40px;flex:0 0 auto;font-family:var(--serif);font-size:12px;color:#4A4058}
.dim-row .track{flex:1;height:3px;background:var(--line);position:relative}
.dim-row .track i{display:block;height:100%;width:var(--w,0);background:var(--gold);
  transform-origin:left;animation:grow .9s cubic-bezier(.2,.9,.3,1) both}
.dim-row .v{width:28px;flex:0 0 auto;text-align:right;font-family:var(--serif);
  font-size:10.5px;color:var(--muted)}
.body-text{font-size:13.5px;line-height:2.02;color:#3A3048;margin:0;text-align:justify}
.traits{display:flex;flex-wrap:wrap;gap:8px}
.traits span{font-family:var(--serif);font-size:12px;letter-spacing:.12em;color:#5A4A3A;
  border:1px solid var(--gold);border-radius:2px;padding:5px 12px}
.quote{font-family:var(--serif);font-size:17px;line-height:1.86;letter-spacing:.05em;
  margin:26px 0 0;padding:18px 20px;background:var(--card);color:var(--ink);
  border-left:2px solid var(--gold);border-right:1px solid var(--line)}
.advice{border-top:1px solid var(--line);padding-top:18px}
.advice p:last-child{margin:0;font-size:12.5px;line-height:1.95;color:#5F5568}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.acts-row{display:flex;gap:10px}
.acts-row .btn{flex:1}
.rfoot{text-align:center;font-family:var(--serif);font-size:8.5px;letter-spacing:.3em;
  color:var(--muted);margin:26px 0 0}

.modal-tip{color:#D9CFC0}


/* ---------- 共用弹层 ---------- */
.modal{position:fixed;inset:0;background:rgba(8,10,9,.9);display:none;z-index:80;
  padding:24px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal.on{display:flex;flex-direction:column;align-items:center;justify-content:center}
.modal-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px;align-items:center}
.poster-img{width:100%;display:block;border-radius:3px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.modal-tip{font-size:12.5px;line-height:1.8;text-align:center;opacity:.62;margin:0}
.modal-x{margin-top:4px;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;
  font-size:13px;padding:9px 26px;border-radius:2px;letter-spacing:.08em;cursor:pointer}
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,12px);
  background:rgba(20,20,20,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:3px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:90;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

</style>
</head>

<div class="app">

  <!-- 封面 -->
  <section class="screen active" id="s-cover">
    <div class="cover">

  <!-- 结果 -->
  <section class="screen" id="s-result">

      <p class="body-text" id="rAnalysis"></p>
    </div>
    <div class="sec">
      <p class="seclab">残 留 特 征</p>
      <div class="traits" id="rTraits"></div>
    </div>
    <p class="quote" id="rLine"></p>
    <div class="advice">
      <p class="seclab">今 生 提 醒</p>
      <p id="rAdvice"></p>
    </div>

    <div class="acts">
      <button class="btn" id="btnPoster">生成档案海报</button>
      <div class="acts-row">
        <button class="btn ghost" id="btnShare">复制链接</button>
        <button class="btn ghost" id="btnAgain">再测一次</button>
      </div>
    </div>
    <p class="rfoot">ANIMAL REINCARNATION ARCHIVE</p>
  </section>

</div>

<div class="modal" id="modal">
  <div class="modal-card" id="modalBody"></div>
  <button class="modal-x" onclick="closeModal()">关闭</button>
</div>

/* ===== 共用引擎：抽题 / 打乱 / 计分 / 弹层 / 通用画笔 =====
   每个主题只提供 SKIN 对象和 TEST 数据，其余都走这里。 */

const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';

/* ---------- 二维码（每套主题在 data.js 里配） ---------- */
let QR_IMG = null;
if (TEST.qrImage){
  QR_IMG = new Image();
  QR_IMG.src = TEST.qrImage;
}

/* ---------- 工具 ---------- */
function shuffleArr(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 按维度配比抽题：slots 之和 = TEST.quizLen */
function drawQuiz(){
  const picked = [];
  const slots = shuffleArr(TEST.slots.slice());
  TEST.dims.forEach((m, di) => {
    const pool = shuffleArr(TEST.bank.filter(x => x.d === di));
    picked.push.apply(picked, pool.slice(0, slots[di]));
  });
  return shuffleArr(picked);
}

/* ---------- 状态 ---------- */
const state = { i:0, scores:[], drawn:[], opts:[], total:0, result:null, dims:null };
let locked = false;

/* ---------- 流程 ---------- */
function startQuiz(){
  state.i = 0;
  state.scores = [];
  state.drawn = drawQuiz();
  state.opts = state.drawn.map(q => shuffleArr(q.o.map(o => ({ t:o[0], s:o[1] }))));
  locked = false;
  SKIN.goQuiz();
  SKIN.renderQuestion();
}

function choose(score, el){
  if (locked) return;
  locked = true;
  if (el) el.classList.add('sel');
  state.scores.push(score);
  SKIN.afterChoose(el, score);
  setTimeout(() => {
    locked = false;
    if (state.i < TEST.quizLen - 1){
      state.i++;
      SKIN.renderQuestion();
    } else {
      finish();
    }
  }, SKIN.advanceDelay || 240);
}

function finish(){
  state.total = state.scores.reduce((a,b) => a + b, 0);
  state.result = TEST.results.find(r => state.total >= r.min && state.total <= r.max) || TEST.results[0];

  const sum = [0,0,0], cnt = [0,0,0];
  state.drawn.forEach((q, i) => { sum[q.d] += state.scores[i]; cnt[q.d]++; });
  state.dims = TEST.dims.map((m, d) => ({
    name: m.name,
    pct: Math.max(TEST.pctFloor || 6, Math.min(100, Math.round(sum[d] / (cnt[d] * 3) * 100)))
  }));

  SKIN.goResult();
  SKIN.renderResult();
  window.scrollTo(0,0);
}

/* ---------- 弹层 ---------- */
function openModal(html){
  $('modalBody').innerHTML = html;
  $('modal').classList.add('on');
}
function closeModal(){ $('modal').classList.remove('on'); }

function showPoster(){
  const url = SKIN.buildPoster();
  openModal('<img class="poster-img" src="' + url + '" alt="测试结果海报">'
    + '<p class="modal-tip">长按图片保存到相册<br>电脑上右键另存为</p>');
}

function copyLink(){
  const url = location.href;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(
      () => toast('链接已复制'),
      () => toast('长按地址栏复制链接')
    );
  } else {
    toast('长按地址栏复制链接');
  }
}

let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1900);
}

/* ---------- 画布通用件 ---------- */
function makeCanvas(w, h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function wrapLines(g, text, maxW){
  const out = []; let line = '';
  for (const ch of text){
    if (g.measureText(line + ch).width > maxW && line){ out.push(line); line = ch; }
    else line += ch;
  }
  if (line) out.push(line);
  return out;
}
/* 防伪扭索纹：r = R + A·sin(Nθ) 旋转复制 */
function drawRosette(g, cx, cy, R, amp, N, P, steps, color, alpha, lw){
  g.save();
  g.strokeStyle = color; g.globalAlpha = alpha; g.lineWidth = lw || 0.9;
  for (let k = 0; k < P; k++){
    const rot = k * 2 * Math.PI / (N * P);
    g.beginPath();
    for (let i = 0; i <= steps; i++){
      const t = i / steps * Math.PI * 2;
      const r = R + amp * Math.sin(N * t);
      const a = t + rot;
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  }
  g.restore();
}
function roundRect(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

/* ===== 你上辈子是什么动物 · 界面层 ===== */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0, 0);
}
const SERIF = '"Songti SC","STSong","SimSun",serif';
const SANS = '"PingFang SC","Microsoft YaHei",sans-serif';
const PAPER = '#F3EBDD', DEEP = '#1B1730', GOLD = '#C08A3E', GOLD2 = '#D8A657';
const MUTED = '#7C7189', LINE = '#DED3C0', CARD = '#FBF6EC';

const SKIN = {
  advanceDelay: 260,

  goQuiz(){ show('s-quiz'); },
  goResult(){ show('s-result'); },

  renderQuestion(){
    const i = state.i;
    $('qCount').textContent = String(i + 1).padStart(2, '0') + ' / ' + TEST.quizLen;
    $('qPct').textContent = Math.round((i + 1) / TEST.quizLen * 100) + '%';
    $('qBar').style.width = ((i + 1) / TEST.quizLen * 100) + '%';
    $('qText').textContent = state.drawn[i].q;

    const box = $('opts');
    box.innerHTML = '';
    const K = ['一', '二', '三'];
    state.opts[i].forEach((o, k) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      const key = document.createElement('span');
      key.className = 'k'; key.textContent = K[k];
      const tx = document.createElement('span');
      tx.className = 't'; tx.textContent = o.t;
      b.appendChild(key); b.appendChild(tx);
      b.addEventListener('click', () => choose(o.s, b));
      box.appendChild(b);
    });
  },

  afterChoose(el){
    document.querySelectorAll('.opt').forEach(x => { if (x !== el) x.classList.add('dim'); });
  },

  renderResult(){
    const r = state.result, t = state.total;
    $('rNo').textContent = 'NO.' + String(1000 + t * 37).slice(-4);
    $('rTitle').textContent = r.title;
    $('rTag').textContent = r.tag;
    $('rAnalysis').textContent = r.analysis;
    $('rTraits').innerHTML = r.traits.map(x => '<span>' + x + '</span>').join('');
    $('rLine').textContent = r.line;
    $('rAdvice').textContent = r.advice;
    $('rDims').innerHTML = state.dims.map(d =>
      '<div class="dim-row"><span class="n">' + d.name + '</span>'
      + '<span class="track"><i style="--w:' + Math.max(4, d.pct) + '%"></i></span>'
      + '<span class="v">' + d.pct + '</span></div>'
    ).join('');
  },

  buildPoster(){
    const W = 750, H = 1200;
    const c = makeCanvas(W, H), g = c.getContext('2d');
    const r = state.result, M = 60, R = W - M;

    g.fillStyle = DEEP; g.fillRect(0, 0, W, H);

    // 金线边框
    g.strokeStyle = 'rgba(216,166,87,.55)'; g.lineWidth = 1.5;
    g.strokeRect(24.5, 24.5, W - 49, H - 49);

    // 票头
    g.fillStyle = 'rgba(243,235,221,.55)'; g.font = '10px ' + SERIF;
    g.fillText('R E I N C A R N A T I O N   A R C H I V E', M, 84);
    g.textAlign = 'right'; g.fillStyle = GOLD2;
    g.fillText('NO. ' + String(1000 + state.total * 37).slice(-4), R, 84);
    g.textAlign = 'left';

    g.strokeStyle = 'rgba(216,166,87,.35)'; g.lineWidth = 1;
    g.setLineDash([5, 5]);
    g.beginPath(); g.moveTo(M, 106); g.lineTo(R, 106); g.stroke();
    g.setLineDash([]);

    // 动物印
    g.save();
    g.translate(W / 2, 250);
    g.strokeStyle = GOLD; g.lineWidth = 2;
    g.beginPath(); g.arc(0, 0, 86, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = 'rgba(216,166,87,.45)'; g.lineWidth = 1;
    g.beginPath(); g.arc(0, 0, 96, 0, Math.PI * 2); g.stroke();
    g.fillStyle = GOLD2; g.font = '600 40px ' + SERIF;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('前 世', 0, 4);
    g.restore();
    g.textAlign = 'left'; g.textBaseline = 'alphabetic';

    // 名字
    g.fillStyle = PAPER; g.font = '600 64px ' + SERIF;
    g.textAlign = 'center';
    g.fillText(r.title, W / 2, 400);
    g.fillStyle = 'rgba(243,235,221,.55)'; g.font = '15px ' + SANS;
    g.fillText(r.tag, W / 2, 440);
    g.textAlign = 'left';

    let dx = W / 2 - 28;
    g.fillStyle = GOLD; g.fillRect(dx, 462, 56, 2);

    // 三维度
    let dy = 512;
    g.font = '12px ' + SERIF;
    state.dims.forEach(d => {
      g.fillStyle = 'rgba(243,235,221,.7)';
      g.fillText(d.name, M, dy + 4);
      g.fillStyle = 'rgba(243,235,221,.14)';
      g.fillRect(112, dy - 1, 486, 2);
      g.fillStyle = GOLD2;
      g.fillRect(112, dy - 1, 486 * d.pct / 100, 2);
      g.fillStyle = 'rgba(243,235,221,.45)'; g.font = '10.5px ' + SERIF;
      g.textAlign = 'right'; g.fillText(String(d.pct), R, dy + 4);
      g.textAlign = 'left'; g.font = '12px ' + SERIF;
      dy += 44;
    });

    // 档案正文
    g.fillStyle = 'rgba(243,235,221,.82)'; g.font = '15px ' + SANS;
    const al = wrapLines(g, r.analysis, R - M).slice(0, 5);
    al.forEach((ln, i) => g.fillText(ln, M, 690 + i * 33));

    // 金句
    g.fillStyle = PAPER; g.font = '20px ' + SERIF;
    const ql = wrapLines(g, r.line, R - M).slice(0, 2);
    ql.forEach((ln, i) => g.fillText(ln, M, 868 + i * 34));

    // 特征
    g.fillStyle = 'rgba(216,166,87,.8)'; g.font = '12px ' + SERIF;
    g.fillText(r.traits.join('    ·    '), M, 940);

    // 票根脚
    g.strokeStyle = 'rgba(216,166,87,.3)'; g.setLineDash([5, 5]);
    g.beginPath(); g.moveTo(M, 976); g.lineTo(R, 976); g.stroke();
    g.setLineDash([]);

    const qs = 92, qx = R - qs, qy = 1000;
    g.fillStyle = PAPER;
    roundRect(g, qx - 7, qy - 7, qs + 14, qs + 14, 3); g.fill();
    if (QR_IMG) g.drawImage(QR_IMG, qx, qy, qs, qs);
    else {
      g.fillStyle = '#B4A791'; g.font = '12px ' + SANS; g.textAlign = 'center';
      g.fillText('二维码', qx + qs / 2, qy + 44);
      g.fillText('放这里', qx + qs / 2, qy + 64);
      g.textAlign = 'left';
    }

    g.fillStyle = PAPER; g.font = '600 16px ' + SERIF;
    const cl = wrapLines(g, TEST.qrCaption, 480).slice(0, 2);
    cl.forEach((ln, i) => g.fillText(ln, M, 1028 + i * 27));
    g.fillStyle = 'rgba(243,235,221,.35)'; g.font = '10.5px ' + SANS;
    g.fillText('仅供娱乐 · 不构成任何专业评价', M, 1128);

    return c.toDataURL('image/png');
  }
};

$('btnStart').addEventListener('click', startQuiz);
$('btnAgain').addEventListener('click', startQuiz);
$('btnPoster').addEventListener('click', showPoster);
$('btnShare').addEventListener('click', copyLink);
