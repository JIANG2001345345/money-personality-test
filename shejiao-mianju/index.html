<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C1030">
<title>测测你的社交隐藏面具 · 你是真社牛还是假社恐</title>
<meta name="description" content="每个人都戴着面具进场，区别在于散场之后还摘不摘得下来。20 道题测出你在人群里的真实角色。">
<style>
/* ===== 社交隐藏面具 · 剧场节目单 ===== */
:root{
  --plum:#1C1030; --plum-2:#2A1846; --plum-3:#3A2358;
  --cream:#F6EFE2; --cream-2:#EADFCB;
  --yellow:#FFD84D; --coral:#FF6B4A; --lilac:#B9A7D6; --muted:#9C8FB8;
  --sans:"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif;
  --round:"Arial Rounded MT Bold","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--plum);color:var(--cream);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:
    radial-gradient(70% 42% at 50% -6%,rgba(255,216,77,.20),transparent 70%),
    radial-gradient(50% 30% at 12% 102%,rgba(255,107,74,.16),transparent 70%);
  background-attachment:fixed;
}
.app{max-width:430px;margin:0 auto;position:relative;min-height:100vh;min-height:100dvh}
.screen{display:none;flex-direction:column;min-height:100vh;min-height:100dvh;
  padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
.screen.active{display:flex}

/* ---------- 按钮 ---------- */
.btn{
  display:block;width:100%;border:0;border-radius:999px;background:var(--yellow);color:#241333;
  font-family:var(--sans);font-size:15px;font-weight:800;letter-spacing:.12em;text-indent:.12em;
  padding:17px 12px;cursor:pointer;
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--lilac);border:1px solid rgba(185,167,214,.45);
  font-weight:500;font-size:12.5px;letter-spacing:.1em;text-indent:.1em;padding:13px 8px}

/* ---------- 封面 ---------- */
.cover{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.tick-top{font-size:10px;letter-spacing:.34em;text-indent:.34em;color:var(--yellow);margin:0 0 18px}
.arch{
  width:100%;border:1px solid rgba(246,239,226,.28);border-radius:220px 220px 26px 26px;
  padding:46px 22px 34px;position:relative;background:rgba(42,24,70,.5);
  box-shadow:0 0 60px rgba(255,216,77,.10) inset;
}
.arch::before{
  content:"";position:absolute;left:50%;top:18px;transform:translateX(-50%);
  width:46px;height:4px;border-radius:2px;background:var(--coral);
}
.cover-title{
  font-family:var(--sans);font-weight:900;font-size:clamp(34px,10.5vw,44px);
  line-height:1.26;letter-spacing:.02em;margin:0;color:var(--cream);
}
.cover-title b{color:var(--yellow);font-weight:900}
.cover-title i{font-style:normal;color:var(--coral)}
.cover-sub{font-size:13.5px;line-height:2;color:var(--lilac);margin:18px 0 0}
.cover-sub b{color:var(--cream);font-weight:600}
.maskart{width:132px;height:94px;display:block;margin:-6px auto 10px;opacity:.95}

/* 票根撕口 */
.stub{position:relative;margin-top:22px;padding-top:20px}
.stub::before{
  content:"";position:absolute;left:0;right:0;top:0;height:1px;
  background:repeating-linear-gradient(90deg,rgba(246,239,226,.4) 0 6px,transparent 6px 12px);
}
.stub::after{
  content:"";position:absolute;left:-20px;top:-9px;width:18px;height:18px;border-radius:50%;
  background:var(--plum);border-right:1px solid rgba(246,239,226,.25);
}
.stub i{
  position:absolute;right:-20px;top:-9px;width:18px;height:18px;border-radius:50%;
  background:var(--plum);border-left:1px solid rgba(246,239,226,.25);
}
.facts{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);
  margin:0 0 14px;letter-spacing:.06em}

/* ---------- 答题 ---------- */
.dots{display:flex;gap:5px;margin:6px 0 0}
.dots i{flex:1;height:5px;border-radius:999px;background:rgba(246,239,226,.16)}
.dots i.on{background:var(--yellow)}
.qmeta{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 0;
  font-size:11px;color:var(--muted);letter-spacing:.1em}
.qmeta b{font-size:22px;color:var(--yellow);font-weight:800;letter-spacing:0}
.qwrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px 0 4px}
.card{
  background:var(--cream);color:#241333;border-radius:28px;padding:28px 22px 24px;
  box-shadow:0 18px 40px rgba(0,0,0,.35);
}
.qtext{font-size:20px;font-weight:800;line-height:1.6;margin:0 0 20px;color:#241333;letter-spacing:.01em}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:#fff;border:1.5px solid #E3D8C4;border-radius:999px;
  padding:12px 16px;cursor:pointer;color:#3A2C48;font-family:var(--sans);
  font-size:14.5px;line-height:1.5;transition:all .15s;
}
.opt .k{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--cream-2);
  color:#6B5A80;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.opt.sel{background:var(--plum);border-color:var(--plum);color:var(--cream);transform:scale(.99)}
.opt.sel .k{background:var(--yellow);color:#241333}
.hint{font-size:11px;letter-spacing:.14em;color:var(--muted);text-align:center;margin:18px 0 0}

/* ---------- 结果 ---------- */
.poster-top{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em;
  color:var(--muted);margin:4px 0 0}
.r-hero{
  margin:14px 0 0;background:var(--cream);color:#241333;border-radius:26px;padding:24px 22px;
  position:relative;overflow:hidden;
}
.r-hero::before{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;
  border-radius:50%;background:var(--yellow);opacity:.5}
.r-kicker{font-size:10px;letter-spacing:.28em;color:#8A7A9E;margin:0 0 8px;position:relative}
.r-title{font-size:34px;font-weight:900;line-height:1.2;margin:0;position:relative;letter-spacing:.01em}
.r-tag{display:inline-block;margin-top:10px;font-size:11.5px;font-weight:700;color:#241333;
  background:var(--coral);color:#fff;padding:5px 12px;border-radius:999px;position:relative}
.r-score{display:flex;align-items:baseline;gap:8px;margin:16px 0 0;position:relative}
.r-score .n{font-size:40px;font-weight:900;line-height:1;color:#241333}
.r-score .u{font-size:12px;color:#8A7A9E;letter-spacing:.08em}
.bar{height:10px;border-radius:999px;background:#E3D8C4;margin:10px 0 0;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:999px;width:var(--w,0);
  background:var(--coral);
  transform-origin:left center;animation:grow .9s cubic-bezier(.2,.9,.3,1) .2s both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.dims{margin:20px 0 0;display:flex;flex-direction:column;gap:12px}
.dim-row{display:flex;align-items:center;gap:12px}
.dim-row .n{font-size:12.5px;color:var(--lilac);width:70px;flex:0 0 auto}
.dim-row .track{flex:1;height:8px;border-radius:999px;background:rgba(246,239,226,.13);position:relative;overflow:hidden}
.dim-row .track i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;
  background:var(--yellow);width:var(--w,0);transform-origin:left center;
  animation:grow .9s cubic-bezier(.2,.9,.3,1) .3s both}
.dim-row .v{font-size:11px;color:var(--muted);width:26px;text-align:right}
.sec{margin-top:24px}
.sec h3{font-size:11px;letter-spacing:.22em;color:var(--yellow);margin:0 0 10px;font-weight:700}
.body-text{font-size:14px;line-height:2;color:#CBBEDD;margin:0;text-align:justify}
.traits{display:flex;flex-wrap:wrap;gap:8px}
.traits span{font-size:11.5px;color:var(--cream);border:1px solid rgba(246,239,226,.3);
  border-radius:999px;padding:6px 13px}
.quote{margin:24px 0 0;background:rgba(255,216,77,.10);border-radius:20px;padding:18px 20px;
  font-size:16px;font-weight:800;line-height:1.8;color:var(--yellow);text-align:center}
.advice{margin:18px 0 0;font-size:13px;line-height:1.9;color:var(--muted);
  border-left:3px solid var(--coral);border-radius:0 8px 8px 0;padding:2px 0 2px 14px}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.acts-row{display:flex;gap:10px}
.acts-row .btn{flex:1}

/* ---------- 弹层适配 ---------- */
.modal-tip{color:#CBBEDD}
.modal-x{border-color:rgba(246,239,226,.35);color:var(--yellow);border-radius:999px}


/* ---------- 共用弹层 ---------- */
.modal{position:fixed;inset:0;background:rgba(8,10,9,.9);display:none;z-index:80;
  padding:24px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal.on{display:flex;flex-direction:column;align-items:center;justify-content:center}
.modal-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px;align-items:center}
.poster-img{width:100%;display:block;border-radius:3px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.modal-tip{font-size:12.5px;line-height:1.8;text-align:center;opacity:.62;margin:0}
.modal-x{margin-top:4px;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;
  font-size:13px;padding:9px 26px;border-radius:2px;letter-spacing:.08em;cursor:pointer}
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,12px);
  background:rgba(20,20,20,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:3px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:90;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

</style>
</head>

<div class="app">

  <!-- 封面 -->
  <section class="screen active" id="s-cover">
    <div class="cover">
      <p class="tick-top">MASK THEATRE · 面具剧场</p>

    <div class="r-hero">

    </div>

    <div class="dims" id="rDims"></div>

    <div class="sec"><h3>角 色 设 定</h3><p class="body-text" id="rAnalysis"></p></div>
    <div class="sec"><h3>台 词 特 征</h3><div class="traits" id="rTraits"></div></div>
    <p class="quote" id="rLine"></p>
    <p class="advice" id="rAdvice"></p>

    <div class="acts">
      <button class="btn" id="btnPoster">生成我的角色卡</button>
      <div class="acts-row">
        <button class="btn ghost" id="btnShare">复制链接</button>
        <button class="btn ghost" id="btnAgain">再测一次</button>
      </div>
    </div>
  </section>

</div>

<div class="modal" id="modal">
  <div class="modal-card" id="modalBody"></div>
  <button class="modal-x" onclick="closeModal()">关闭</button>
</div>
<div class="toast" id="toast"></div>

  const picked = [];
  const slots = shuffleArr(TEST.slots.slice());
  TEST.dims.forEach((m, di) => {
    const pool = shuffleArr(TEST.bank.filter(x => x.d === di));
    picked.push.apply(picked, pool.slice(0, slots[di]));
  });
  return shuffleArr(picked);
}

/* ---------- 状态 ---------- */
const state = { i:0, scores:[], drawn:[], opts:[], total:0, result:null, dims:null };
let locked = false;

/* ---------- 流程 ---------- */
function startQuiz(){
  state.i = 0;
  state.scores = [];
  state.drawn = drawQuiz();
  state.opts = state.drawn.map(q => shuffleArr(q.o.map(o => ({ t:o[0], s:o[1] }))));
  locked = false;
  SKIN.goQuiz();
  SKIN.renderQuestion();
}

function choose(score, el){
  if (locked) return;
  locked = true;
  if (el) el.classList.add('sel');
  state.scores.push(score);
  SKIN.afterChoose(el, score);
  setTimeout(() => {
    locked = false;
    if (state.i < TEST.quizLen - 1){
      state.i++;
      SKIN.renderQuestion();
    } else {
      finish();
    }
  }, SKIN.advanceDelay || 240);
}

function finish(){
  state.total = state.scores.reduce((a,b) => a + b, 0);
  state.result = TEST.results.find(r => state.total >= r.min && state.total <= r.max) || TEST.results[0];

  const sum = [0,0,0], cnt = [0,0,0];
  state.drawn.forEach((q, i) => { sum[q.d] += state.scores[i]; cnt[q.d]++; });
  state.dims = TEST.dims.map((m, d) => ({
    name: m.name,
    pct: Math.max(TEST.pctFloor || 6, Math.min(100, Math.round(sum[d] / (cnt[d] * 3) * 100)))
  }));

  SKIN.goResult();
  SKIN.renderResult();
  window.scrollTo(0,0);
}

/* ---------- 弹层 ---------- */
function openModal(html){
  $('modalBody').innerHTML = html;
  $('modal').classList.add('on');
}
function closeModal(){ $('modal').classList.remove('on'); }

function showPoster(){
  const url = SKIN.buildPoster();
  openModal('<img class="poster-img" src="' + url + '" alt="测试结果海报">'
    + '<p class="modal-tip">长按图片保存到相册<br>电脑上右键另存为</p>');
}

function copyLink(){
  const url = location.href;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(
      () => toast('链接已复制'),
      () => toast('长按地址栏复制链接')
    );
  } else {
    toast('长按地址栏复制链接');
  }
}

let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1900);
}

/* ---------- 画布通用件 ---------- */
function makeCanvas(w, h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function wrapLines(g, text, maxW){
  const out = []; let line = '';
  for (const ch of text){
    if (g.measureText(line + ch).width > maxW && line){ out.push(line); line = ch; }
    else line += ch;
  }
  if (line) out.push(line);
  return out;
}
/* 防伪扭索纹：r = R + A·sin(Nθ) 旋转复制 */
function drawRosette(g, cx, cy, R, amp, N, P, steps, color, alpha, lw){
  g.save();
  g.strokeStyle = color; g.globalAlpha = alpha; g.lineWidth = lw || 0.9;
  for (let k = 0; k < P; k++){
    const rot = k * 2 * Math.PI / (N * P);
    g.beginPath();
    for (let i = 0; i <= steps; i++){
      const t = i / steps * Math.PI * 2;
      const r = R + amp * Math.sin(N * t);
      const a = t + rot;
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  }
  g.restore();
}
function roundRect(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

/* ===== 社交隐藏面具 · 界面层 ===== */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0, 0);
}

const SKIN = {
  advanceDelay: 230,

  goQuiz(){
    let h = '';
    for (let k = 0; k < TEST.quizLen; k++) h += '<i></i>';
    $('dots').innerHTML = h;
    show('s-quiz');
  },
  goResult(){ show('s-result'); },

  renderQuestion(){
    const i = state.i;
    $('qIdx').textContent = String(i + 1).padStart(2, '0');
    $('qPct').textContent = Math.round((i + 1) / TEST.quizLen * 100) + '%';
    document.querySelectorAll('#dots i').forEach((el, k) => el.classList.toggle('on', k <= i));
    $('qText').textContent = state.drawn[i].q;

    const box = $('opts');
    box.innerHTML = '';
    state.opts[i].forEach((o, idx) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      const k = document.createElement('span'); k.className = 'k'; k.textContent = 'ABC'[idx];
      const t = document.createElement('span'); t.className = 't'; t.textContent = o.t;
      b.appendChild(k); b.appendChild(t);
      b.addEventListener('click', () => choose(o.s, b));
      box.appendChild(b);
    });
  },

  afterChoose(el){ /* .sel 由 CSS 完成 */ },

  renderResult(){
    const r = state.result, t = state.total;
    $('rNo').textContent = 'NO.' + String(1000 + t * 23).slice(-4);
    $('rTitle').textContent = r.title;
    $('rTag').textContent = r.tag;
    $('rScore').textContent = t;
    $('rBar').style.setProperty('--w', Math.round((t - 20) / 40 * 100) + '%');
    $('rAnalysis').textContent = r.analysis;
    $('rTraits').innerHTML = r.traits.map(x => '<span>' + x + '</span>').join('');
    $('rLine').textContent = r.line;
    $('rAdvice').textContent = r.advice;
    $('rDims').innerHTML = state.dims.map(d =>
      '<div class="dim-row"><span class="n">' + d.name + '</span>'
      + '<span class="track"><i style="--w:' + d.pct + '%"></i></span>'
      + '<span class="v">' + d.pct + '</span></div>'
    ).join('');
  },

  buildPoster(){
    const W = 750, H = 1200;
    const c = makeCanvas(W, H), g = c.getContext('2d');
    const r = state.result, t = state.total, pct = Math.round((t - 20) / 40 * 100);

    g.fillStyle = '#1C1030'; g.fillRect(0, 0, W, H);
    const glow = g.createRadialGradient(W / 2, -80, 40, W / 2, -80, 760);
    glow.addColorStop(0, 'rgba(255,216,77,.30)'); glow.addColorStop(1, 'rgba(255,216,77,0)');
    g.fillStyle = glow; g.fillRect(0, 0, W, 700);

    // 卡片
    const CX = 52, CY = 70, CW = W - CX * 2, CH = 1064;
    g.fillStyle = 'rgba(0,0,0,.30)';
    roundRect(g, CX + 8, CY + 12, CW, CH, 44); g.fill();
    g.fillStyle = '#F6EFE2';
    roundRect(g, CX, CY, CW, CH, 44); g.fill();

    const L = CX + 46, R = CX + CW - 46;

    // 抬头
    g.fillStyle = '#8A7A9E';
    g.font = '17px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText('MASK THEATRE · 面具剧场', L, CY + 62);
    g.textAlign = 'right';
    g.fillText('NO.' + String(1000 + t * 23).slice(-4), R, CY + 62);
    g.textAlign = 'left';

    // 标题
    g.fillStyle = '#241333';
    g.font = '900 62px "PingFang SC","Microsoft YaHei",sans-serif';
    const tl = wrapLines(g, r.title, R - L);
    let ty = CY + 146;
    tl.forEach(ln => { g.fillText(ln, L, ty); ty += 74; });

    // 标签胶囊
    const tagY = ty - 30;
    g.font = '20px "PingFang SC","Microsoft YaHei",sans-serif';
    const tw2 = g.measureText(r.tag).width;
    g.fillStyle = '#FF6B4A';
    roundRect(g, L, tagY, tw2 + 36, 40, 20); g.fill();
    g.fillStyle = '#FFFFFF';
    g.fillText(r.tag, L + 18, tagY + 27);

    // 分数
    const sy = tagY + 108;
    g.fillStyle = '#8A7A9E';
    g.font = '18px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText('社交外放值', L, sy);
    g.fillStyle = '#241333';
    g.font = '900 52px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText(String(t), L + 118, sy + 4);
    g.fillStyle = '#8A7A9E';
    g.font = '18px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText('/ 60', L + 118 + g.measureText(String(t)).width + 56, sy + 4);

    g.fillStyle = '#E3D8C4';
    roundRect(g, L, sy + 24, R - L, 12, 6); g.fill();
    g.fillStyle = '#FF6B4A';
    roundRect(g, L, sy + 24, Math.max(16, (R - L) * pct / 100), 12, 6); g.fill();

    // 三维
    let dy = sy + 92;
    state.dims.forEach(d => {
      g.fillStyle = '#6B5A80';
      g.font = '20px "PingFang SC","Microsoft YaHei",sans-serif';
      g.fillText(d.name, L, dy + 8);
      const tx = L + 138, twid = R - tx - 48;
      g.fillStyle = '#E3D8C4'; roundRect(g, tx, dy - 2, twid, 10, 5); g.fill();
      g.fillStyle = '#FFD84D'; roundRect(g, tx, dy - 2, Math.max(8, twid * d.pct / 100), 10, 5); g.fill();
      g.fillStyle = '#8A7A9E';
      g.font = '15px "PingFang SC","Microsoft YaHei",sans-serif';
      g.textAlign = 'right';
      g.fillText(String(d.pct), R, dy + 8);
      g.textAlign = 'left';
      dy += 52;
    });

    // 金句
    const qy = dy + 26;
    g.fillStyle = '#FFD84D';
    roundRect(g, L - 16, qy, R - L + 32, 118, 24); g.fill();
    g.fillStyle = '#241333';
    g.font = '800 28px "PingFang SC","Microsoft YaHei",sans-serif';
    const ql = wrapLines(g, r.line, R - L - 12);
    ql.slice(0, 3).forEach((ln, i) => {
      g.textAlign = 'center';
      g.fillText(ln, (L + R) / 2, qy + 50 + i * 38);
      g.textAlign = 'left';
    });

    // 建议
    g.fillStyle = '#6B5A80';
    g.font = '19px "PingFang SC","Microsoft YaHei",sans-serif';
    const al = wrapLines(g, r.advice, R - L).slice(0, 2);
    al.forEach((ln, i) => g.fillText(ln, L, qy + 170 + i * 30));

    // 特征胶囊
    g.font = '19px "PingFang SC","Microsoft YaHei",sans-serif';
    let px = L;
    const py = qy + 178 + al.length * 30;
    r.traits.forEach(tr => {
      const tw3 = g.measureText(tr).width + 34;
      g.strokeStyle = 'rgba(36,19,51,.18)'; g.lineWidth = 1.4;
      roundRect(g, px, py, tw3, 42, 21); g.stroke();
      g.fillStyle = '#4A3A60';
      g.fillText(tr, px + 17, py + 28);
      px += tw3 + 12;
    });

    // 底部
    const fy = CY + CH - 128;
    g.strokeStyle = 'rgba(36,19,51,.14)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(L, fy); g.lineTo(R, fy); g.stroke();

    const qs = 88, qx = R - qs, qy2 = fy + 14;
    g.fillStyle = '#fff'; g.fillRect(qx - 6, qy2 - 6, qs + 12, qs + 12);
    if (QR_IMG) g.drawImage(QR_IMG, qx, qy2, qs, qs);
    else {
      g.fillStyle = '#9C8FB8';
      g.font = '14px "PingFang SC","Microsoft YaHei",sans-serif';
      g.textAlign = 'center';
      g.fillText('二维码', qx + qs / 2, qy2 + 44);
      g.fillText('放这里', qx + qs / 2, qy2 + 66);
      g.textAlign = 'left';
    }

    g.fillStyle = '#241333';
    g.font = '800 21px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText(TEST.qrCaption, L, fy + 54);
    g.fillStyle = '#8A7A9E';
    g.font = '15px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText('仅供娱乐 · 不构成任何性格评价', L, fy + 84);

    return c.toDataURL('image/png');
  }
};

/* ---------- 绑定 ---------- */
$('btnStart').addEventListener('click', startQuiz);
$('btnAgain').addEventListener('click', startQuiz);
$('btnPoster').addEventListener('click', showPoster);
$('btnShare').addEventListener('click', copyLink);

</script>
