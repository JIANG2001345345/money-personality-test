@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

</style>
</head>

/* ===== 共用引擎：抽题 / 打乱 / 计分 / 弹层 / 通用画笔 =====
   每个主题只提供 SKIN 对象和 TEST 数据，其余都走这里。 */

const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';

/* ---------- 二维码（每套主题在 data.js 里配） ---------- */
let QR_IMG = null;
if (TEST.qrImage){
  QR_IMG = new Image();
  QR_IMG.src = TEST.qrImage;
}

/* ---------- 工具 ---------- */
function shuffleArr(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 按维度配比抽题：slots 之和 = TEST.quizLen */
function drawQuiz(){
  const picked = [];
  const slots = shuffleArr(TEST.slots.slice());
  TEST.dims.forEach((m, di) => {
    const pool = shuffleArr(TEST.bank.filter(x => x.d === di));
    picked.push.apply(picked, pool.slice(0, slots[di]));
  });
  return shuffleArr(picked);
}

/* ---------- 状态 ---------- */
const state = { i:0, scores:[], drawn:[], opts:[], total:0, result:null, dims:null };
let locked = false;

/* ---------- 流程 ---------- */
function startQuiz(){
  state.i = 0;
  state.scores = [];
  state.drawn = drawQuiz();
  state.opts = state.drawn.map(q => shuffleArr(q.o.map(o => ({ t:o[0], s:o[1] }))));
  locked = false;
  SKIN.goQuiz();
  SKIN.renderQuestion();
}

function choose(score, el){
  if (locked) return;
  locked = true;
  if (el) el.classList.add('sel');
  state.scores.push(score);
  SKIN.afterChoose(el, score);
  setTimeout(() => {
    locked = false;
    if (state.i < TEST.quizLen - 1){
      state.i++;
      SKIN.renderQuestion();
    } else {
      finish();
    }
  }, SKIN.advanceDelay || 240);
}

function finish(){
  state.total = state.scores.reduce((a,b) => a + b, 0);
  state.result = TEST.results.find(r => state.total >= r.min && state.total <= r.max) || TEST.results[0];

  const sum = [0,0,0], cnt = [0,0,0];
  state.drawn.forEach((q, i) => { sum[q.d] += state.scores[i]; cnt[q.d]++; });
  state.dims = TEST.dims.map((m, d) => ({
    name: m.name,
    pct: Math.max(TEST.pctFloor || 6, Math.min(100, Math.round(sum[d] / (cnt[d] * 3) * 100)))
  }));

  SKIN.goResult();
  SKIN.renderResult();
  window.scrollTo(0,0);
}

/* ---------- 弹层 ---------- */
function openModal(html){
  $('modalBody').innerHTML = html;
  $('modal').classList.add('on');
}
function closeModal(){ $('modal').classList.remove('on'); }

function showPoster(){
  const url = SKIN.buildPoster();
  openModal('<img class="poster-img" src="' + url + '" alt="测试结果海报">'
    + '<p class="modal-tip">长按图片保存到相册<br>电脑上右键另存为</p>');
}

function copyLink(){
  const url = location.href;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(
      () => toast('链接已复制'),
      () => toast('长按地址栏复制链接')
    );
  } else {
    toast('长按地址栏复制链接');
  }
}

let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1900);
}

/* ---------- 画布通用件 ---------- */
function makeCanvas(w, h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function wrapLines(g, text, maxW){
  const out = []; let line = '';
  for (const ch of text){
    if (g.measureText(line + ch).width > maxW && line){ out.push(line); line = ch; }
    else line += ch;
  }
  if (line) out.push(line);
  return out;
}
/* 防伪扭索纹：r = R + A·sin(Nθ) 旋转复制 */
function drawRosette(g, cx, cy, R, amp, N, P, steps, color, alpha, lw){
  g.save();
  g.strokeStyle = color; g.globalAlpha = alpha; g.lineWidth = lw || 0.9;
  for (let k = 0; k < P; k++){
    const rot = k * 2 * Math.PI / (N * P);
    g.beginPath();
    for (let i = 0; i <= steps; i++){
      const t = i / steps * Math.PI * 2;
      const r = R + amp * Math.sin(N * t);
      const a = t + rot;
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  }
  g.restore();
}
function roundRect(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

/* ===== 隐藏天赋 · 界面层 ===== */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

const SERIF = '"Songti SC","STSong","Noto Serif SC",serif';
const SANS = '"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif';
const LEAF_COL = { stem:'#4F6B4C', line:'#3F5A42', fill:'rgba(110,139,98,.18)' };

/* 蕨叶：茎为参数曲线，叶片沿茎两侧对生 */
function frondPoint(box, t, p){
  const w = box[2], h = box[3];
  return [
    box[0] + w * (.50 + p.bend * Math.sin(t * 2.3) - p.lean * t),
    box[1] + h * (1 - t)
  ];
}
function drawFrond(g, box, p, col){
  const w = box[2];
  const N = p.n;
  g.save();
  g.lineCap = 'round';
  g.lineJoin = 'round';

  // 茎
  g.beginPath();
  for (let i = 0; i <= 48; i++){
    const pt = frondPoint(box, i / 48, p);
    i ? g.lineTo(pt[0], pt[1]) : g.moveTo(pt[0], pt[1]);
  }
  g.strokeStyle = col.stem;
  g.lineWidth = Math.max(1, w * .011);
  g.stroke();

  // 小叶
  for (let i = 0; i < N; i++){
    const t = .08 + .86 * i / (N - 1);
    const a = frondPoint(box, t, p);
    const b = frondPoint(box, Math.min(1, t + .02), p);
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    const grow = .55 + .45 * Math.min(1, t * 4);
    const L = w * (.30 + .16 * Math.sin(Math.PI * (.16 + .74 * t)))
            * p.len * grow * (1 - .28 * t);
    for (const s of [-1, 1]){
      g.save();
      g.translate(a[0], a[1]);
      g.rotate(ang + s * (1.02 - .12 * t));
      g.beginPath();
      g.moveTo(0, 0);
      g.bezierCurveTo(L * .24, -L * .34, L * .70, -L * .26, L, 0);
      g.bezierCurveTo(L * .70, L * .17, L * .24, L * .22, 0, 0);
      g.fillStyle = col.fill; g.fill();
      g.strokeStyle = col.line; g.lineWidth = Math.max(.8, w * .005); g.stroke();
      g.beginPath(); g.moveTo(L * .10, 0); g.lineTo(L * .84, 0); g.stroke();
      g.restore();
    }
  }
  g.restore();
}

function grain(g, W, H, alpha){
  const n = makeCanvas(110, 110), ng = n.getContext('2d');
  const img = ng.createImageData(110, 110), d = img.data;
  for (let i = 0; i < d.length; i += 4){
    const v = 128 + (Math.random() * 48 - 24);
    d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
  }
  ng.putImageData(img, 0, 0);
  g.save();
  g.globalAlpha = alpha;
  g.globalCompositeOperation = 'overlay';
  g.fillStyle = g.createPattern(n, 'repeat');
  g.fillRect(0, 0, W, H);
  g.restore();
}
