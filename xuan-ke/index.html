<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15181C">
<title>选物理还是历史？20 题测出你的选科倾向</title>
<meta name="description" content="抽象、记忆、表达三个方向，测出你该走物理线还是历史线：硬核派、工程派、文理兼修、思辨派，还是表达派。">
<style>
/* ===== 选物理还是历史 · 墨黑 / 米黄 / 朱红 · 岔路 ===== */
:root{
  --bg:#15181C; --bg2:#1B1F25; --cream:#E8DFC8; --red:#C5342C;
  --dim:#7E8177; --line:#2C3238; --soft:rgba(232,223,200,.13);
  --sans:"PingFang SC","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","STSong",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--cream);font-family:var(--sans);line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
.app{max-width:430px;margin:0 auto;position:relative;min-height:100vh;min-height:100dvh}
.screen{display:none;flex-direction:column;min-height:100vh;min-height:100dvh;
  padding:24px 24px calc(26px + env(safe-area-inset-bottom))}
.screen.active{display:flex}
.eyebrow{font-size:9px;letter-spacing:.32em;color:var(--dim)}
.btn{display:block;width:100%;border:0;background:var(--red);color:#F6EEDC;
  font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:.3em;text-indent:.3em;
  padding:17px 12px;cursor:pointer;border-radius:1px}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:#C9C0AB;border:1px solid var(--line);
  font-size:12px;font-weight:600;letter-spacing:.12em;text-indent:.12em;padding:12px 8px}

/* ---------- 岔路 ---------- */
.fork{margin:30px 0 0;display:block}
.fork circle,.fork path{vector-effect:non-scaling-stroke}
.fork .lab{font-family:var(--serif);font-size:15px;letter-spacing:.18em;fill:#9C957F}
.fork .lab-on{fill:var(--cream)}
.fork .sub{font-family:var(--sans);font-size:8px;letter-spacing:.24em;fill:#5F645C}

/* 结果页：只亮选中的那条路 */
.fork-res{max-width:300px;margin:22px 0 0}
.fork-res .branch{opacity:.3}
.fork-res.sci .left,.fork-res.lib .right,.fork-res.both .branch{opacity:1}
.fork-res.sci .left path,.fork-res.sci .left circle,
.fork-res.lib .right path,.fork-res.lib .right circle,
.fork-res.both .branch path,.fork-res.both .branch circle{stroke:var(--cream)}
.fork-res.sci .left .lab,.fork-res.lib .right .lab,.fork-res.both .lab{fill:var(--cream)}

/* ---------- 封面 ---------- */
.cover{flex:1;display:flex;flex-direction:column;justify-content:center}
.c-top{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid var(--line);padding-bottom:12px}
.c-title{font-family:var(--serif);font-size:clamp(31px,9.4vw,40px);font-weight:600;
  line-height:1.5;letter-spacing:.04em;margin:26px 0 0;color:var(--cream)}
.c-title em{font-style:normal;color:var(--red)}
.lede{font-size:12.5px;line-height:2.05;color:#9A9585;margin:22px 0 0}
.cover-foot{display:flex;flex-direction:column;gap:14px;margin-top:26px}
.facts{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.14em;color:var(--dim)}

/* ---------- 答题 ---------- */
#s-quiz{padding-top:26px}
.qtop{display:flex;justify-content:space-between;align-items:baseline}
.q-no{font-family:var(--serif);font-size:13px;letter-spacing:.1em;color:var(--red)}
.q-pct{font-size:10px;letter-spacing:.18em;color:var(--dim)}
.qtrack{height:2px;margin-top:14px;background:var(--soft)}
.qtrack i{display:block;height:100%;width:var(--w,0);background:var(--cream);
  transform-origin:left;animation:grow .9s cubic-bezier(.2,.9,.3,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.qwrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:56px}
.qkicker{font-size:9px;font-weight:600;letter-spacing:.34em;color:var(--dim);margin:0 0 18px}
.qtext{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.7;
  letter-spacing:.02em;margin:0 0 26px;color:var(--cream)}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:14px;width:100%;background:var(--bg2);
  border:1px solid var(--line);border-radius:1px;padding:16px 14px;text-align:left;
  font-family:var(--sans);font-size:14.5px;line-height:1.45;color:#CFC7B4;
  cursor:pointer;transition:border-color .15s,opacity .15s}
.opt .k{width:20px;height:20px;flex:0 0 auto;border:1px solid #3B423F;
  color:var(--dim);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--cream)}
.opt.sel .k{background:var(--red);border-color:var(--red);color:#F6EEDC}
.opt.dim{opacity:.32}
.qfoot{text-align:center;font-size:10px;letter-spacing:.16em;color:var(--dim);margin:0}

/* ---------- 结果 ---------- */
.rtop{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid var(--line);padding-bottom:10px}
.rname{font-family:var(--serif);font-size:clamp(34px,9.6vw,42px);font-weight:600;
  line-height:1.25;letter-spacing:.03em;margin:24px 0 0;color:var(--cream)}
.rtag{font-size:12.5px;letter-spacing:.1em;color:var(--red);margin:10px 0 0}
.dims,.sec,.advice{margin-top:26px}
.seclab{font-size:9px;font-weight:600;letter-spacing:.3em;color:var(--dim);margin:0 0 12px}
.dim-row{display:flex;align-items:center;gap:12px;margin:13px 0}
.dim-row .n{width:36px;flex:0 0 auto;font-family:var(--serif);font-size:12.5px;color:#B7AF9C;letter-spacing:.08em}
.dim-row .track{flex:1;height:3px;background:var(--soft)}
.dim-row .track i{display:block;height:100%;width:var(--w,0);background:var(--cream);
  transform-origin:left;animation:grow .9s cubic-bezier(.2,.9,.3,1) both}
.dim-row:nth-child(2) .track i{background:#8F8877}
.dim-row:nth-child(3) .track i{background:var(--red)}
.dim-row .v{width:26px;flex:0 0 auto;text-align:right;font-size:10.5px;color:var(--dim)}
.body-text{font-size:13.5px;line-height:2.05;color:#A9A391;margin:0;text-align:justify}
.traits{display:flex;flex-wrap:wrap;gap:7px}
.traits span{font-size:11px;letter-spacing:.12em;color:#BDB5A2;
  border:1px solid var(--line);padding:6px 12px}
.quote{font-family:var(--serif);font-size:18px;line-height:1.9;letter-spacing:.06em;
  margin:28px 0 0;padding:16px 0 16px 20px;border-left:2px solid var(--red);color:var(--cream)}
.advice{border-top:1px solid var(--line);padding-top:18px}
.advice p:last-child{margin:0;font-size:12.5px;line-height:1.95;color:#9A9585}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.acts-row{display:flex;gap:10px}
.acts-row .btn{flex:1}
.rfoot{text-align:center;font-size:8.5px;letter-spacing:.32em;color:var(--dim);margin:26px 0 0}


/* ---------- 共用弹层 ---------- */
.modal{position:fixed;inset:0;background:rgba(8,10,9,.9);display:none;z-index:80;
  padding:24px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal.on{display:flex;flex-direction:column;align-items:center;justify-content:center}
.modal-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px;align-items:center}
.poster-img{width:100%;display:block;border-radius:3px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.modal-tip{font-size:12.5px;line-height:1.8;text-align:center;opacity:.62;margin:0}
.modal-x{margin-top:4px;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;
  font-size:13px;padding:9px 26px;border-radius:2px;letter-spacing:.08em;cursor:pointer}
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,12px);
  background:rgba(20,20,20,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:3px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:90;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

</style>
</head>
<body>
<div class="app">

  <!-- 封面 -->
  <section class="screen active" id="s-cover">
    <div class="cover">
      <div class="c-top">
        <span class="eyebrow">SUBJECT CHOICE</span>
        <span class="eyebrow">NO. 09</span>
      </div>
      <h1 class="c-title">选物理，<br>还是<em>选历史</em>？</h1>
      <svg class="fork" viewBox="0 0 320 166" width="100%" aria-hidden="true">
        <path d="M160 6 V48" fill="none" stroke="#4A4E50" stroke-width="1.4"/>
        <g class="branch left">
          <path d="M160 48 C160 98 90 84 78 130" fill="none" stroke="#6E6A5C" stroke-width="1.4"/>
          <circle cx="78" cy="134" r="4" fill="none" stroke="#6E6A5C" stroke-width="1.4"/>
          <text class="lab" x="78" y="158" text-anchor="middle">物 理</text>
        </g>
        <g class="branch right">
          <path d="M160 48 C160 98 230 84 242 130" fill="none" stroke="#6E6A5C" stroke-width="1.4"/>
          <circle cx="242" cy="134" r="4" fill="none" stroke="#6E6A5C" stroke-width="1.4"/>
          <text class="lab" x="242" y="158" text-anchor="middle">历 史</text>
        </g>
        <circle cx="160" cy="48" r="3.5" fill="#C5342C"/>
      </svg>
      <p class="lede">新高考最纠结的那一步，其实不是选哪科，是认清你靠什么理解世界：靠推导，还是靠理解人。二十道题，测出你该往哪条路上走。</p>
      <div class="cover-foot">
        <button class="btn" id="btnStart">开 始 测 试</button>
        <div class="facts"><span>20 题</span><span>约 90 秒</span><span>五条走向</span></div>
      </div>
    </div>
  </section>

  <!-- 答题 -->
  <section class="screen" id="s-quiz">
    <div class="qtop"><span class="q-no" id="qCount">01 / 20</span><span class="q-pct" id="qPct">5%</span></div>
    <div class="qtrack"><i id="qBar"></i></div>
    <div class="qwrap">
      <p class="qkicker">如 果 是 你</p>
      <h2 class="qtext" id="qText"></h2>
      <div class="opts" id="opts"></div>
    </div>
    <p class="qfoot">按真实反应选，不是你希望的样子</p>
  </section>

  <!-- 结果 -->
  <section class="screen" id="s-result">
    <div class="rtop"><span class="eyebrow">SUBJECT CHOICE REPORT</span><span class="eyebrow" id="rNo">NO.0000</span></div>
    <svg class="fork fork-res" id="rFork" viewBox="0 0 320 122" width="100%" aria-hidden="true">
      <path d="M160 4 V34" fill="none" stroke="#3A3F42" stroke-width="1.4"/>
      <g class="branch left">
        <path d="M160 34 C160 70 96 62 86 96" fill="none" stroke="#6E6A5C" stroke-width="1.4"/>
        <circle cx="86" cy="99" r="3.5" fill="none" stroke="#6E6A5C" stroke-width="1.4"/>
        <text class="lab" x="86" y="110" text-anchor="middle" style="font-size:11px">物 理</text>
      </g>
      <g class="branch right">
        <path d="M160 34 C160 70 224 62 234 96" fill="none" stroke="#6E6A5C" stroke-width="1.4"/>
        <circle cx="234" cy="99" r="3.5" fill="none" stroke="#6E6A5C" stroke-width="1.4"/>
        <text class="lab" x="234" y="110" text-anchor="middle" style="font-size:11px">历 史</text>
      </g>
      <circle cx="160" cy="34" r="3" fill="#C5342C"/>
    </svg>
    <h2 class="rname" id="rTitle"></h2>
    <p class="rtag" id="rTag"></p>

    <div class="dims">
      <p class="seclab">三 个 方 向</p>
      <div id="rDims"></div>
    </div>
    <div class="sec">
      <p class="seclab">你 该 走 哪 边</p>
      <p class="body-text" id="rAnalysis"></p>
    </div>
    <div class="sec">
      <p class="seclab">关 键 词</p>
      <div class="traits" id="rTraits"></div>
    </div>
    <p class="quote" id="rLine"></p>
    <div class="advice">
      <p class="seclab">选 科 前 的 一 句 话</p>
      <p id="rAdvice"></p>
    </div>

    <div class="acts">
      <button class="btn" id="btnPoster">生成选科报告</button>
      <div class="acts-row">
        <button class="btn ghost" id="btnShare">复制链接</button>
        <button class="btn ghost" id="btnAgain">再测一次</button>
      </div>
    </div>
    <p class="rfoot">SUBJECT CHOICE REPORT</p>
  </section>

</div>

<div class="modal" id="modal">
  <div class="modal-card" id="modalBody"></div>
  <button class="modal-x" onclick="closeModal()">关闭</button>
</div>
<div class="toast" id="toast"></div>

/* ===== 共用引擎：抽题 / 打乱 / 计分 / 弹层 / 通用画笔 =====
   每个主题只提供 SKIN 对象和 TEST 数据，其余都走这里。 */

const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';

/* ---------- 二维码（每套主题在 data.js 里配） ---------- */
let QR_IMG = null;
if (TEST.qrImage){
  QR_IMG = new Image();
  QR_IMG.src = TEST.qrImage;
}

/* ---------- 工具 ---------- */
function shuffleArr(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 按维度配比抽题：slots 之和 = TEST.quizLen */
function drawQuiz(){
  const picked = [];
  const slots = shuffleArr(TEST.slots.slice());
  TEST.dims.forEach((m, di) => {
    const pool = shuffleArr(TEST.bank.filter(x => x.d === di));
    picked.push.apply(picked, pool.slice(0, slots[di]));
  });
  return shuffleArr(picked);
}

/* ---------- 状态 ---------- */
const state = { i:0, scores:[], drawn:[], opts:[], total:0, result:null, dims:null };
let locked = false;

/* ---------- 流程 ---------- */
function startQuiz(){
  state.i = 0;
  state.scores = [];
  state.drawn = drawQuiz();
  state.opts = state.drawn.map(q => shuffleArr(q.o.map(o => ({ t:o[0], s:o[1] }))));
  locked = false;
  SKIN.goQuiz();
  SKIN.renderQuestion();
}

function choose(score, el){
  if (locked) return;
  locked = true;
  if (el) el.classList.add('sel');
  state.scores.push(score);
  SKIN.afterChoose(el, score);
  setTimeout(() => {
    locked = false;
    if (state.i < TEST.quizLen - 1){
      state.i++;
      SKIN.renderQuestion();
    } else {
      finish();
    }
  }, SKIN.advanceDelay || 240);
}

function finish(){
  state.total = state.scores.reduce((a,b) => a + b, 0);
  state.result = TEST.results.find(r => state.total >= r.min && state.total <= r.max) || TEST.results[0];

  const sum = [0,0,0], cnt = [0,0,0];
  state.drawn.forEach((q, i) => { sum[q.d] += state.scores[i]; cnt[q.d]++; });
  state.dims = TEST.dims.map((m, d) => ({
    name: m.name,
    pct: Math.max(TEST.pctFloor || 6, Math.min(100, Math.round(sum[d] / (cnt[d] * 3) * 100)))
  }));

  SKIN.goResult();
  SKIN.renderResult();
  window.scrollTo(0,0);
}

/* ---------- 弹层 ---------- */
function openModal(html){
  $('modalBody').innerHTML = html;
  $('modal').classList.add('on');
}
function closeModal(){ $('modal').classList.remove('on'); }

function showPoster(){
  const url = SKIN.buildPoster();
  openModal('<img class="poster-img" src="' + url + '" alt="测试结果海报">'
    + '<p class="modal-tip">长按图片保存到相册<br>电脑上右键另存为</p>');
}

function copyLink(){
  const url = location.href;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(
      () => toast('链接已复制'),
      () => toast('长按地址栏复制链接')
    );
  } else {
    toast('长按地址栏复制链接');
  }
}

let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1900);
}

/* ---------- 画布通用件 ---------- */
function makeCanvas(w, h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function wrapLines(g, text, maxW){
  const out = []; let line = '';
  for (const ch of text){
    if (g.measureText(line + ch).width > maxW && line){ out.push(line); line = ch; }
    else line += ch;
  }
  if (line) out.push(line);
  return out;
}
/* 防伪扭索纹：r = R + A·sin(Nθ) 旋转复制 */
function drawRosette(g, cx, cy, R, amp, N, P, steps, color, alpha, lw){
  g.save();
  g.strokeStyle = color; g.globalAlpha = alpha; g.lineWidth = lw || 0.9;
  for (let k = 0; k < P; k++){
    const rot = k * 2 * Math.PI / (N * P);
    g.beginPath();
    for (let i = 0; i <= steps; i++){
      const t = i / steps * Math.PI * 2;
      const r = R + amp * Math.sin(N * t);
      const a = t + rot;
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  }
  g.restore();
}
function roundRect(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

/* ===== 选物理还是历史 · 界面层 ===== */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0, 0);
}
const SANS = '"PingFang SC","Microsoft YaHei",sans-serif';
const SERIF = '"Songti SC","STSong",serif';
const BG = '#15181C', CREAM = '#E8DFC8', RED = '#C5342C';
const DIM = '#7E8177', LINE = '#2C3238';

/* 一条岔路：从主干分出去，选中那条亮起来 */
function branch(g, cx, y0, tx, ty, on){
  g.beginPath();
  g.moveTo(cx, y0);
  g.quadraticCurveTo(cx, y0 + (ty - y0) * 0.72, tx, ty);
  g.strokeStyle = on ? CREAM : '#454A48';
  g.lineWidth = on ? 3 : 2;
  g.stroke();
  g.beginPath(); g.arc(tx, ty + 12, 9, 0, Math.PI * 2);
  if (on) { g.fillStyle = RED; g.fill(); }
  else { g.strokeStyle = '#454A48'; g.lineWidth = 2; g.stroke(); }
}

const SKIN = {
  advanceDelay: 260,

  goQuiz(){ show('s-quiz'); },
  goResult(){ show('s-result'); },

  renderQuestion(){
    const i = state.i;
    const pct = (i + 1) / TEST.quizLen * 100;
    $('qCount').textContent = String(i + 1).padStart(2, '0') + ' / ' + TEST.quizLen;
    $('qPct').textContent = Math.round(pct) + '%';
    $('qBar').style.width = pct + '%';
    $('qText').textContent = state.drawn[i].q;

    const box = $('opts');
    box.innerHTML = '';
    state.opts[i].forEach((o, k) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      const key = document.createElement('span');
      key.className = 'k'; key.textContent = 'ABC'[k];
      const tx = document.createElement('span');
      tx.className = 't'; tx.textContent = o.t;
      b.appendChild(key); b.appendChild(tx);
      b.addEventListener('click', () => choose(o.s, b));
      box.appendChild(b);
    });
  },

  afterChoose(el){
    document.querySelectorAll('.opt').forEach(x => { if (x !== el) x.classList.add('dim'); });
  },

  renderResult(){
    const r = state.result, t = state.total;
    $('rNo').textContent = 'NO.' + String(1000 + t * 37).slice(-4);
    $('rTitle').textContent = r.title;
    $('rTag').textContent = r.tag;
    $('rAnalysis').textContent = r.analysis;
    $('rTraits').innerHTML = r.traits.map(x => '<span>' + x + '</span>').join('');
    $('rLine').textContent = r.line;
    $('rAdvice').textContent = r.advice;
    $('rFork').setAttribute('class', 'fork fork-res ' + (r.side || 'both'));
    $('rDims').innerHTML = state.dims.map(d =>
      '<div class="dim-row"><span class="n">' + d.name + '</span>'
      + '<span class="track"><i style="--w:' + Math.max(4, d.pct) + '%"></i></span>'
      + '<span class="v">' + d.pct + '</span></div>'
    ).join('');
  },

  buildPoster(){
    const W = 750, H = 1200;
    const c = makeCanvas(W, H), g = c.getContext('2d');
    const r = state.result, M = 62, R = W - M;

    g.fillStyle = BG; g.fillRect(0, 0, W, H);

    // 细边框
    g.strokeStyle = 'rgba(232,223,200,.11)'; g.lineWidth = 1;
    g.strokeRect(26, 26, W - 52, H - 52);

    // 抬头
    g.fillStyle = DIM; g.font = '600 10px ' + SANS;
    g.fillText('SUBJECT CHOICE REPORT', M, 76);
    g.textAlign = 'right';
    g.fillText('NO. ' + String(1000 + state.total * 37).slice(-4), R, 76);
    g.textAlign = 'left';

    // 岔路
    const cx = W / 2, sci = r.side === 'sci', lib = r.side === 'lib';
    g.strokeStyle = '#3A3F42'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(cx, 100); g.lineTo(cx, 178); g.stroke();
    g.beginPath(); g.arc(cx, 100, 5, 0, Math.PI * 2); g.fillStyle = RED; g.fill();
    branch(g, cx, 178, 200, 296, sci || r.side === 'both');
    branch(g, cx, 178, 550, 296, lib || r.side === 'both');

    g.textAlign = 'center';
    g.fillStyle = sci || r.side === 'both' ? CREAM : '#5C605E';
    g.font = '600 24px ' + SERIF;
    g.fillText('物 理', 200, 352);
    g.fillStyle = lib || r.side === 'both' ? CREAM : '#5C605E';
    g.fillText('历 史', 550, 352);
    g.fillStyle = '#4E524F'; g.font = '600 9px ' + SANS;
    g.fillText('PHYSICS', 200, 374);
    g.fillText('HISTORY', 550, 374);
    g.textAlign = 'left';

    // 名字
    g.fillStyle = CREAM; g.font = '600 66px ' + SERIF;
    g.fillText(r.title, M, 450);
    g.fillStyle = RED; g.font = '700 15px ' + SANS;
    g.fillText(r.tag, M, 490);

    g.strokeStyle = LINE; g.lineWidth = 1;
    g.beginPath(); g.moveTo(M, 518); g.lineTo(R, 518); g.stroke();

    // 三维度
    let dy = 562;
    state.dims.forEach(d => {
      g.fillStyle = '#A8A290'; g.font = '600 14px ' + SERIF;
      g.fillText(d.name, M, dy + 5);
      g.fillStyle = 'rgba(232,223,200,.13)';
      g.fillRect(126, dy - 2, 500, 3);
      g.fillStyle = CREAM;
      g.fillRect(126, dy - 2, 500 * d.pct / 100, 3);
      g.fillStyle = DIM; g.font = '600 11px ' + SANS;
      g.textAlign = 'right'; g.fillText(String(d.pct), R, dy + 5);
      g.textAlign = 'left';
      dy += 46;
    });

    // 正文
    const AT = 700;
    g.fillStyle = '#A9A391'; g.font = '15.5px ' + SANS;
    const al = wrapLines(g, r.analysis, R - M).slice(0, 5);
    al.forEach((ln, i) => g.fillText(ln, M, AT + i * 34));

    // 金句
    const qy = Math.min(850, AT + (al.length - 1) * 34 + 58);
    g.font = '600 23px ' + SERIF;
    const ql = wrapLines(g, r.line, R - M - 30).slice(0, 2);
    g.fillStyle = RED;
    g.fillRect(M, qy, 3, ql.length > 1 ? 94 : 54);
    g.fillStyle = CREAM;
    ql.forEach((ln, i) => g.fillText(ln, M + 22, qy + 34 + i * 38));

    // 关键词
    g.fillStyle = '#8C8776'; g.font = '600 13px ' + SANS;
    g.fillText(r.traits.join('    ·    '), M, 972);

    g.strokeStyle = LINE; g.lineWidth = 1;
    g.beginPath(); g.moveTo(M, 1000); g.lineTo(R, 1000); g.stroke();

    const qs = 92, qx = R - qs, qy2 = 1018;
    g.fillStyle = '#FFFFFF';
    roundRect(g, qx - 7, qy2 - 7, qs + 14, qs + 14, 1); g.fill();
    if (QR_IMG) g.drawImage(QR_IMG, qx, qy2, qs, qs);
    else {
      g.fillStyle = '#C6BFB6'; g.font = '12px ' + SANS; g.textAlign = 'center';
      g.fillText('二维码', qx + qs / 2, qy2 + 44);
      g.fillText('放这里', qx + qs / 2, qy2 + 64);
      g.textAlign = 'left';
    }

    g.fillStyle = CREAM; g.font = '700 16px ' + SANS;
    const cl = wrapLines(g, TEST.qrCaption, 470).slice(0, 2);
    cl.forEach((ln, i) => g.fillText(ln, M, 1046 + i * 26));
    g.fillStyle = '#5F645C'; g.font = '11px ' + SANS;
    g.fillText('仅供娱乐 · 不作为选科依据', M, 1140);

    return c.toDataURL('image/png');
  }
};

$('btnStart').addEventListener('click', startQuiz);
$('btnAgain').addEventListener('click', startQuiz);
$('btnPoster').addEventListener('click', showPoster);
$('btnShare').addEventListener('click', copyLink);
