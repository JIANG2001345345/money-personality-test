<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C9B78F">
<title>你的吸渣体质有多强 · 情感风控档案</title>
<meta name="description" content="为什么受伤的总是你？20 道题测出你的情感风控等级。仅供娱乐，不构成任何情感建议。">
<style>
/* ===== 吸渣体质 · 牛皮纸卷宗 ===== */
:root{
  --kraft:#C9B78F; --kraft-d:#B6A176; --paper:#EDE3CD; --paper-2:#E5D9BE;
  --ink:#241E16; --ink-2:#4A4034; --muted:#6E6250;
  --red:#9E3B22; --olive:#59674B;
  --mono:"Courier New",ui-monospace,"SFMono-Regular",monospace;
  --sans:"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--kraft);
  background-image:
    repeating-linear-gradient(0deg,rgba(60,45,20,.035) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(60,45,20,.025) 0 1px,transparent 1px 4px);
  color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
}
.app{max-width:430px;margin:0 auto;position:relative;min-height:100vh;min-height:100dvh}
/* 左侧打孔 */
.app::before{
  content:"";position:fixed;left:0;top:0;bottom:0;width:18px;pointer-events:none;z-index:5;
  background-image:radial-gradient(circle at 9px 26px,rgba(0,0,0,.28) 5px,transparent 5.5px);
  background-size:18px 78px;background-repeat:repeat-y;
  opacity:.45;
}
.screen{display:none;flex-direction:column;min-height:100vh;min-height:100dvh;
  padding:22px 18px calc(24px + env(safe-area-inset-bottom)) 30px}
.screen.active{display:flex}
.mono{font-family:var(--mono);letter-spacing:.04em}

/* ---------- 按钮 ---------- */
.btn{
  display:block;width:100%;border:1px solid var(--ink);background:transparent;color:var(--ink);
  font-family:var(--sans);font-size:15px;font-weight:600;letter-spacing:.14em;
  padding:15px 12px;border-radius:1px;cursor:pointer;
}
.btn.red{background:var(--red);border-color:var(--red);color:#F6EFDF}
.btn.red:active{transform:translateY(1px)}
.btn.ghost{font-weight:500;font-size:13.5px;letter-spacing:.1em}

/* ---------- 封面 ---------- */
.cover-band{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.26em;color:var(--ink-2);
  border-bottom:1px solid rgba(36,30,22,.35);padding-bottom:8px;
  display:flex;justify-content:space-between;
}
.cover-file{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  position:relative;padding:26px 0;
}
.file-head{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.file-no{
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink-2);
  border:1px solid rgba(36,30,22,.4);padding:3px 7px;
}
.file-tag{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--red);
  border:1px dashed rgba(158,59,34,.6);padding:3px 7px;
}
.cover-title{
  font-family:var(--sans);font-size:clamp(30px,9vw,38px);font-weight:800;
  line-height:1.24;letter-spacing:.01em;margin:0;color:var(--ink);
}
.cover-title em{font-style:normal;border-bottom:6px solid rgba(158,59,34,.55)}
.cover-sub{
  font-size:13.5px;line-height:1.85;color:var(--ink-2);margin:20px 0 0;max-width:19em;
}
.cover-sub b{font-weight:600;color:var(--ink)}
.cover-note{
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);margin:16px 0 0;
}
/* 红章 */
.stamp{
  position:absolute;right:4px;bottom:6px;width:96px;height:96px;
  border:3px solid var(--red);border-radius:50%;color:var(--red);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:800;letter-spacing:.1em;
  transform:rotate(-14deg);opacity:.72;
  box-shadow:inset 0 0 0 3px rgba(158,59,34,.18);
}
.stamp::after{
  content:"";position:absolute;inset:7px;border:1.5px solid var(--red);border-radius:50%;opacity:.7;
}
.cover-foot{display:flex;flex-direction:column;gap:14px}
.facts{display:flex;gap:14px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.facts span::before{content:"· ";color:var(--red)}

/* ---------- 答题 ---------- */
.qbar{
  display:flex;align-items:baseline;gap:6px;font-family:var(--mono);font-size:12px;
  letter-spacing:.1em;color:var(--ink-2);margin-bottom:10px;
}
.qbar .big{font-size:20px;font-weight:700;color:var(--red)}
.qbar .pct{margin-left:auto;color:var(--muted)}
.qline{height:2px;background:rgba(36,30,22,.14);margin-bottom:22px;position:relative}
.qline i{position:absolute;left:0;top:0;bottom:0;background:var(--red);width:0;transition:width .35s ease}
.sheet{
  flex:1;background:var(--paper);border:1px solid rgba(36,30,22,.22);
  padding:22px 18px 18px;position:relative;
  box-shadow:3px 4px 0 rgba(36,30,22,.16);
  background-image:repeating-linear-gradient(180deg,transparent 0 33px,rgba(36,30,22,.055) 33px 34px);
  background-position:0 12px;
}
.sheet-head{
  display:flex;justify-content:space-between;align-items:center;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--muted);
  border-bottom:1px dashed rgba(36,30,22,.3);padding-bottom:8px;margin-bottom:16px;
}
.qtext{
  font-size:17.5px;font-weight:600;line-height:1.65;margin:0 0 20px;color:var(--ink);
}
.opts{display:flex;flex-direction:column;background:var(--paper)}
.opt{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  background:transparent;border:0;border-bottom:1px solid rgba(36,30,22,.16);
  padding:14px 2px;cursor:pointer;color:var(--ink);font-family:var(--sans);
  font-size:14.5px;line-height:1.6;
}
.opt:last-child{border-bottom:0}
.opt .box{
  flex:0 0 auto;width:16px;height:16px;border:1.5px solid var(--ink-2);margin-top:3px;
  position:relative;background:var(--paper);
}
.opt .k{
  flex:0 0 auto;font-family:var(--mono);font-size:12px;color:var(--muted);
  width:16px;margin-top:2px;
}
.opt.sel .box::after{
  content:"";position:absolute;inset:-1.5px;
  background:
    linear-gradient(45deg,transparent 46%,var(--red) 46%,var(--red) 54%,transparent 54%),
    linear-gradient(-45deg,transparent 46%,var(--red) 46%,var(--red) 54%,transparent 54%);
}
.opt.sel{color:var(--red)}
.hint{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted);
  text-align:center;margin:16px 0 0;
}

/* ---------- 结果 ---------- */
.report{
  background:var(--paper);border:1px solid rgba(36,30,22,.25);
  box-shadow:4px 5px 0 rgba(36,30,22,.18);
  padding:20px 18px 22px;position:relative;
  animation:slipIn .5s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes slipIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.r-top{display:flex;justify-content:space-between;font-family:var(--mono);
  font-size:10px;letter-spacing:.18em;color:var(--muted);border-bottom:1px solid rgba(36,30,22,.28);padding-bottom:8px}
.r-kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;color:var(--red);margin:16px 0 6px}
.r-title{font-size:30px;font-weight:800;line-height:1.22;margin:0;letter-spacing:.01em}
.r-tag{
  display:inline-block;margin-top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;
  color:var(--red);border:1px solid rgba(158,59,34,.55);padding:3px 8px;
}
.r-risk{display:flex;align-items:flex-end;justify-content:space-between;margin-top:22px}
.r-risk .lb{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--muted)}
.r-risk .val{font-family:var(--mono);font-size:32px;line-height:1;font-weight:700}
.r-risk .val small{font-size:13px;color:var(--muted);font-weight:400}
.riskbar{position:relative;height:10px;margin-top:12px;border:1px solid rgba(36,30,22,.5);
  background:repeating-linear-gradient(90deg,rgba(36,30,22,.08) 0 1px,transparent 1px 8px)}
.riskbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--red) 0 4px,rgba(158,59,34,.7) 4px 8px);
  transition:width 1s cubic-bezier(.2,.9,.3,1) .25s}
.scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:4px}

.dim-block{margin-top:20px;border-top:1px dashed rgba(36,30,22,.3);padding-top:14px}
.dim-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.dim-row .n{font-size:12px;color:var(--ink-2);width:62px;flex:0 0 auto;letter-spacing:.04em}
.dim-row .track{flex:1;height:6px;background:rgba(36,30,22,.1);position:relative}
.dim-row .track i{position:absolute;left:0;top:0;bottom:0;background:var(--olive);width:0;
  transition:width .8s cubic-bezier(.2,.9,.3,1) .5s}
.dim-row .v{font-family:var(--mono);font-size:11px;color:var(--muted);width:30px;text-align:right}

.sec{margin-top:20px}
.sec-h{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--muted);
  border-bottom:1px solid rgba(36,30,22,.22);padding-bottom:6px;margin-bottom:10px}
.body-text{font-size:14px;line-height:1.95;color:var(--ink-2);margin:0;text-align:justify}
.traits{display:flex;flex-wrap:wrap;gap:8px}
.traits span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  border:1px solid rgba(36,30,22,.3);padding:4px 9px;color:var(--ink-2)}
.quote{
  margin:18px 0 0;padding:14px 16px;background:rgba(158,59,34,.07);
  border-left:4px solid var(--red);font-size:15px;line-height:1.8;font-weight:600;color:var(--ink);
}
.advice{margin:18px 0 0;font-size:13.5px;line-height:1.9;color:var(--ink-2);
  border-top:1px dashed rgba(36,30,22,.3);padding-top:14px}
.advice b{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--red);display:block;margin-bottom:6px;font-weight:400}
.mini-stamp{
  position:absolute;right:14px;bottom:16px;font-family:var(--mono);font-size:9px;
  letter-spacing:.2em;color:rgba(158,59,34,.55);border:1px solid rgba(158,59,34,.35);
  padding:4px 6px;transform:rotate(-6deg);
}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.acts-row{display:flex;gap:10px}
.acts-row .btn{flex:1}

/* ---------- 弹层适配 ---------- */
.modal-tip{color:#D8CCAE}
.modal-x{border-color:rgba(216,204,174,.4);color:#D8CCAE}


/* ---------- 共用弹层 ---------- */
.modal{position:fixed;inset:0;background:rgba(8,10,9,.9);display:none;z-index:80;
  padding:24px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal.on{display:flex;flex-direction:column;align-items:center;justify-content:center}
.modal-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px;align-items:center}
.poster-img{width:100%;display:block;border-radius:3px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.modal-tip{font-size:12.5px;line-height:1.8;text-align:center;opacity:.62;margin:0}
.modal-x{margin-top:4px;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;
  font-size:13px;padding:9px 26px;border-radius:2px;letter-spacing:.08em;cursor:pointer}
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,12px);
  background:rgba(20,20,20,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:3px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:90;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

</style>
</head>

      </div>
    </div>
  </section>

</div>

<div class="modal" id="modal">
  <div class="modal-card" id="modalBody"></div>
  <button class="modal-x" onclick="closeModal()">关闭</button>
</div>
<div class="toast" id="toast"></div>

      traits:["套路免疫","高倍率雷达","防御过当"],

/* ===== 共用引擎：抽题 / 打乱 / 计分 / 弹层 / 通用画笔 =====
   每个主题只提供 SKIN 对象和 TEST 数据，其余都走这里。 */

const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';

/* ---------- 二维码（每套主题在 data.js 里配） ---------- */
let QR_IMG = null;
if (TEST.qrImage){
  QR_IMG = new Image();
  QR_IMG.src = TEST.qrImage;
}

/* ---------- 工具 ---------- */
function shuffleArr(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 按维度配比抽题：slots 之和 = TEST.quizLen */
function drawQuiz(){
  const picked = [];
  const slots = shuffleArr(TEST.slots.slice());
  TEST.dims.forEach((m, di) => {
    const pool = shuffleArr(TEST.bank.filter(x => x.d === di));
    picked.push.apply(picked, pool.slice(0, slots[di]));
  });
  return shuffleArr(picked);
}

/* ---------- 状态 ---------- */
const state = { i:0, scores:[], drawn:[], opts:[], total:0, result:null, dims:null };
let locked = false;

/* ---------- 流程 ---------- */
function startQuiz(){
  state.i = 0;
  state.scores = [];
  state.drawn = drawQuiz();
  state.opts = state.drawn.map(q => shuffleArr(q.o.map(o => ({ t:o[0], s:o[1] }))));
  locked = false;
  SKIN.goQuiz();
  SKIN.renderQuestion();
}

function choose(score, el){
  if (locked) return;
  locked = true;
  if (el) el.classList.add('sel');
  state.scores.push(score);
  SKIN.afterChoose(el, score);
  setTimeout(() => {
    locked = false;
    if (state.i < TEST.quizLen - 1){
      state.i++;
      SKIN.renderQuestion();
    } else {
      finish();
    }
  }, SKIN.advanceDelay || 240);
}

function finish(){
  state.total = state.scores.reduce((a,b) => a + b, 0);
  state.result = TEST.results.find(r => state.total >= r.min && state.total <= r.max) || TEST.results[0];

  const sum = [0,0,0], cnt = [0,0,0];
  state.drawn.forEach((q, i) => { sum[q.d] += state.scores[i]; cnt[q.d]++; });
  state.dims = TEST.dims.map((m, d) => ({
    name: m.name,
    pct: Math.max(TEST.pctFloor || 6, Math.min(100, Math.round(sum[d] / (cnt[d] * 3) * 100)))
  }));

  SKIN.goResult();
  SKIN.renderResult();
  window.scrollTo(0,0);
}

/* ---------- 弹层 ---------- */
function openModal(html){
  $('modalBody').innerHTML = html;
  $('modal').classList.add('on');
}
function closeModal(){ $('modal').classList.remove('on'); }

function showPoster(){
  const url = SKIN.buildPoster();
  openModal('<img class="poster-img" src="' + url + '" alt="测试结果海报">'
    + '<p class="modal-tip">长按图片保存到相册<br>电脑上右键另存为</p>');
}

function copyLink(){
  const url = location.href;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(
      () => toast('链接已复制'),
      () => toast('长按地址栏复制链接')
    );
  } else {
    toast('长按地址栏复制链接');
  }
}

let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1900);
}

/* ---------- 画布通用件 ---------- */
function makeCanvas(w, h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function wrapLines(g, text, maxW){
  const out = []; let line = '';
  for (const ch of text){
    if (g.measureText(line + ch).width > maxW && line){ out.push(line); line = ch; }
    else line += ch;
  }
  if (line) out.push(line);
  return out;
}
/* 防伪扭索纹：r = R + A·sin(Nθ) 旋转复制 */
function drawRosette(g, cx, cy, R, amp, N, P, steps, color, alpha, lw){
  g.save();
  g.strokeStyle = color; g.globalAlpha = alpha; g.lineWidth = lw || 0.9;
  for (let k = 0; k < P; k++){
    const rot = k * 2 * Math.PI / (N * P);
    g.beginPath();
    for (let i = 0; i <= steps; i++){
      const t = i / steps * Math.PI * 2;
      const r = R + amp * Math.sin(N * t);
      const a = t + rot;
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  }
  g.restore();
}
function roundRect(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

/* ===== 吸渣体质 · 界面层 ===== */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0, 0);
}

const SKIN = {
  advanceDelay: 240,

  goQuiz(){ show('s-quiz'); },
  goResult(){ show('s-result'); },

  renderQuestion(){
    const i = state.i;
    $('qIdx').textContent = String(i + 1).padStart(2, '0');
    $('qPct').textContent = Math.round((i + 1) / TEST.quizLen * 100) + '%';
    $('qBar').style.width = ((i + 1) / TEST.quizLen * 100) + '%';
    $('slipNo').textContent = String(i + 1).padStart(2, '0');
    $('qText').textContent = state.drawn[i].q;

    const box = $('opts');
    box.innerHTML = '';
    state.opts[i].forEach((o, idx) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      const k = document.createElement('span'); k.className = 'k'; k.textContent = '甲乙丙'[idx];
      const c = document.createElement('span'); c.className = 'box';
      const t = document.createElement('span'); t.className = 't'; t.textContent = o.t;
      b.appendChild(c); b.appendChild(k); b.appendChild(t);
      b.addEventListener('click', () => choose(o.s, b));
      box.appendChild(b);
    });
  },

  afterChoose(el){ /* 复选框打叉由 .sel 的 CSS 完成 */ },

  renderResult(){
    const r = state.result, t = state.total;
    const pct = Math.max(3, Math.round((t - 20) / 40 * 100));
    const dims = state.dims.map(d =>
      '<div class="dim-row"><span class="n">' + d.name + '</span>'
      + '<span class="track"><i></i></span><span class="v">' + d.pct + '</span></div>'
    ).join('');

    $('report').innerHTML =
      '<div class="r-top"><span>结案报告</span><span>NO.' + String(t).padStart(2, '0') + '</span></div>'
      + '<div class="r-kicker">C O N C L U S I O N</div>'
      + '<h2 class="r-title">' + r.title + '</h2>'
      + '<span class="r-tag">' + r.tag + '</span>'
      + '<div class="r-risk"><span class="lb">防渣指数</span>'
      +   '<span class="val">' + t + '<small>/60</small></span></div>'
      + '<div class="riskbar"><i></i></div>'
      + '<div class="scale"><span>易被套路</span><span>人间清醒</span></div>'
      + '<div class="dim-block">' + dims + '</div>'
      + '<div class="sec"><div class="sec-h">CASE ANALYSIS</div>'
      +   '<p class="body-text">' + r.analysis + '</p></div>'
      + '<div class="sec"><div class="sec-h">HIDDEN TRAITS</div>'
      +   '<div class="traits">' + r.traits.map(x => '<span>' + x + '</span>').join('') + '</div></div>'
      + '<p class="quote">' + r.line + '</p>'
      + '<p class="advice"><b>D I S P O S A L</b>' + r.advice + '</p>'
      + '<span class="mini-stamp">已 结 案</span>';

    requestAnimationFrame(() => {
      document.querySelectorAll('.dim-row .track i').forEach((el, i) => {
        el.style.width = state.dims[i].pct + '%';
      });
      document.querySelector('.riskbar i').style.width = pct + '%';
    });
  },

  buildPoster(){
    const W = 750, H = 1200;
    const c = makeCanvas(W, H), g = c.getContext('2d');
    const r = state.result, t = state.total;
    const PX = 54, PY = 70, PW = W - PX * 2, PH = 1060;
    const L = PX + 46, R = PX + PW - 40;

    g.fillStyle = '#C9B78F'; g.fillRect(0, 0, W, H);
    // 纸影
    g.fillStyle = 'rgba(48,38,22,.22)'; g.fillRect(PX + 10, PY + 12, PW, PH);
    g.fillStyle = '#EDE3CD'; g.fillRect(PX, PY, PW, PH);
    // 左侧红条
    g.fillStyle = '#9E3B22'; g.fillRect(PX, PY, 11, PH);

    // 抬头
    g.fillStyle = '#6E6250';
    g.font = '20px "Courier New",monospace';
    g.fillText('CASE FILE · 情感风控档案', L, 128);
    g.textAlign = 'right';
    g.fillText('NO.' + String(t).padStart(2, '0'), R, 128);
    g.textAlign = 'left';

    g.strokeStyle = 'rgba(36,30,22,.35)'; g.lineWidth = 1.5;
    g.setLineDash([6, 6]);
    g.beginPath(); g.moveTo(L, 148); g.lineTo(R, 148); g.stroke();
    g.setLineDash([]);

    // 档案照框
    const pw = 168, ph = 212, bx = R - pw, by = 176;
    g.strokeStyle = 'rgba(36,30,22,.4)';
    g.setLineDash([5, 5]);
    g.strokeRect(bx, by, pw, ph);
    g.setLineDash([]);
    g.fillStyle = '#8B7C63';
    g.font = '17px "Courier New",monospace';
    g.textAlign = 'center';
    g.fillText('档 案 照', bx + pw / 2, by + ph / 2 - 6);
    g.fillText('P H O T O', bx + pw / 2, by + ph / 2 + 22);
    g.textAlign = 'left';

    // 标题
    g.fillStyle = '#241E16';
    g.font = '700 56px "PingFang SC","Microsoft YaHei",sans-serif';
    const titleLines = wrapLines(g, r.title, pw + 46);
    titleLines.forEach((ln, i) => g.fillText(ln, L, 262 + i * 66));

    // 标签
    const tagY = 262 + titleLines.length * 66 + 10;
    g.font = '20px "Courier New",monospace';
    const tw = g.measureText(r.tag).width;
    g.strokeStyle = 'rgba(158,59,34,.6)'; g.lineWidth = 1.5;
    g.strokeRect(L, tagY, tw + 26, 38);
    g.fillStyle = '#9E3B22';
    g.fillText(r.tag, L + 13, tagY + 26);

    // 防渣指数
    const sy = tagY + 84;
    g.fillStyle = '#6E6250';
    g.font = '19px "Courier New",monospace';
    g.fillText('防渣指数', L, sy);
    g.fillStyle = '#241E16';
    g.font = '700 52px "Courier New",monospace';
    g.textAlign = 'right';
    g.fillText(t + ' / 60', R, sy + 6);
    g.textAlign = 'left';

    const barY = sy + 24;
    g.strokeStyle = 'rgba(36,30,22,.45)'; g.lineWidth = 1.5;
    g.strokeRect(L, barY, R - L, 14);
    g.fillStyle = '#9E3B22';
    g.fillRect(L + 1.5, barY + 1.5, (R - L - 3) * Math.max(.02, (t - 20) / 40), 11);

    // 三维
    let dy = barY + 62;
    state.dims.forEach(d => {
      g.fillStyle = '#4A4034';
      g.font = '20px "PingFang SC","Microsoft YaHei",sans-serif';
      g.fillText(d.name, L, dy + 14);
      const tx = L + 138, twid = R - tx - 52;
      g.fillStyle = 'rgba(36,30,22,.12)'; g.fillRect(tx, dy, twid, 9);
      g.fillStyle = '#59674B'; g.fillRect(tx, dy, twid * d.pct / 100, 9);
      g.fillStyle = '#6E6250';
      g.font = '16px "Courier New",monospace';
      g.textAlign = 'right';
      g.fillText(String(d.pct), R, dy + 12);
      g.textAlign = 'left';
      dy += 40;
    });

    // 结论金句
    const qy = dy + 18;
    g.fillStyle = '#241E16';
    g.font = '700 27px "PingFang SC","Microsoft YaHei",sans-serif';
    const qlines = wrapLines(g, r.line, R - L - 40);
    const qh = qlines.length * 42 + 34;
    g.fillStyle = 'rgba(158,59,34,.08)';
    g.fillRect(L - 12, qy, R - L + 24, qh);
    g.fillStyle = '#9E3B22';
    g.fillRect(L - 12, qy, 6, qh);
    g.fillStyle = '#241E16';
    qlines.forEach((ln, i) => g.fillText(ln, L + 12, qy + 42 + i * 42));

    // 建议
    g.fillStyle = '#4A4034';
    g.font = '19px "PingFang SC","Microsoft YaHei",sans-serif';
    const aLines = wrapLines(g, r.advice, R - L - 10).slice(0, 3);
    aLines.forEach((ln, i) => g.fillText(ln, L, qy + qh + 44 + i * 30));

    // 防伪纹水印（填空档，同时是卷宗质感）
    const wmY = qy + qh + 44 + aLines.length * 30 + 20;
    const footTop = PY + PH - 118;
    drawRosette(g, (L + R) / 2, (wmY + footTop) / 2 - 6, 74, 26, 7, 14, 260,
                '#9E3B22', .14, 1);

    // 底部
    const footY = PY + PH - 118;
    g.strokeStyle = 'rgba(36,30,22,.28)'; g.setLineDash([6, 6]); g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(L, footY); g.lineTo(R, footY); g.stroke();
    g.setLineDash([]);

    const qs = 92, qx = R - qs, qyy = footY + 14;
    if (QR_IMG){
      g.fillStyle = '#fff'; g.fillRect(qx - 6, qyy - 6, qs + 12, qs + 12);
      g.drawImage(QR_IMG, qx, qyy, qs, qs);
    } else {
      g.strokeStyle = 'rgba(36,30,22,.35)'; g.lineWidth = 1.5;
      g.strokeRect(qx, qyy, qs, qs);
      g.fillStyle = '#8B7C63';
      g.font = '15px "PingFang SC","Microsoft YaHei",sans-serif';
      g.textAlign = 'center';
      g.fillText('二维码', qx + qs / 2, qyy + 52);
      g.fillText('放这里', qx + qs / 2, qyy + 74);
      g.textAlign = 'left';
    }

    g.fillStyle = '#241E16';
    g.font = '600 22px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText(TEST.qrCaption, L, footY + 52);
    g.fillStyle = '#8B7C63';
    g.font = '16px "Courier New",monospace';
    g.fillText('仅供娱乐 · 不构成任何情感建议', L, footY + 84);
    if (TEST.customLine){
      g.fillStyle = '#6E6250';
      g.font = '16px "Courier New",monospace';
      g.fillText(TEST.customLine, L, footY + 108);
    }

    return c.toDataURL('image/png');
  }
};

$('btnStart').addEventListener('click', startQuiz);
$('btnAgain').addEventListener('click', startQuiz);
$('btnPoster').addEventListener('click', showPoster);
$('btnShare').addEventListener('click', copyLink);

</script>
