<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070B1C">
<title>你的正缘是什么类型的人 · 姻缘星图</title>
<meta name="description" content="你未来的另一半长什么样？20 道题，排出属于你的正缘星图。仅供娱乐，不构成任何恋爱建议。">
<style>
/* ===== 正缘类型 · 姻缘星图 ===== */
:root{
  --night:#070B1C; --night-2:#101736; --night-3:#182046;
  --star:#EAEFFA; --gold:#D9B879; --gold-d:#B8955A;
  --blue:#8FA6D8; --muted:#7C88AE; --line:rgba(217,184,121,.18);
  --serif:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
  --sans:"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--night);color:var(--star);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:
    radial-gradient(120% 60% at 50% -10%,rgba(143,166,216,.22),transparent 60%),
    radial-gradient(90% 50% at 50% 110%,rgba(217,184,121,.10),transparent 65%),
    linear-gradient(180deg,#070B1C 0%,#0C1229 45%,#101736 100%);
  background-attachment:fixed;
}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.stars i{position:absolute;border-radius:50%;background:#fff;opacity:.7;
  animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.18}50%{opacity:.95}}
.app{max-width:430px;margin:0 auto;position:relative;min-height:100vh;min-height:100dvh;z-index:1}
.screen{display:none;flex-direction:column;min-height:100vh;min-height:100dvh;
  padding:30px 24px calc(26px + env(safe-area-inset-bottom));position:relative}
.screen.active{display:flex}

/* ---------- 共用小字 ---------- */
.eyebrow{
  font-family:var(--sans);font-size:10px;letter-spacing:.42em;color:var(--gold);
  text-transform:uppercase;text-align:center;margin:0;text-indent:.42em;
}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line) 20%,var(--line) 80%,transparent)}

/* ---------- 按钮 ---------- */
.btn{
  display:block;width:100%;border:1px solid var(--gold);background:transparent;color:var(--gold);
  font-family:var(--sans);font-size:14.5px;letter-spacing:.22em;text-indent:.22em;
  padding:16px 12px;border-radius:2px;cursor:pointer;transition:background .2s,color .2s;
}
.btn.solid{background:linear-gradient(180deg,#E2C78D,#C6A059);border-color:transparent;color:#141A33;font-weight:600}
.btn.solid:active{transform:translateY(1px)}
.btn.ghost{border-color:rgba(217,184,121,.4);color:var(--blue);font-size:12.5px;letter-spacing:.14em;text-indent:.14em;padding:13px 8px}

/* ---------- 封面 ---------- */
.cover{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:0;position:relative}
.cover .chart{width:min(300px,78vw);height:min(300px,78vw);margin:6px 0 4px;position:relative}
.chart svg{width:100%;height:100%;display:block;overflow:visible}
.chart .spin{transform-origin:160px 160px;animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cover h1{
  font-family:var(--serif);font-size:clamp(30px,9.2vw,40px);font-weight:600;
  line-height:1.42;letter-spacing:.1em;margin:14px 0 0;color:#F3F6FF;
  text-shadow:0 0 24px rgba(143,166,216,.35);
}
.cover h1 b{font-weight:600;color:var(--gold);letter-spacing:.14em}
.cover .lede{font-size:13.5px;line-height:2;color:#A8B3D4;margin:16px 0 0;max-width:18em}
.cover .meta{font-size:10.5px;letter-spacing:.16em;color:var(--muted);margin:22px 0 0}
.cover-foot{display:flex;flex-direction:column;gap:12px;margin-top:28px;width:100%}

/* ---------- 答题 ---------- */
.seg{display:flex;gap:2px;margin:4px 0 6px}
.seg i{flex:1;height:3px;border-radius:2px;background:rgba(217,184,121,.26);transition:background .3s,box-shadow .3s}
.seg i.on{background:var(--gold);box-shadow:0 0 8px rgba(217,184,121,.7)}
.qmeta{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em;
  color:var(--muted);margin:16px 0 0}
.qmeta b{color:var(--gold);font-weight:400}
.qwrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:18px 0 6px}
.qtext{
  font-family:var(--serif);font-size:23px;line-height:1.72;font-weight:600;
  letter-spacing:.02em;color:#F3F6FF;margin:0 0 30px;text-align:center;
}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:rgba(255,255,255,.022);border:1px solid rgba(217,184,121,.16);
  border-radius:2px;padding:16px 16px;cursor:pointer;color:#C9D2EC;
  font-family:var(--sans);font-size:15px;line-height:1.6;
  transition:background .18s,border-color .18s,color .18s;
}
.opt .dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;
  border:1px solid rgba(217,184,121,.6);position:relative;transition:all .18s}
.opt.sel{background:rgba(217,184,121,.12);border-color:var(--gold);color:#FFF6E4}
.opt.sel .dot{background:var(--gold);border-color:var(--gold);
  box-shadow:0 0 10px rgba(217,184,121,.9),0 0 22px rgba(217,184,121,.45)}
.hint{font-size:10.5px;letter-spacing:.22em;color:var(--muted);text-align:center;margin:22px 0 0}

/* ---------- 结果 ---------- */
.rhead{text-align:center;padding:8px 0 0}
.rhead .eyebrow{font-size:9.5px}
.r-title{
  font-family:var(--serif);font-size:38px;font-weight:600;letter-spacing:.1em;
  margin:12px 0 0;color:#F6F8FF;text-shadow:0 0 30px rgba(217,184,121,.45);
}
.r-tag{display:inline-block;margin-top:10px;font-size:11px;letter-spacing:.2em;
  color:var(--gold);border:1px solid rgba(217,184,121,.42);padding:5px 12px 5px 14px;border-radius:1px}
.r-chart{width:100%;max-width:300px;margin:6px auto 0;display:block}
.dims{display:flex;flex-direction:column;gap:13px;margin:6px 0 0}
.dim-row{display:flex;align-items:center;gap:12px}
.dim-row .n{font-family:var(--serif);font-size:13px;color:#B7C1DE;width:74px;flex:0 0 auto;letter-spacing:.1em}
.dim-row .track{flex:1;height:3px;background:rgba(255,255,255,.09);position:relative;border-radius:2px}
.dim-row .track i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;
  background:linear-gradient(90deg,rgba(217,184,121,.35),var(--gold));
  width:var(--w,0%);transform-origin:left center;
  box-shadow:0 0 10px rgba(217,184,121,.55);
  animation:grow .95s cubic-bezier(.2,.9,.3,1) .25s both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.dim-row .v{font-size:11px;color:var(--muted);width:26px;text-align:right;font-variant-numeric:tabular-nums}
.block{margin-top:26px}
.block h3{font-family:var(--serif);font-size:12px;font-weight:600;letter-spacing:.3em;
  color:var(--gold);margin:0 0 12px;text-indent:.3em}
.body-text{font-size:14px;line-height:2.05;color:#AEB9D8;margin:0;text-align:justify}
.traits{display:flex;flex-wrap:wrap;gap:18px;font-family:var(--serif);font-size:14px;color:#DCE3F6;letter-spacing:.08em}
.traits span::before{content:"✦";color:var(--gold);font-size:10px;margin-right:6px;vertical-align:1px}
.quote{font-family:var(--serif);font-size:19px;line-height:1.9;color:#F3E9D2;
  margin:28px 0 0;text-align:center;letter-spacing:.08em;position:relative;padding:18px 0}
.quote::before,.quote::after{content:"";position:absolute;left:50%;transform:translateX(-50%);
  width:44px;height:1px;background:var(--line)}
.quote::before{top:0}.quote::after{bottom:0}
.advice{font-size:13px;line-height:1.95;color:var(--muted);margin:22px 0 0;
  border-left:1px solid rgba(217,184,121,.3);padding-left:14px}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.acts-row{display:flex;gap:10px}
.acts-row .btn{flex:1}

/* ---------- 弹层适配 ---------- */
.modal-tip{color:#B7C1DE}
.modal-x{border-color:rgba(217,184,121,.4);color:#D9B879}


/* ---------- 共用弹层 ---------- */
.modal{position:fixed;inset:0;background:rgba(8,10,9,.9);display:none;z-index:80;
  padding:24px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal.on{display:flex;flex-direction:column;align-items:center;justify-content:center}
.modal-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px;align-items:center}
.poster-img{width:100%;display:block;border-radius:3px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.modal-tip{font-size:12.5px;line-height:1.8;text-align:center;opacity:.62;margin:0}
.modal-x{margin-top:4px;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;
  font-size:13px;padding:9px 26px;border-radius:2px;letter-spacing:.08em;cursor:pointer}
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,12px);
  background:rgba(20,20,20,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:3px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:90;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="app">

  <!-- 封面 -->
  <section class="screen active" id="s-cover">
    <p class="eyebrow">Destiny Chart · 姻缘星图</p>
    <div class="cover">
      <div class="chart" id="coverArt"></div>
      <h1>你的正缘<br><b>是什么类型的人</b></h1>
      <p class="lede">你在什么时刻心动，<br>需要多近的距离，<br>又凭什么把人留下。</p>
      <p class="meta">题库 45 道 · 随机抽 20 道 · 每次星图都不同</p>
    </div>
    <div class="cover-foot">
      <button class="btn solid" id="btnStart">开 始 排 盘</button>
    </div>
  </section>

  <!-- 答题 -->

  <!-- 结果 -->
  <section class="screen" id="s-result">
    <div class="rhead">
      <p class="eyebrow">Your Constellation</p>
      <h2 class="r-title" id="rTitle"></h2>
      <span class="r-tag" id="rTag"></span>

    <div class="dims" id="rDims"></div>

    <div class="block"><h3>命 定 特 征</h3><div class="traits" id="rTraits"></div></div>
    <p class="quote" id="rLine"></p>
    <p class="advice" id="rAdvice"></p>
    <div class="acts">
      <button class="btn solid" id="btnPoster">生成我的星图卡</button>
      <div class="acts-row">
        <button class="btn ghost" id="btnShare">复制链接</button>
        <button class="btn ghost" id="btnAgain">再排一次</button>
      </div>
    </div>
  </section>

</div>

<div class="modal" id="modal">
  <div class="modal-card" id="modalBody"></div>
  <button class="modal-x" onclick="closeModal()">关闭</button>
</div>
<div class="toast" id="toast"></div>

/* ===== 共用引擎：抽题 / 打乱 / 计分 / 弹层 / 通用画笔 =====
   每个主题只提供 SKIN 对象和 TEST 数据，其余都走这里。 */

const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';

/* ---------- 二维码（每套主题在 data.js 里配） ---------- */
let QR_IMG = null;
if (TEST.qrImage){
  QR_IMG = new Image();
  QR_IMG.src = TEST.qrImage;
}

/* ---------- 工具 ---------- */
function shuffleArr(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 按维度配比抽题：slots 之和 = TEST.quizLen */
function drawQuiz(){
  const picked = [];
  const slots = shuffleArr(TEST.slots.slice());
  TEST.dims.forEach((m, di) => {
    const pool = shuffleArr(TEST.bank.filter(x => x.d === di));
    picked.push.apply(picked, pool.slice(0, slots[di]));
  });
  return shuffleArr(picked);
}

/* ---------- 状态 ---------- */
const state = { i:0, scores:[], drawn:[], opts:[], total:0, result:null, dims:null };
let locked = false;

/* ---------- 流程 ---------- */
function startQuiz(){
  state.i = 0;
  state.scores = [];
  state.drawn = drawQuiz();
  state.opts = state.drawn.map(q => shuffleArr(q.o.map(o => ({ t:o[0], s:o[1] }))));
  locked = false;
  SKIN.goQuiz();
  SKIN.renderQuestion();
}

function choose(score, el){
  if (locked) return;
  locked = true;
  if (el) el.classList.add('sel');
  state.scores.push(score);
  SKIN.afterChoose(el, score);
  setTimeout(() => {
    locked = false;
    if (state.i < TEST.quizLen - 1){
      state.i++;
      SKIN.renderQuestion();
    } else {
      finish();
    }
  }, SKIN.advanceDelay || 240);
}

function finish(){
  state.total = state.scores.reduce((a,b) => a + b, 0);
  state.result = TEST.results.find(r => state.total >= r.min && state.total <= r.max) || TEST.results[0];

  const sum = [0,0,0], cnt = [0,0,0];
  state.drawn.forEach((q, i) => { sum[q.d] += state.scores[i]; cnt[q.d]++; });
  state.dims = TEST.dims.map((m, d) => ({
    name: m.name,
    pct: Math.max(TEST.pctFloor || 6, Math.min(100, Math.round(sum[d] / (cnt[d] * 3) * 100)))
  }));

  SKIN.goResult();
  SKIN.renderResult();
  window.scrollTo(0,0);
}

/* ---------- 弹层 ---------- */
function openModal(html){

}
function closeModal(){ $('modal').classList.remove('on'); }

function showPoster(){

function copyLink(){
  const url = location.href;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(
      () => toast('链接已复制'),
      () => toast('长按地址栏复制链接')
    );
  } else {
    toast('长按地址栏复制链接');
  }
}

let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1900);
}

/* ---------- 画布通用件 ---------- */
function makeCanvas(w, h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function wrapLines(g, text, maxW){
  const out = []; let line = '';
  for (const ch of text){
    if (g.measureText(line + ch).width > maxW && line){ out.push(line); line = ch; }
    else line += ch;
  }
  if (line) out.push(line);
  return out;
}
/* 防伪扭索纹：r = R + A·sin(Nθ) 旋转复制 */
function drawRosette(g, cx, cy, R, amp, N, P, steps, color, alpha, lw){
  g.save();
  g.strokeStyle = color; g.globalAlpha = alpha; g.lineWidth = lw || 0.9;
  for (let k = 0; k < P; k++){
    const rot = k * 2 * Math.PI / (N * P);
    g.beginPath();
    for (let i = 0; i <= steps; i++){
      const t = i / steps * Math.PI * 2;
      const r = R + amp * Math.sin(N * t);
      const a = t + rot;
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  }
  g.restore();
}
function roundRect(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function show(id){

/* ---------- 封面星盘 ---------- */
(function buildCoverArt(){
  const gold = '#D9B879';
  let ticks = '';
  for (let d = 0; d < 72; d++){

    const r1 = 150, r2 = d % 6 === 0 ? 140 : 146;

      + '" stroke="' + gold + '" stroke-width="' + (d % 6 === 0 ? 1.1 : .6) + '" opacity=".5"/>';
  }
  const pts = [[70,166],[104,110],[136,158],[170,104],[204,150]];

  $('coverArt').innerHTML =

    + '<circle cx="160" cy="160" r="120" fill="none" stroke="' + gold + '" stroke-width=".6" stroke-dasharray="2 6" opacity=".4"/>'
    + '<circle cx="160" cy="160" r="86" fill="none" stroke="#8FA6D8" stroke-width=".6" opacity=".28"/>'
    + '<g class="spin">' + ticks + '</g>'
    + '<polyline points="' + poly + '" fill="none" stroke="' + gold + '" stroke-width="1.2" opacity=".55"/>'
    + '<line x1="104" y1="110" x2="62" y2="84" stroke="' + gold + '" stroke-width="1" opacity=".35"/>'
    + '<circle cx="62" cy="84" r="1.8" fill="#FFF3D6" opacity=".8"/>'
    + '<line x1="204" y1="150" x2="238" y2="196" stroke="' + gold + '" stroke-width="1" opacity=".35"/>'
    + '<circle cx="238" cy="196" r="1.8" fill="#FFF3D6" opacity=".8"/>'
    + dots
    + '</svg>';
})();

/* ---------- 结果星图 ---------- */
function drawResultChart(){
  const cx = 150, cy = 90;
  const pts = [];
  for (let k = 0; k < 6; k++){
    const d = state.dims[k % 3];
    const a = (-90 + k * 60) * Math.PI / 180;
    const r = 28 + d.pct / 100 * 50;

  }
  const poly = pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  let dots = '';
  pts.forEach(p => {
    dots += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="8" fill="#D9B879" opacity=".13"/>'
      + '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.6" fill="#FFF3D6"/>';
  });

const SKIN = {

  afterChoose(el){ /* .sel 样式由 CSS 完成 */ },

  buildPoster(){
    const W = 750, H = 1200;
    const c = makeCanvas(W, H), g = c.getContext('2d');
    const r = state.result;

    // 夜空
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#070B1C'); bg.addColorStop(.5, '#0C1229'); bg.addColorStop(1, '#101736');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    const glow = g.createRadialGradient(W / 2, 150, 20, W / 2, 150, 520);
    glow.addColorStop(0, 'rgba(143,166,216,.20)'); glow.addColorStop(1, 'rgba(143,166,216,0)');
    g.fillStyle = glow; g.fillRect(0, 0, W, 700);

    // 星
    for (let k = 0; k < 170; k++){
      const sx = Math.random() * W, sy = Math.random() * H;
      const sr = Math.random() * 1.5 + .4;
      g.globalAlpha = Math.random() * .6 + .2;
      g.fillStyle = '#fff';
      g.beginPath(); g.arc(sx, sy, sr, 0, Math.PI * 2); g.fill();
    }

    g.fillStyle = '#D9B879';
    g.font = '17px "PingFang SC","Microsoft YaHei",sans-serif';
    tracked(g, 'DESTINY CHART · 姻缘星图', W / 2, 92, 4, 'center');

    g.strokeStyle = 'rgba(217,184,121,.28)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(90, 118); g.lineTo(W - 90, 118); g.stroke();

    // 标题
    g.fillStyle = '#F6F8FF';
    g.font = '600 68px "Songti SC","STSong",serif';
    g.textAlign = 'center';
    g.fillText(r.title, W / 2, 208);
    g.textAlign = 'left';

    // 标签
    g.font = '18px "PingFang SC","Microsoft YaHei",sans-serif';
    tracked(g, r.tag, W / 2, 254, 3, 'center');

    // 星图
    const cx = W / 2, cy = 420, RAD = 128;
    g.strokeStyle = 'rgba(143,166,216,.18)'; g.lineWidth = 1;
    g.beginPath(); g.ellipse(cx, cy, RAD + 40, (RAD + 40) * .86, 0, 0, Math.PI * 2); g.stroke();
    g.setLineDash([3, 9]);
    g.strokeStyle = 'rgba(143,166,216,.16)';
    g.beginPath(); g.ellipse(cx, cy, RAD, RAD * .86, 0, 0, Math.PI * 2); g.stroke();
    g.setLineDash([]);

    const pts = [];
    for (let k = 0; k < 6; k++){
      const d = state.dims[k % 3];
      const a = (-90 + k * 60) * Math.PI / 180;
      const rr = 46 + d.pct / 100 * 86;
      pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * .86]);
    }
    g.beginPath();
    pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
    g.closePath();
    g.fillStyle = 'rgba(217,184,121,.06)'; g.fill();
    g.strokeStyle = 'rgba(217,184,121,.8)'; g.lineWidth = 1.6; g.stroke();
    pts.forEach(p => {
      g.fillStyle = 'rgba(217,184,121,.16)';
      g.beginPath(); g.arc(p[0], p[1], 12, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#FFF3D6';
      g.beginPath(); g.arc(p[0], p[1], 4, 0, Math.PI * 2); g.fill();
    });

    // 三维
    let dy = 640;
    state.dims.forEach(d => {
      g.fillStyle = '#B7C1DE';
      g.font = '20px "Songti SC","STSong",serif';
      g.fillText(d.name, 96, dy + 6);
      const tx = 230, tw = 384;
      g.fillStyle = 'rgba(255,255,255,.1)'; g.fillRect(tx, dy - 4, tw, 4);
      const gr = g.createLinearGradient(tx, 0, tx + tw, 0);
      gr.addColorStop(0, 'rgba(217,184,121,.4)'); gr.addColorStop(1, '#D9B879');
      g.fillStyle = gr; g.fillRect(tx, dy - 4, tw * d.pct / 100, 4);
      g.fillStyle = '#7C88AE';
      g.font = '15px "PingFang SC","Microsoft YaHei",sans-serif';
      g.textAlign = 'right';
      g.fillText(String(d.pct), 654, dy + 6);
      g.textAlign = 'left';
      dy += 48;

    // 金句
    g.fillStyle = '#F3E9D2';
    g.font = '600 34px "Songti SC","STSong",serif';
    const ql = wrapLines(g, r.line, W - 200);
    ql.forEach((ln, i) => {
      g.textAlign = 'center';
      g.fillText(ln, W / 2, 840 + i * 52);

    g.strokeStyle = 'rgba(217,184,121,.25)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(W / 2 - 26, 812); g.lineTo(W / 2 + 26, 812); g.stroke();

    // 建议
    g.fillStyle = '#8D99BC';
    g.font = '20px "PingFang SC","Microsoft YaHei",sans-serif';

      g.textAlign = 'center';
      g.fillText(ln, W / 2, 918 + i * 36);

    // 底部

    g.strokeStyle = 'rgba(217,184,121,.22)'; g.lineWidth = 1;

    const qs = 100, qx = W - 72 - qs, qy = footY + 22;

      g.fillText('二维码', qx + qs / 2, qy + 46);

      g.textAlign = 'left';

    g.fillStyle = '#EAEFFA';
    g.font = '600 21px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText(TEST.qrCaption, 72, footY + 56);
    g.fillStyle = '#68739A';
    g.font = '15px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText('仅供娱乐 · 不构成任何恋爱建议', 72, footY + 88);
    if (TEST.customLine){
      g.fillText(TEST.customLine, 72, footY + 112);
    }

    return c.toDataURL('image/png');
  }
};

/* 字间距绘制 */
function tracked(g, text, x, y, sp, align){
  const chars = Array.from(text);
  let w = 0;
  chars.forEach(ch => { w += g.measureText(ch).width + sp; });
  w -= sp;
  let sx = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
  chars.forEach(ch => {
    g.fillText(ch, sx, y);
    sx += g.measureText(ch).width + sp;
  });
}
