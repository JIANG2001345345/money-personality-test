<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF6EC">
<title>你是猫系还是狗系人格？20 道题测出你身上那股劲儿</title>
<meta name="description" content="黏人、外放、信任三个维度，测出你更像猫还是更像狗：野猫、边牧、猫狗同体、金毛、蹭腿猫。">
<style>
/* ===== 猫系还是狗系 · 暖橘奶油 / 粗黑体 / 左右分屏 ===== */
:root{
  --cream:#FFF6EC; --paper:#FFFFFF; --ink:#241A14; --orange:#F0722F;
  --sand:#F3DFC8; --dim:#9A8674; --line:#EBD9C6;
  --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  --serif:"Songti SC","STSong",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:radial-gradient(rgba(240,114,47,.10) 1px,transparent 1px);
  background-size:17px 17px}
.app{max-width:430px;margin:0 auto;position:relative;min-height:100vh;min-height:100dvh}
.screen{display:none;flex-direction:column;min-height:100vh;min-height:100dvh;
  padding:22px 22px calc(26px + env(safe-area-inset-bottom))}
.screen.active{display:flex}
.eyebrow{font-size:9px;letter-spacing:.3em;color:var(--dim)}
.btn{display:block;width:100%;border:0;background:var(--ink);color:var(--cream);
  font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:.28em;text-indent:.28em;
  padding:16px 12px;cursor:pointer;border-radius:15px}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);
  font-size:12px;font-weight:600;letter-spacing:.14em;text-indent:.14em;padding:12px 8px;border-radius:12px}

/* ---------- 封面 ---------- */
.cover{flex:1;display:flex;flex-direction:column;justify-content:center;padding:6px 0 8px}
.c-top{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1.5px solid var(--line);padding-bottom:12px}
.c-title{font-size:clamp(28px,8.4vw,36px);font-weight:900;line-height:1.44;
  letter-spacing:-.01em;margin:26px 0 0}
.split{display:flex;gap:10px;margin:24px 0 0}
.split .half{flex:1;border:1.5px solid var(--line);border-radius:18px;background:var(--paper);
  padding:15px 0 13px;text-align:center}
.split .half b{display:block;font-size:40px;font-weight:900;line-height:1;
  letter-spacing:.02em;text-indent:.02em}
.split .half:first-child b{color:var(--orange)}
.split .half small{display:block;margin-top:9px;font-size:9px;font-weight:600;
  letter-spacing:.34em;text-indent:.34em;color:var(--dim)}
.lede{font-size:13px;line-height:1.95;color:#6B5643;margin:20px 0 0}
.cover-foot{display:flex;flex-direction:column;gap:14px;margin-top:26px}
.facts{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.14em;color:var(--dim)}

/* ---------- 答题 ---------- */
#s-quiz{padding-top:26px}
.qtop{display:flex;justify-content:space-between;align-items:baseline}
.q-no{font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--orange)}
.q-pct{font-size:10px;letter-spacing:.2em;color:var(--dim)}
.qtrack{height:7px;margin-top:13px;border-radius:4px;overflow:hidden;
  background:repeating-linear-gradient(90deg,var(--sand) 0 9px,transparent 9px 13px)}
.qtrack i{display:block;height:100%;width:var(--w,0);transform-origin:left;
  animation:grow .9s cubic-bezier(.2,.9,.3,1) both;
  background:repeating-linear-gradient(90deg,var(--orange) 0 9px,transparent 9px 13px)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.qwrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:56px}
.qkicker{font-size:9px;font-weight:600;letter-spacing:.36em;color:var(--dim);margin:0 0 15px}
.qtext{font-size:22px;font-weight:800;line-height:1.64;letter-spacing:-.005em;margin:0 0 24px}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{display:flex;align-items:center;gap:13px;width:100%;background:var(--paper);
  border:1.5px solid var(--line);border-radius:16px;padding:15px 15px 15px 14px;
  text-align:left;font-family:var(--sans);font-size:15px;font-weight:500;line-height:1.45;
  color:#3A2A1E;cursor:pointer;transition:border-color .15s,box-shadow .15s,opacity .15s}
.opt .k{width:26px;height:26px;flex:0 0 auto;border-radius:50%;background:var(--sand);
  color:#8A6A4A;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--orange);box-shadow:0 8px 20px rgba(240,114,47,.13)}
.opt.sel .k{background:var(--orange);color:#fff}
.opt.dim{opacity:.4}
.qfoot{text-align:center;font-size:10px;letter-spacing:.16em;color:var(--dim);margin:0}

/* ---------- 结果 ---------- */
.rtop{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1.5px solid var(--line);padding-bottom:10px}
.rname{font-size:clamp(40px,11.6vw,48px);font-weight:900;line-height:1.12;
  letter-spacing:.02em;margin:22px 0 0}
.rtag{font-size:12px;font-weight:500;letter-spacing:.05em;color:var(--dim);margin:12px 0 0}
.petbar{display:flex;gap:8px;margin-top:16px}
.petbar span{font-size:11px;font-weight:900;letter-spacing:.2em;text-indent:.2em;
  padding:5px 14px;border-radius:999px;border:1.5px solid var(--line);color:var(--dim)}
.petbar.cat span:first-child,.petbar.both span:first-child{
  background:var(--orange);border-color:var(--orange);color:#fff}
.petbar.dog span:last-child,.petbar.both span:last-child{
  background:var(--ink);border-color:var(--ink);color:var(--cream)}
.dims,.sec,.advice{margin-top:26px}
.seclab{font-size:9px;font-weight:700;letter-spacing:.3em;color:var(--dim);margin:0 0 12px}
.dim-row{display:flex;align-items:center;gap:11px;margin:12px 0}
.dim-row .n{width:40px;flex:0 0 auto;font-size:12px;font-weight:700}
.dim-row .track{flex:1;height:11px;border-radius:6px;background:var(--sand);overflow:hidden}
.dim-row .track i{display:block;height:100%;width:var(--w,0);border-radius:6px;
  background:var(--orange);transform-origin:left;
  animation:grow .9s cubic-bezier(.2,.9,.3,1) both}
.dim-row .v{width:30px;flex:0 0 auto;text-align:right;font-size:11px;font-weight:800;color:var(--dim)}
.body-text{font-size:13.5px;line-height:2.02;color:#3A2A1E;margin:0;text-align:justify}
.traits{display:flex;flex-wrap:wrap;gap:8px}
.traits span{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:#5A4636;
  background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px}
.quote{font-family:var(--sans);font-size:17px;font-weight:800;line-height:1.72;
  letter-spacing:-.005em;margin:26px 0 0;padding:20px 22px 20px 40px;
  background:var(--sand);border-radius:20px;position:relative}
.quote::before{content:'“';position:absolute;left:13px;top:2px;font-family:var(--serif);
  font-size:46px;line-height:1;color:rgba(240,114,47,.45)}
.advice{border-left:3px solid var(--orange);padding-left:14px}
.advice p:last-child{margin:0;font-size:12.5px;line-height:1.95;color:#6B5643}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.acts-row{display:flex;gap:10px}
.acts-row .btn{flex:1}
.rfoot{text-align:center;font-size:8.5px;letter-spacing:.3em;color:var(--dim);margin:26px 0 0}

/* 弹层 */
.modal-tip{color:#D8C7B4}


/* ---------- 共用弹层 ---------- */
.modal{position:fixed;inset:0;background:rgba(8,10,9,.9);display:none;z-index:80;
  padding:24px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal.on{display:flex;flex-direction:column;align-items:center;justify-content:center}
.modal-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px;align-items:center}
.poster-img{width:100%;display:block;border-radius:3px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.modal-tip{font-size:12.5px;line-height:1.8;text-align:center;opacity:.62;margin:0}
.modal-x{margin-top:4px;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;
  font-size:13px;padding:9px 26px;border-radius:2px;letter-spacing:.08em;cursor:pointer}
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,12px);
  background:rgba(20,20,20,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:3px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:90;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

</style>
</head>
<body>
<div class="app">

  <!-- 封面 -->
  <section class="screen active" id="s-cover">
    <div class="cover">
      <div class="c-top">
        <span class="eyebrow">PET PERSONALITY</span>
        <span class="eyebrow">NO. 01</span>
      </div>
      <h1 class="c-title">你身上那点劲儿，<br>像猫还是像狗？</h1>
      <div class="split" aria-hidden="true">
        <div class="half"><b>喵</b><small>MIAO</small></div>
        <div class="half"><b>汪</b><small>WANG</small></div>
      </div>
      <p class="lede">20 道题，测出你身上更像猫的那一部分，和更像狗的那一部分。这不是性格标签，是你累的时候会自动切回去的样子。</p>
      <div class="cover-foot">
        <button class="btn" id="btnStart">开 始 测 试</button>
        <div class="facts"><span>20 题</span><span>约 90 秒</span><span>五档结果</span></div>
      </div>
    </div>
  </section>

  <!-- 答题 -->
  <section class="screen" id="s-quiz">
    <div class="qtop"><span class="q-no" id="qCount">01 / 20</span><span class="q-pct" id="qPct">5%</span></div>
    <div class="qtrack"><i id="qBar"></i></div>
    <div class="qwrap">
      <p class="qkicker">Q U E S T I O N</p>
      <h2 class="qtext" id="qText"></h2>
      <div class="opts" id="opts"></div>
    </div>
    <p class="qfoot">凭第一反应选，别想太久</p>
  </section>

  <!-- 结果 -->
  <section class="screen" id="s-result">
    <div class="rtop"><span class="eyebrow">YOUR TYPE</span><span class="eyebrow" id="rNo">NO.0000</span></div>
    <h2 class="rname" id="rTitle"></h2>
    <p class="rtag" id="rTag"></p>
    <div class="petbar" id="rPet"><span>喵</span><span>汪</span></div>

    <div class="dims">
      <p class="seclab">三 个 维 度</p>
      <div id="rDims"></div>
    </div>
    <div class="sec">
      <p class="seclab">这 是 什 么 样 的 你</p>
      <p class="body-text" id="rAnalysis"></p>
    </div>
    <div class="sec">
      <p class="seclab">关 键 词</p>
      <div class="traits" id="rTraits"></div>
    </div>
    <p class="quote" id="rLine"></p>
    <div class="advice">
      <p class="seclab">给 你 的 建 议</p>
      <p id="rAdvice"></p>
    </div>

    <div class="acts">
      <button class="btn" id="btnPoster">生成结果海报</button>
      <div class="acts-row">
        <button class="btn ghost" id="btnShare">复制链接</button>
        <button class="btn ghost" id="btnAgain">再测一次</button>
      </div>
    </div>
    <p class="rfoot">CAT / DOG PERSONALITY</p>
  </section>

</div>

<div class="modal" id="modal">
  <div class="modal-card" id="modalBody"></div>
  <button class="modal-x" onclick="closeModal()">关闭</button>
</div>
<div class="toast" id="toast"></div>

/* ===== 共用引擎：抽题 / 打乱 / 计分 / 弹层 / 通用画笔 =====
   每个主题只提供 SKIN 对象和 TEST 数据，其余都走这里。 */

const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';

/* ---------- 二维码（每套主题在 data.js 里配） ---------- */
let QR_IMG = null;
if (TEST.qrImage){
  QR_IMG = new Image();
  QR_IMG.src = TEST.qrImage;
}

/* ---------- 工具 ---------- */
function shuffleArr(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 按维度配比抽题：slots 之和 = TEST.quizLen */
function drawQuiz(){
  const picked = [];
  const slots = shuffleArr(TEST.slots.slice());
  TEST.dims.forEach((m, di) => {
    const pool = shuffleArr(TEST.bank.filter(x => x.d === di));
    picked.push.apply(picked, pool.slice(0, slots[di]));
  });
  return shuffleArr(picked);
}

/* ---------- 状态 ---------- */
const state = { i:0, scores:[], drawn:[], opts:[], total:0, result:null, dims:null };
let locked = false;

/* ---------- 流程 ---------- */
function startQuiz(){
  state.i = 0;
  state.scores = [];
  state.drawn = drawQuiz();
  state.opts = state.drawn.map(q => shuffleArr(q.o.map(o => ({ t:o[0], s:o[1] }))));
  locked = false;
  SKIN.goQuiz();
  SKIN.renderQuestion();
}

function choose(score, el){
  if (locked) return;
  locked = true;
  if (el) el.classList.add('sel');
  state.scores.push(score);
  SKIN.afterChoose(el, score);
  setTimeout(() => {
    locked = false;
    if (state.i < TEST.quizLen - 1){
      state.i++;
      SKIN.renderQuestion();
    } else {
      finish();
    }
  }, SKIN.advanceDelay || 240);
}

function finish(){
  state.total = state.scores.reduce((a,b) => a + b, 0);
  state.result = TEST.results.find(r => state.total >= r.min && state.total <= r.max) || TEST.results[0];

  const sum = [0,0,0], cnt = [0,0,0];
  state.drawn.forEach((q, i) => { sum[q.d] += state.scores[i]; cnt[q.d]++; });
  state.dims = TEST.dims.map((m, d) => ({
    name: m.name,
    pct: Math.max(TEST.pctFloor || 6, Math.min(100, Math.round(sum[d] / (cnt[d] * 3) * 100)))
  }));

  SKIN.goResult();
  SKIN.renderResult();
  window.scrollTo(0,0);
}

/* ---------- 弹层 ---------- */
function openModal(html){
  $('modalBody').innerHTML = html;
  $('modal').classList.add('on');
}
function closeModal(){ $('modal').classList.remove('on'); }

function showPoster(){
  const url = SKIN.buildPoster();
  openModal('<img class="poster-img" src="' + url + '" alt="测试结果海报">'
    + '<p class="modal-tip">长按图片保存到相册<br>电脑上右键另存为</p>');
}

function copyLink(){
  const url = location.href;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(
      () => toast('链接已复制'),
      () => toast('长按地址栏复制链接')
    );
  } else {
    toast('长按地址栏复制链接');
  }
}

let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1900);
}

/* ---------- 画布通用件 ---------- */
function makeCanvas(w, h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function wrapLines(g, text, maxW){
  const out = []; let line = '';
  for (const ch of text){
    if (g.measureText(line + ch).width > maxW && line){ out.push(line); line = ch; }
    else line += ch;
  }
  if (line) out.push(line);
  return out;
}
/* 防伪扭索纹：r = R + A·sin(Nθ) 旋转复制 */
function drawRosette(g, cx, cy, R, amp, N, P, steps, color, alpha, lw){
  g.save();
  g.strokeStyle = color; g.globalAlpha = alpha; g.lineWidth = lw || 0.9;
  for (let k = 0; k < P; k++){
    const rot = k * 2 * Math.PI / (N * P);
    g.beginPath();
    for (let i = 0; i <= steps; i++){
      const t = i / steps * Math.PI * 2;
      const r = R + amp * Math.sin(N * t);
      const a = t + rot;
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  }
  g.restore();
}
function roundRect(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

/* ===== 猫系还是狗系 · 界面层 ===== */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0, 0);
}
const SERIF = '"Songti SC","STSong",serif';
const SANS = '"PingFang SC","Microsoft YaHei",sans-serif';
const ORANGE = '#F0722F', INK = '#241A14', CREAM = '#FFF6EC', SAND = '#F3DFC8', DIM = '#9A8674';

function petBlock(g, x, y, w, h, big, small, on, color){
  g.save();
  roundRect(g, x, y, w, h, 20);
  if (on){ g.fillStyle = color; g.fill(); }
  else {
    g.fillStyle = '#FFFFFF'; g.fill();
    g.strokeStyle = '#EBD9C6'; g.lineWidth = 2; g.stroke();
  }
  g.textAlign = 'center';
  g.fillStyle = on ? CREAM : 'rgba(36,26,20,.26)';
  g.font = '900 54px ' + SANS;
  g.fillText(big, x + w / 2, y + 74);
  g.font = '700 10px ' + SANS;
  g.fillText(small, x + w / 2, y + 102);
  g.textAlign = 'left';
  g.restore();
}

const SKIN = {
  advanceDelay: 250,

  goQuiz(){ show('s-quiz'); },
  goResult(){ show('s-result'); },

  renderQuestion(){
    const i = state.i;
    $('qCount').textContent = String(i + 1).padStart(2, '0') + ' / ' + TEST.quizLen;
    $('qPct').textContent = Math.round((i + 1) / TEST.quizLen * 100) + '%';
    $('qBar').style.width = ((i + 1) / TEST.quizLen * 100) + '%';
    $('qText').textContent = state.drawn[i].q;

    const box = $('opts');
    box.innerHTML = '';
    const K = ['A', 'B', 'C'];
    state.opts[i].forEach((o, k) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      const key = document.createElement('span');
      key.className = 'k'; key.textContent = K[k];
      const tx = document.createElement('span');
      tx.className = 't'; tx.textContent = o.t;
      b.appendChild(key); b.appendChild(tx);
      b.addEventListener('click', () => choose(o.s, b));
      box.appendChild(b);
    });
  },

  afterChoose(el){
    document.querySelectorAll('.opt').forEach(x => { if (x !== el) x.classList.add('dim'); });
  },

  renderResult(){
    const r = state.result, t = state.total;
    $('rNo').textContent = 'NO.' + String(1000 + t * 37).slice(-4);
    $('rTitle').textContent = r.title;
    $('rTag').textContent = r.tag;
    $('rPet').className = 'petbar ' + (r.pet || 'both');
    $('rAnalysis').textContent = r.analysis;
    $('rTraits').innerHTML = r.traits.map(x => '<span>' + x + '</span>').join('');
    $('rLine').textContent = r.line;
    $('rAdvice').textContent = r.advice;
    $('rDims').innerHTML = state.dims.map(d =>
      '<div class="dim-row"><span class="n">' + d.name + '</span>'
      + '<span class="track"><i style="--w:' + Math.max(4, d.pct) + '%"></i></span>'
      + '<span class="v">' + d.pct + '</span></div>'
    ).join('');
  },

  buildPoster(){
    const W = 750, H = 1200;
    const c = makeCanvas(W, H), g = c.getContext('2d');
    const r = state.result, M = 56, R = W - M;

    g.fillStyle = CREAM; g.fillRect(0, 0, W, H);
    g.fillStyle = 'rgba(240,114,47,.10)';
    for (let y = 24; y < H; y += 18){
      for (let x = 24; x < W; x += 18) g.fillRect(x, y, 2, 2);
    }
    g.strokeStyle = '#EBD9C6'; g.lineWidth = 2;
    roundRect(g, 26, 26, W - 52, H - 52, 26); g.stroke();

    // 眉标
    g.fillStyle = DIM; g.font = '700 11px ' + SANS;
    g.fillText('CAT / DOG  ·  RESULT', M, 78);

    // 唛头分屏
    const BW = W - M * 2, GAP = 12, half = (BW - GAP) / 2, BY = 96, BH = 126;
    const isCat = r.pet === 'cat' || r.pet === 'both';
    const isDog = r.pet === 'dog' || r.pet === 'both';
    petBlock(g, M, BY, half, BH, '喵', 'MIAO', isCat, ORANGE);
    petBlock(g, M + half + GAP, BY, half, BH, '汪', 'WANG', isDog, INK);

    // 名字
    g.fillStyle = INK; g.font = '900 74px ' + SANS;
    g.fillText(r.title, M, 302);
    g.fillStyle = DIM; g.font = '500 15px ' + SANS;
    g.fillText(r.tag, M, 344);

    g.strokeStyle = '#EBD9C6'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(M, 380); g.lineTo(R, 380); g.stroke();

    // 三维度
    g.font = '700 14px ' + SANS;
    let dy = 430;
    state.dims.forEach(d => {
      g.fillStyle = '#5A4636';
      g.fillText(d.name, M, dy + 10);
      roundRect(g, 116, dy, 442, 12, 6); g.fillStyle = SAND; g.fill();
      roundRect(g, 116, dy, Math.max(12, 442 * d.pct / 100), 12, 6); g.fillStyle = ORANGE; g.fill();
      g.fillStyle = DIM; g.font = '800 13px ' + SANS;
      g.textAlign = 'right'; g.fillText(String(d.pct), R, dy + 11);
      g.textAlign = 'left'; g.font = '700 14px ' + SANS;
      dy += 54;
    });

    // 正文
    g.fillStyle = '#3A2A1E'; g.font = '400 15.5px ' + SANS;
    const al = wrapLines(g, r.analysis, R - M).slice(0, 5);
    al.forEach((ln, i) => g.fillText(ln, M, 600 + i * 34));

    // 金句
    g.fillStyle = INK; g.font = '800 23px ' + SANS;
    const ql = wrapLines(g, r.line, R - M - 40).slice(0, 2);
    g.fillStyle = ORANGE; g.fillRect(M, 772, 4, ql.length > 1 ? 92 : 54);
    g.fillStyle = INK;
    ql.forEach((ln, i) => g.fillText(ln, M + 26, 810 + i * 40));

    // 关键词
    g.fillStyle = DIM; g.font = '700 14px ' + SANS;
    g.fillText(r.traits.join('  ·  '), M, 916);

    // 页脚
    g.strokeStyle = '#EBD9C6'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(M, 952); g.lineTo(R, 952); g.stroke();

    const qs = 96, qx = R - qs, qy = 992;
    g.fillStyle = '#fff';
    roundRect(g, qx - 8, qy - 8, qs + 16, qs + 16, 10); g.fill();
    g.strokeStyle = '#EBD9C6'; g.stroke();
    if (QR_IMG) g.drawImage(QR_IMG, qx, qy, qs, qs);
    else {
      g.fillStyle = '#C9BAA8'; g.font = '12px ' + SANS; g.textAlign = 'center';
      g.fillText('二维码', qx + qs / 2, qy + 46);
      g.fillText('放这里', qx + qs / 2, qy + 66);
      g.textAlign = 'left';
    }

    g.fillStyle = INK; g.font = '800 17px ' + SANS;
    const cl = wrapLines(g, TEST.qrCaption, 500).slice(0, 2);
    cl.forEach((ln, i) => g.fillText(ln, M, 1024 + i * 28));
    g.fillStyle = DIM; g.font = '400 11px ' + SANS;
    g.fillText('仅供娱乐 · 不构成任何专业评价', M, 1120);

    return c.toDataURL('image/png');
  }
};

/* ---------- 绑定 ---------- */
$('btnStart').addEventListener('click', startQuiz);
$('btnAgain').addEventListener('click', startQuiz);
$('btnPoster').addEventListener('click', showPoster);
$('btnShare').addEventListener('click', copyLink);

</script>
