<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E8EDF4">
<title>测测你的职场生存段位 · 你能在这家公司活到第几级</title>
<meta name="description" content="同一间办公室，有人三个月就混开了，有人三年还在原地。20 道题测你的向上管理、人情练达和边界硬度。">
<style>
/* ===== 职场生存段位 · 工牌/评定表 ===== */
:root{
  --bg:#E8EDF4; --card:#FFFFFF; --ink:#0E1318; --blue:#1F48F0;
  --grey:#7D8898; --line:#D9E0EA; --tint:#F1F5FF; --sub:#5A6676;
  --sans:"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif;
  --mono:Consolas,"SF Mono",Menlo,"Courier New",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:
    linear-gradient(rgba(14,19,24,.032) 1px,transparent 1px),
    linear-gradient(90deg,rgba(14,19,24,.032) 1px,transparent 1px);
  background-size:26px 26px;
  background-attachment:fixed;
}
.app{max-width:430px;margin:0 auto;position:relative;min-height:100vh;min-height:100dvh}
.screen{display:none;flex-direction:column;min-height:100vh;min-height:100dvh;
  padding:20px 20px calc(24px + env(safe-area-inset-bottom))}
.screen.active{display:flex}

/* ---------- 按钮 ---------- */
.btn{
  display:block;width:100%;border:2px solid var(--ink);background:var(--card);color:var(--ink);
  font-family:var(--sans);font-size:15px;font-weight:700;letter-spacing:.18em;text-indent:.18em;
  padding:14px 12px;cursor:pointer;border-radius:3px;box-shadow:3px 3px 0 var(--ink);
  transition:transform .1s ease,box-shadow .1s ease;
}
.btn.solid{background:var(--blue);color:#fff}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.ghost{box-shadow:none;border-width:1.5px;border-color:#B7C1CF;color:#3D4857;
  font-size:12.5px;font-weight:600;letter-spacing:.1em;text-indent:.1em;padding:11px 8px;background:#FBFCFE}

/* ---------- 封面：挂绳工牌 ---------- */
.cover{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-bottom:4px}
.strap{width:26px;height:clamp(70px,22vh,220px);margin-top:-20px;position:relative;
  background:linear-gradient(90deg,#122F9E,#2E5CFF 46%,#122F9E)}
.strap::after{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.13) 0 1px,transparent 1px 3px)}
.clip{width:32px;height:19px;border:2px solid #B4BFCE;border-radius:4px;margin-top:-1px;
  background:linear-gradient(180deg,#FAFBFD,#D9E0EA);position:relative;z-index:2}
.badge{
  width:100%;max-width:320px;background:var(--card);border:2px solid var(--ink);border-radius:5px;
  padding:32px 24px 0;margin-top:-2px;position:relative;overflow:hidden;box-shadow:6px 6px 0 var(--ink);
}
.badge::before{content:'';position:absolute;top:12px;left:50%;margin-left:-7px;width:14px;height:14px;
  border-radius:50%;background:var(--bg);box-shadow:inset 0 1.5px 2px rgba(14,19,24,.5)}
.b-top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.1em;color:var(--grey);border-bottom:1px solid var(--line);padding-bottom:9px}
.b-title{font-size:33px;line-height:1.28;font-weight:800;letter-spacing:.08em;margin:16px 0 0}
.b-title em{font-style:normal;color:var(--blue)}
.b-sub{font-size:12.5px;color:var(--sub);line-height:1.7;margin:9px 0 18px}
.b-row{display:flex;gap:10px;align-items:baseline;font-family:var(--mono);font-size:9.5px;
  color:var(--grey);letter-spacing:.1em;padding:8px 0;border-top:1px solid var(--line)}
.b-row b{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink);letter-spacing:.04em}
.barcode{height:36px;margin:14px -24px 0;
  background:
    repeating-linear-gradient(90deg,#0E1318 0 2px,transparent 2px 5px),
    repeating-linear-gradient(90deg,transparent 0 7px,#0E1318 7px 9px,transparent 9px 14px),
    repeating-linear-gradient(90deg,#0E1318 0 1px,transparent 1px 4px);
  background-size:37px 100%,61px 100%,17px 100%;opacity:.9}
.bcode{margin:0 -24px;padding:7px 0 9px;text-align:center;font-family:var(--mono);font-size:8.5px;
  letter-spacing:.3em;color:var(--grey);background:#F7F9FC;border-top:1px solid var(--line)}
.cover-foot{width:100%;max-width:320px;margin-top:auto;display:flex;flex-direction:column;gap:12px}
.facts{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.08em;color:var(--grey)}

/* ---------- 答题：问卷 ---------- */
.fhead{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);
  font-size:10px;letter-spacing:.12em;color:var(--grey);padding-top:10px}
.fhead b{font-size:12.5px;color:var(--blue)}
.fbar{height:7px;background:var(--card);border:1.5px solid var(--ink);margin-top:9px;position:relative;overflow:hidden}
.fbar i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);width:var(--w,0);transition:width .28s ease}
.qwrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px 0 58px}
.qtext{font-size:21px;line-height:1.62;font-weight:700;margin:0 0 22px;letter-spacing:.01em}
.opts{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;
  border:0;border-bottom:1px solid var(--line);padding:16px 4px;cursor:pointer;
  font-family:var(--sans);font-size:15px;line-height:1.6;color:#2A3441;transition:background .12s}
.opt .k{flex:0 0 auto;width:16px;height:16px;border:1.5px solid #A7B1C0;border-radius:2px;
  background:#fff;position:relative}
.opt .t{flex:1}
.opt.sel{background:var(--tint)}
.opt.sel .k{background:var(--blue);border-color:var(--blue)}
.opt.sel .k::after{content:'';position:absolute;left:4.4px;top:1px;width:4px;height:8.5px;
  border:solid #fff;border-width:0 1.8px 1.8px 0;transform:rotate(42deg)}
.hint{margin:16px 0 0;text-align:center;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.16em;color:#A3ADBB}

/* ---------- 结果：评定表 ---------- */
.rhead{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
  letter-spacing:.12em;color:var(--grey);padding:10px 0;border-bottom:1.5px solid var(--ink)}
.rank{display:flex;align-items:flex-start;gap:14px;margin-top:18px}
.rank-no{font-family:var(--mono);font-size:25px;font-weight:700;color:var(--blue);
  letter-spacing:-.02em;line-height:1.1;flex:0 0 auto}
.rank-name{font-size:33px;font-weight:800;line-height:1.15;margin:0;letter-spacing:.06em}
.rank-tag{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;
  color:var(--blue);border:1.5px solid var(--blue);background:#fff;padding:4px 7px;margin-top:9px}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:20px}
.ladder div{border:1.5px solid var(--line);background:var(--card);padding:7px 0 6px;text-align:center}
.ladder div i{display:block;font-style:normal;font-family:var(--mono);font-size:8px;
  letter-spacing:.06em;color:var(--grey)}
.ladder div span{display:block;font-size:9.5px;margin-top:3px;color:var(--sub);white-space:nowrap;
  letter-spacing:-.02em}
.ladder div.on{border-color:var(--ink);background:var(--blue);box-shadow:2px 2px 0 var(--ink)}
.ladder div.on i,.ladder div.on span{color:#fff}
.dims{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.dim-row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.dim-row .n{font-size:12px;color:var(--sub);width:60px;flex:0 0 auto}
.dim-row .track{flex:1;height:7px;background:#EEF2F7;border:1px solid #E0E6EE;position:relative;overflow:hidden}
.dim-row .track i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);width:var(--w,0);
  transform-origin:left center;animation:grow .9s cubic-bezier(.2,.9,.3,1) .2s both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.dim-row .v{font-family:var(--mono);font-size:11px;width:28px;text-align:right;color:var(--ink)}
.sec{margin-top:24px}
.sec h3{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.18em;
  color:var(--grey);margin:0 0 10px}
.review{margin:0;padding:15px 15px;background:var(--card);border:1.5px solid var(--line);
  border-left:3px solid var(--blue);font-size:13.5px;line-height:1.95;color:#2A3441;text-align:justify}
.traits{display:flex;flex-wrap:wrap;gap:8px}
.traits span{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;border:1.5px solid var(--ink);
  background:var(--card);padding:5px 9px}
.quote{margin:24px 0 0;padding:15px 0 0;border-top:2px solid var(--ink);
  font-size:16px;font-weight:600;line-height:1.85;letter-spacing:.02em}
.advice{margin:18px 0 0;font-size:12.5px;line-height:1.9;color:var(--sub)}
.advice b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;
  color:var(--blue);margin-bottom:6px}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.acts-row{display:flex;gap:10px}
.acts-row .btn{flex:1}
.rfoot{margin:32px 0 0;text-align:center;font-family:var(--mono);font-size:9px;
  letter-spacing:.16em;color:#A3ADBB}

/* ---------- 弹层适配 ---------- */
.modal-tip{color:#C9D2DE}
.modal-x{border-color:rgba(255,255,255,.32)}


/* ---------- 共用弹层 ---------- */
.modal{position:fixed;inset:0;background:rgba(8,10,9,.9);display:none;z-index:80;
  padding:24px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal.on{display:flex;flex-direction:column;align-items:center;justify-content:center}
.modal-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px;align-items:center}
.poster-img{width:100%;display:block;border-radius:3px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.modal-tip{font-size:12.5px;line-height:1.8;text-align:center;opacity:.62;margin:0}
.modal-x{margin-top:4px;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;
  font-size:13px;padding:9px 26px;border-radius:2px;letter-spacing:.08em;cursor:pointer}
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,12px);
  background:rgba(20,20,20,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:3px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:90;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

</style>
</head>

    <div class="acts">

        <button class="btn ghost" id="btnShare">复制链接</button>
        <button class="btn ghost" id="btnAgain">再测一次</button>
      </div>
    </div>
    <p class="rfoot">ZCSD · EMPLOYEE REVIEW · 2026</p>
  </section>

</div>

<div class="modal" id="modal">
  <div class="modal-card" id="modalBody"></div>
  <button class="modal-x" onclick="closeModal()">关闭</button>
</div>

const NS = 'http://www.w3.org/2000/svg';

/* ---------- 二维码（每套主题在 data.js 里配） ---------- */
let QR_IMG = null;
if (TEST.qrImage){
  QR_IMG = new Image();
  QR_IMG.src = TEST.qrImage;
}

/* ---------- 工具 ---------- */
function shuffleArr(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 按维度配比抽题：slots 之和 = TEST.quizLen */
function drawQuiz(){
  const picked = [];
  const slots = shuffleArr(TEST.slots.slice());
  TEST.dims.forEach((m, di) => {
    const pool = shuffleArr(TEST.bank.filter(x => x.d === di));
    picked.push.apply(picked, pool.slice(0, slots[di]));
  });
  return shuffleArr(picked);
}

/* ---------- 状态 ---------- */
const state = { i:0, scores:[], drawn:[], opts:[], total:0, result:null, dims:null };
let locked = false;

/* ---------- 流程 ---------- */
function startQuiz(){
  state.i = 0;
  state.scores = [];
  state.drawn = drawQuiz();
  state.opts = state.drawn.map(q => shuffleArr(q.o.map(o => ({ t:o[0], s:o[1] }))));
  locked = false;
  SKIN.goQuiz();
  SKIN.renderQuestion();
}

function choose(score, el){
  if (locked) return;
  locked = true;
  if (el) el.classList.add('sel');
  state.scores.push(score);
  SKIN.afterChoose(el, score);
  setTimeout(() => {
    locked = false;
    if (state.i < TEST.quizLen - 1){
      state.i++;
      SKIN.renderQuestion();
    } else {
      finish();
    }
  }, SKIN.advanceDelay || 240);
}

function finish(){
  state.total = state.scores.reduce((a,b) => a + b, 0);
  state.result = TEST.results.find(r => state.total >= r.min && state.total <= r.max) || TEST.results[0];

  const sum = [0,0,0], cnt = [0,0,0];
  state.drawn.forEach((q, i) => { sum[q.d] += state.scores[i]; cnt[q.d]++; });
  state.dims = TEST.dims.map((m, d) => ({
    name: m.name,
    pct: Math.max(TEST.pctFloor || 6, Math.min(100, Math.round(sum[d] / (cnt[d] * 3) * 100)))
  }));

  SKIN.goResult();
  SKIN.renderResult();
  window.scrollTo(0,0);
}

/* ---------- 弹层 ---------- */
function openModal(html){
  $('modalBody').innerHTML = html;
  $('modal').classList.add('on');
}
function closeModal(){ $('modal').classList.remove('on'); }

function showPoster(){
  const url = SKIN.buildPoster();
  openModal('<img class="poster-img" src="' + url + '" alt="测试结果海报">'
    + '<p class="modal-tip">长按图片保存到相册<br>电脑上右键另存为</p>');
}

function copyLink(){
  const url = location.href;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(
      () => toast('链接已复制'),
      () => toast('长按地址栏复制链接')
    );
  } else {
    toast('长按地址栏复制链接');
  }
}

let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1900);
}

/* ---------- 画布通用件 ---------- */
function makeCanvas(w, h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function wrapLines(g, text, maxW){
  const out = []; let line = '';
  for (const ch of text){
    if (g.measureText(line + ch).width > maxW && line){ out.push(line); line = ch; }
    else line += ch;
  }
  if (line) out.push(line);
  return out;
}
/* 防伪扭索纹：r = R + A·sin(Nθ) 旋转复制 */
function drawRosette(g, cx, cy, R, amp, N, P, steps, color, alpha, lw){
  g.save();
  g.strokeStyle = color; g.globalAlpha = alpha; g.lineWidth = lw || 0.9;
  for (let k = 0; k < P; k++){
    const rot = k * 2 * Math.PI / (N * P);
    g.beginPath();
    for (let i = 0; i <= steps; i++){
      const t = i / steps * Math.PI * 2;
      const r = R + amp * Math.sin(N * t);
      const a = t + rot;
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  }
  g.restore();
}
function roundRect(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

/* ===== 职场生存段位 · 界面层 ===== */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0, 0);
}
const MONO = 'Consolas,"SF Mono",Menlo,"Courier New",monospace';
const SANS = '"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif';

const SKIN = {
  advanceDelay: 220,

  goQuiz(){ show('s-quiz'); },
  goResult(){ show('s-result'); },

  renderQuestion(){
    const i = state.i;
    $('qIdx').textContent = String(i + 1).padStart(2, '0');
    $('qPct').textContent = Math.round((i + 1) / TEST.quizLen * 100) + '%';
    $('qBar').style.width = ((i + 1) / TEST.quizLen * 100) + '%';
    $('qText').textContent = state.drawn[i].q;

    const box = $('opts');
    box.innerHTML = '';
    state.opts[i].forEach(o => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      const k = document.createElement('span'); k.className = 'k';
      const t = document.createElement('span'); t.className = 't'; t.textContent = o.t;
      b.appendChild(k); b.appendChild(t);
      b.addEventListener('click', () => choose(o.s, b));
      box.appendChild(b);
    });
  },

  afterChoose(el){ /* .sel 勾选由 CSS 完成 */ },

  renderResult(){
    const r = state.result, t = state.total;
    const idx = TEST.results.indexOf(r);
    $('rNo').textContent = String(1000 + t * 17).slice(-4);
    $('rRank').textContent = r.rank;
    $('rTitle').textContent = r.title;
    $('rTag').textContent = r.tag;
    $('rAnalysis').textContent = r.analysis;
    $('rTraits').innerHTML = r.traits.map(x => '<span>' + x + '</span>').join('');
    $('rLine').textContent = r.line;
    $('rAdvice').textContent = r.advice;

    $('rLadder').innerHTML = TEST.results.map((x, i) =>
      '<div' + (i === idx ? ' class="on"' : '') + '><i>' + x.rank + '</i><span>' + x.short + '</span></div>'
    ).join('');

    $('rDims').innerHTML = state.dims.map(d =>
      '<div class="dim-row"><span class="n">' + d.name + '</span>'
      + '<span class="track"><i style="--w:' + d.pct + '%"></i></span>'
      + '<span class="v">' + d.pct + '</span></div>'
    ).join('');
  },

  buildPoster(){
    const W = 750, H = 1200;
    const c = makeCanvas(W, H), g = c.getContext('2d');
    const r = state.result, t = state.total;
    const CX = 46, CY = 46, CW = 658, CH = 1104;
    const L = 80, R = 670;

    // 底：冷灰蓝 + 网格
    g.fillStyle = '#E8EDF4'; g.fillRect(0, 0, W, H);
    g.strokeStyle = 'rgba(14,19,24,.045)'; g.lineWidth = 1;
    for (let x = 0; x <= W; x += 26){ g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
    for (let y = 0; y <= H; y += 26){ g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }

    // 硬投影 + 工牌
    g.fillStyle = '#0E1318'; g.fillRect(CX + 10, CY + 10, CW, CH);
    g.fillStyle = '#FFFFFF'; g.fillRect(CX, CY, CW, CH);

    // 蓝色头带
    g.fillStyle = '#1F48F0'; g.fillRect(CX, CY, CW, 78);
    g.fillStyle = '#FFFFFF';
    g.font = '800 24px ' + SANS;
    g.fillText('职场生存段位', L, CY + 51);
    g.font = '11px ' + MONO;
    g.fillStyle = 'rgba(255,255,255,.72)';
    g.textAlign = 'right';
    g.fillText('PERFORMANCE REVIEW · NO.' + String(1000 + t * 17).slice(-4), R, CY + 47);
    g.textAlign = 'left';

    // 段位标题
    g.fillStyle = '#7D8898';
    g.font = '12px ' + MONO;
    g.fillText('段位 / RANK', L, 164);

    g.fillStyle = '#1F48F0';
    g.font = '700 88px ' + MONO;
    g.fillText(r.rank, L, 262);

    g.fillStyle = '#0E1318';
    g.font = '800 50px ' + SANS;
    g.fillText(r.title, 342, 218);

    g.font = '13px ' + MONO;
    const tw = g.measureText(r.tag).width + 22;
    g.strokeStyle = '#1F48F0'; g.lineWidth = 1.6;
    g.strokeRect(342, 240, tw, 36);
    g.fillStyle = '#1F48F0';
    g.fillText(r.tag, 353, 264);

    // 段位列
    const n = TEST.results.length, gap = 5;
    const cw = (R - L - gap * (n - 1)) / n;
    const ly = 308, lh = 50;
    TEST.results.forEach((x, i) => {
      const x0 = L + i * (cw + gap);
      if (x === r){
        g.fillStyle = '#0E1318'; g.fillRect(x0 + 3, ly + 3, cw, lh);
        g.fillStyle = '#1F48F0'; g.fillRect(x0, ly, cw, lh);
      } else {
        g.fillStyle = '#FFFFFF'; g.fillRect(x0, ly, cw, lh);
        g.strokeStyle = '#D9E0EA'; g.lineWidth = 1.5; g.strokeRect(x0, ly, cw, lh);
      }
      g.textAlign = 'center';
      g.fillStyle = x === r ? 'rgba(255,255,255,.8)' : '#7D8898';
      g.font = '10px ' + MONO;
      g.fillText(x.rank, x0 + cw / 2, ly + 19);
      g.fillStyle = x === r ? '#FFFFFF' : '#5A6676';
      g.font = '13px ' + SANS;
      g.fillText(x.short, x0 + cw / 2, ly + 38);
      g.textAlign = 'left';
    });

    // 三维
    let dy = 408;
    state.dims.forEach(d => {
      g.fillStyle = '#5A6676';
      g.font = '15px ' + SANS;
      g.fillText(d.name, L, dy + 6);
      const tx = L + 92, twid = R - tx - 46;
      g.fillStyle = '#EEF2F7'; g.fillRect(tx, dy, twid, 8);
      g.fillStyle = '#1F48F0'; g.fillRect(tx, dy, twid * d.pct / 100, 8);
      g.fillStyle = '#0E1318';
      g.font = '13px ' + MONO;
      g.textAlign = 'right';
      g.fillText(String(d.pct), R, dy + 9);
      g.textAlign = 'left';
      dy += 42;
    });

    // 标签
    let px = L;
    const py = 528;
    g.font = '12px ' + MONO;
    r.traits.forEach(tr => {
      const w3 = g.measureText(tr).width + 22;
      g.fillStyle = '#FFFFFF'; g.fillRect(px, py, w3, 34);
      g.strokeStyle = '#0E1318'; g.lineWidth = 1.5; g.strokeRect(px, py, w3, 34);
      g.fillStyle = '#0E1318';
      g.fillText(tr, px + 11, py + 22);
      px += w3 + 9;
    });

    // 金句
    const qy = 634;
    g.fillStyle = '#0E1318'; g.fillRect(L, qy - 48, R - L, 2.5);
    g.font = '700 30px ' + SANS;
    const ql = wrapLines(g, r.line, 470);
    g.fillStyle = '#0E1318';
    ql.slice(0, 3).forEach((ln, i) => g.fillText(ln, L, qy + i * 44));

    // 建议
    const ay = qy + Math.min(ql.length, 3) * 44 + 22;
    g.fillStyle = '#1F48F0';
    g.font = '11px ' + MONO;
    g.fillText('ADVICE', L, ay);
    g.fillStyle = '#5A6676';
    g.font = '16px ' + SANS;
    wrapLines(g, r.advice, R - L).slice(0, 2).forEach((ln, i) => g.fillText(ln, L, ay + 28 + i * 26));

    // 条码
    const by = 862, bh = 46;
    g.fillStyle = '#F7F9FC'; g.fillRect(L, by - 10, R - L, bh + 34);
    g.fillStyle = '#0E1318';
    const pat = [2,3,1,4,2,2,5,1,3,2,1,3,6,2,1,2,4,1,3,2,2,5,1,2,3,1,4,2,1,3,2,6,1,2,3,1];
    let bx = L + 4, pi = 0;
    while (bx < R - 4){
      const w = pat[pi % pat.length];
      if (pi % 2 === 0) g.fillRect(bx, by, w, bh);
      bx += w + 1; pi++;
    }
    g.fillStyle = '#7D8898';
    g.font = '10px ' + MONO;
    g.fillText('ZCSD — 2026 — ' + String(1000 + t * 17).slice(-4), L, by + bh + 15);

    // 底部
    const fy = 986;
    g.fillStyle = 'rgba(14,19,24,.12)'; g.fillRect(L, fy, R - L, 1);
    const qs = 100, qx = R - qs, qy2 = fy + 22;
    g.fillStyle = '#fff'; g.fillRect(qx - 6, qy2 - 6, qs + 12, qs + 12);
    g.strokeStyle = '#0E1318'; g.lineWidth = 1.5; g.strokeRect(qx - 6, qy2 - 6, qs + 12, qs + 12);
    if (QR_IMG) g.drawImage(QR_IMG, qx, qy2, qs, qs);
    else {
      g.fillStyle = '#A3ADBB';
      g.font = '13px ' + SANS;
      g.textAlign = 'center';
      g.fillText('二维码', qx + qs / 2, qy2 + 48);
      g.fillText('放这里', qx + qs / 2, qy2 + 68);
      g.textAlign = 'left';
    }
    g.fillStyle = '#0E1318';
    g.font = '800 20px ' + SANS;
    g.fillText(TEST.qrCaption, L, fy + 56);
    g.fillStyle = '#7D8898';
    g.font = '14px ' + SANS;
    g.fillText('仅供娱乐 · 不构成任何职业评价', L, fy + 86);

    // 外框
    g.strokeStyle = '#0E1318'; g.lineWidth = 3;
    g.strokeRect(CX + 1.5, CY + 1.5, CW - 3, CH - 3);

    return c.toDataURL('image/png');
  }
};

/* ---------- 绑定 ---------- */
$('btnStart').addEventListener('click', startQuiz);
$('btnAgain').addEventListener('click', startQuiz);
$('btnPoster').addEventListener('click', showPoster);
$('btnShare').addEventListener('click', copyLink);

</script>
