      traits:["存在感强","表达直接","压迫感"],
      line:"我不是想吓你，我只是没打算装。",

};

/* ===== 共用引擎：抽题 / 打乱 / 计分 / 弹层 / 通用画笔 =====
   每个主题只提供 SKIN 对象和 TEST 数据，其余都走这里。 */

const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';

/* ---------- 二维码（每套主题在 data.js 里配） ---------- */
let QR_IMG = null;
if (TEST.qrImage){
  QR_IMG = new Image();
  QR_IMG.src = TEST.qrImage;
}

/* ---------- 工具 ---------- */
function shuffleArr(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 按维度配比抽题：slots 之和 = TEST.quizLen */
function drawQuiz(){
  const picked = [];
  const slots = shuffleArr(TEST.slots.slice());
  TEST.dims.forEach((m, di) => {
    const pool = shuffleArr(TEST.bank.filter(x => x.d === di));
    picked.push.apply(picked, pool.slice(0, slots[di]));
  });
  return shuffleArr(picked);
}

/* ---------- 状态 ---------- */
const state = { i:0, scores:[], drawn:[], opts:[], total:0, result:null, dims:null };
let locked = false;

/* ---------- 流程 ---------- */
function startQuiz(){
  state.i = 0;
  state.scores = [];
  state.drawn = drawQuiz();
  state.opts = state.drawn.map(q => shuffleArr(q.o.map(o => ({ t:o[0], s:o[1] }))));
  locked = false;
  SKIN.goQuiz();
  SKIN.renderQuestion();
}

function choose(score, el){
  if (locked) return;
  locked = true;
  if (el) el.classList.add('sel');
  state.scores.push(score);
  SKIN.afterChoose(el, score);
  setTimeout(() => {
    locked = false;
    if (state.i < TEST.quizLen - 1){
      state.i++;
      SKIN.renderQuestion();
    } else {
      finish();
    }
  }, SKIN.advanceDelay || 240);
}

function finish(){
  state.total = state.scores.reduce((a,b) => a + b, 0);
  state.result = TEST.results.find(r => state.total >= r.min && state.total <= r.max) || TEST.results[0];

  const sum = [0,0,0], cnt = [0,0,0];
  state.drawn.forEach((q, i) => { sum[q.d] += state.scores[i]; cnt[q.d]++; });
  state.dims = TEST.dims.map((m, d) => ({
    name: m.name,
    pct: Math.max(TEST.pctFloor || 6, Math.min(100, Math.round(sum[d] / (cnt[d] * 3) * 100)))
  }));

  SKIN.goResult();
  SKIN.renderResult();
  window.scrollTo(0,0);
}

/* ---------- 弹层 ---------- */
function openModal(html){
  $('modalBody').innerHTML = html;
  $('modal').classList.add('on');
}
function closeModal(){ $('modal').classList.remove('on'); }

function showPoster(){
  const url = SKIN.buildPoster();
  openModal('<img class="poster-img" src="' + url + '" alt="测试结果海报">'
    + '<p class="modal-tip">长按图片保存到相册<br>电脑上右键另存为</p>');
}

function copyLink(){
  const url = location.href;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(
      () => toast('链接已复制'),
      () => toast('长按地址栏复制链接')
    );
  } else {
    toast('长按地址栏复制链接');
  }
}

let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1900);
}

/* ---------- 画布通用件 ---------- */
function makeCanvas(w, h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function wrapLines(g, text, maxW){
  const out = []; let line = '';
  for (const ch of text){
    if (g.measureText(line + ch).width > maxW && line){ out.push(line); line = ch; }
    else line += ch;
  }
  if (line) out.push(line);
  return out;
}
/* 防伪扭索纹：r = R + A·sin(Nθ) 旋转复制 */
function drawRosette(g, cx, cy, R, amp, N, P, steps, color, alpha, lw){
  g.save();
  g.strokeStyle = color; g.globalAlpha = alpha; g.lineWidth = lw || 0.9;
  for (let k = 0; k < P; k++){
    const rot = k * 2 * Math.PI / (N * P);
    g.beginPath();
    for (let i = 0; i <= steps; i++){
      const t = i / steps * Math.PI * 2;
      const r = R + amp * Math.sin(N * t);
      const a = t + rot;
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  }
  g.restore();
}
function roundRect(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

/* ===== 第一印象 · 界面层 ===== */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0, 0);
}
const LEVELS = ['偏低', '中等', '偏高', '很高', '极高'];

const SKIN = {
  advanceDelay: 230,

  goQuiz(){ show('s-quiz'); },
  goResult(){ show('s-result'); },

  renderQuestion(){
    const i = state.i;
    $('qIdx').textContent = String(i + 1).padStart(2, '0');
    $('qPct').textContent = Math.round((i + 1) / TEST.quizLen * 100) + '%';
    $('qText').textContent = state.drawn[i].q;

    const box = $('opts');
    box.innerHTML = '';
    state.opts[i].forEach((o, idx) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      const k = document.createElement('span'); k.className = 'k';
      k.textContent = String(idx + 1).padStart(2, '0');
      const t = document.createElement('span'); t.className = 't'; t.textContent = o.t;
      b.appendChild(k); b.appendChild(t);
      b.addEventListener('click', () => choose(o.s, b));
      box.appendChild(b);
    });
  },

  afterChoose(el){ /* .sel 反黑由 CSS 完成 */ },

  renderResult(){
    const r = state.result, t = state.total;
    const lv = TEST.results.indexOf(r);
    $('rNo').textContent = 'NO.' + String(2000 + t * 13).slice(-4);
    $('rTitle').textContent = r.title;
    $('rTag').textContent = r.tag;
    $('rScore').textContent = t;
    $('rLevel').textContent = LEVELS[lv] || '偏高';
    $('rBar').style.setProperty('--w', Math.round((t - 20) / 40 * 100) + '%');
    $('rAnalysis').textContent = r.analysis;
    $('rTraits').innerHTML = r.traits.map(x => '<span>' + x + '</span>').join('');
    $('rLine').textContent = r.line;
    $('rAdvice').textContent = r.advice;
    $('rDims').innerHTML = state.dims.map(d =>
      '<div class="dim-row"><span class="n">' + d.name + '</span>'
      + '<span class="track"><i style="--w:' + d.pct + '%"></i></span>'
      + '<span class="v">' + d.pct + '</span></div>'
    ).join('');
  },

  buildPoster(){
    const W = 750, H = 1200;
    const c = makeCanvas(W, H), g = c.getContext('2d');
    const r = state.result, t = state.total, pct = Math.round((t - 20) / 40 * 100);
    const PAD = 60, R = W - PAD;

    g.fillStyle = '#F4F2EC'; g.fillRect(0, 0, W, H);

    // 半调网点圆
    g.save();
    g.beginPath(); g.arc(W - 10, 260, 158, 0, Math.PI * 2); g.clip();
    g.fillStyle = '#1737FF';
    for (let y = 110; y < 430; y += 11){
      for (let x = W - 220; x < W + 140; x += 11){
        g.beginPath(); g.arc(x, y, 1.7, 0, Math.PI * 2); g.fill();
      }
    }
    g.restore();

    // 报头
    g.fillStyle = '#141414';
    g.font = '700 18px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText('FIRST IMPRESSION', PAD, 84);
    g.textAlign = 'right';
    g.fillStyle = '#1737FF';
    g.fillText('NO.' + String(2000 + t * 13).slice(-4), R, 84);
    g.textAlign = 'left';
    g.fillStyle = '#141414'; g.fillRect(PAD, 100, R - PAD, 3);

    // 眉标
    g.fillStyle = '#8A867C';
    g.font = '16px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText('别 人 眼 里 的 你', PAD, 150);

    // 标题
    g.fillStyle = '#141414';
    g.font = '900 92px "PingFang SC","Microsoft YaHei",sans-serif';
    const tl = wrapLines(g, r.title, R - PAD);
    let ty = 250;
    tl.forEach(ln => { g.fillText(ln, PAD, ty); ty += 104; });

    // 标签
    g.font = '700 20px "PingFang SC","Microsoft YaHei",sans-serif';
    const tw = g.measureText(r.tag).width + 40;
    g.fillStyle = '#1737FF';
    g.fillRect(PAD, ty - 42, tw, 44);
    g.fillStyle = '#FFFFFF';
    g.fillText(r.tag, PAD + 20, ty - 12);

    // 分数
    const sy = ty + 100;
    g.fillStyle = '#141414';
    g.font = '900 84px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText(String(t), PAD, sy);
    const nw = g.measureText(String(t)).width;
    g.fillStyle = '#8A867C';
    g.font = '16px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText('野生指数 / 60', PAD + nw + 24, sy - 6);

    // 条
    g.fillStyle = '#EAE7DD'; g.fillRect(PAD, sy + 22, R - PAD, 10);
    g.fillStyle = '#1737FF'; g.fillRect(PAD, sy + 22, (R - PAD) * pct / 100, 10);

    // 三维
    let dy = sy + 74;
    state.dims.forEach(d => {
      g.fillStyle = '#3D3B36';
      g.font = '19px "PingFang SC","Microsoft YaHei",sans-serif';
      g.fillText(d.name, PAD, dy + 6);
      const tx = PAD + 118, twid = R - tx - 46;
      g.fillStyle = '#EAE7DD'; g.fillRect(tx, dy, twid, 5);
      g.fillStyle = '#141414'; g.fillRect(tx, dy, twid * d.pct / 100, 5);
      g.fillStyle = '#141414';
      g.font = '700 16px "PingFang SC","Microsoft YaHei",sans-serif';
      g.textAlign = 'right';
      g.fillText(String(d.pct), R, dy + 8);
      g.textAlign = 'left';
      g.fillStyle = 'rgba(20,20,20,.12)';
      g.fillRect(PAD, dy + 26, R - PAD, 1);
      dy += 44;
    });

    // 金句
    const qy = dy + 34;
    g.fillStyle = '#141414'; g.fillRect(PAD, qy, R - PAD, 3);
    g.font = '900 34px "PingFang SC","Microsoft YaHei",sans-serif';
    const ql = wrapLines(g, r.line, R - PAD);
    ql.slice(0, 3).forEach((ln, i) => g.fillText(ln, PAD, qy + 56 + i * 46));
    const qb = qy + 56 + ql.length * 46 - 12;
    g.fillStyle = '#141414'; g.fillRect(PAD, qb, R - PAD, 1.5);

    // 建议
    g.fillStyle = '#8A867C';
    g.font = '19px "PingFang SC","Microsoft YaHei",sans-serif';
    const al = wrapLines(g, r.advice, R - PAD).slice(0, 2);
    al.forEach((ln, i) => g.fillText(ln, PAD, qb + 44 + i * 30));

    // 特征
    g.font = '700 19px "PingFang SC","Microsoft YaHei",sans-serif';
    let px = PAD;
    const py = qb + 76 + al.length * 30;
    r.traits.forEach(tr => {
      const w3 = g.measureText(tr).width + 30;
      g.strokeStyle = '#141414'; g.lineWidth = 2;
      g.strokeRect(px, py, w3, 40);
      g.fillStyle = '#141414';
      g.fillText(tr, px + 15, py + 27);
      px += w3 + 14;
    });

    // 底部二维码
    const fy = 1040;
    g.fillStyle = 'rgba(20,20,20,.18)'; g.fillRect(PAD, fy, R - PAD, 1);
    const qs = 96, qx = R - qs, qy2 = fy + 22;
    g.fillStyle = '#fff'; g.fillRect(qx - 6, qy2 - 6, qs + 12, qs + 12);
    g.strokeStyle = '#141414'; g.lineWidth = 1.5; g.strokeRect(qx - 6, qy2 - 6, qs + 12, qs + 12);
    if (QR_IMG) g.drawImage(QR_IMG, qx, qy2, qs, qs);
    else {
      g.fillStyle = '#A8A49A';
      g.font = '14px "PingFang SC","Microsoft YaHei",sans-serif';
      g.textAlign = 'center';
      g.fillText('二维码', qx + qs / 2, qy2 + 44);
      g.fillText('放这里', qx + qs / 2, qy2 + 66);
      g.textAlign = 'left';
    }
    g.fillStyle = '#141414';
    g.font = '800 21px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText(TEST.qrCaption, PAD, fy + 56);
    g.fillStyle = '#8A867C';
    g.font = '15px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText('仅供娱乐 · 不构成任何人格评价', PAD, fy + 88);

    return c.toDataURL('image/png');
  }
};

/* ---------- 绑定 ---------- */
$('btnStart').addEventListener('click', startQuiz);
$('btnAgain').addEventListener('click', startQuiz);
$('btnPoster').addEventListener('click', showPoster);
$('btnShare').addEventListener('click', copyLink);

</script>
