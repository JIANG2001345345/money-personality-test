<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E9F5EE">
<title>测测你在宿舍里是什么人设？20 题看穿你的宿舍身份</title>
<meta name="description" content="操心、存在感、边界三个维度，测出你在宿舍的真实角色：隐形人、老好人、气氛组、生活委员、宿舍家长。">
<style>
/* ===== 宿舍人设 · 薄荷绿 / 便利贴 / 珊瑚红 ===== */
:root{
  --mint:#E9F5EE; --deep:#1F4739; --ink:#17352A; --coral:#FF6B5E;
  --paper:#FFFDF6; --sticky:#FFF3B8; --dim:#7C9488; --line:#CFE3D7;
  --sans:"PingFang SC","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","STSong",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--mint);color:var(--ink);font-family:var(--sans);line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:linear-gradient(rgba(31,71,57,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(31,71,57,.045) 1px,transparent 1px);
  background-size:26px 26px}
.app{max-width:430px;margin:0 auto;position:relative;min-height:100vh;min-height:100dvh}
.screen{display:none;flex-direction:column;min-height:100vh;min-height:100dvh;
  padding:24px 22px calc(26px + env(safe-area-inset-bottom))}
.screen.active{display:flex}
.eyebrow{font-size:9px;letter-spacing:.3em;color:var(--dim)}
.btn{display:block;width:100%;border:0;background:var(--deep);color:#F3FBF6;
  font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:.26em;text-indent:.26em;
  padding:16px 12px;cursor:pointer;border-radius:10px}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--deep);border:1.5px solid var(--line);
  font-size:12px;font-weight:600;letter-spacing:.14em;text-indent:.14em;padding:12px 8px}

/* ---------- 便利贴 ---------- */
.note{position:relative;background:var(--sticky);padding:24px 22px;
  transform:rotate(-1.1deg);box-shadow:3px 7px 18px rgba(31,71,57,.14)}
.note::before{content:'';position:absolute;top:-11px;left:50%;margin-left:-52px;
  width:104px;height:22px;background:rgba(255,107,94,.62);
  transform:rotate(-3deg);box-shadow:0 1px 3px rgba(0,0,0,.10)}

/* ---------- 封面 ---------- */
.cover{flex:1;display:flex;flex-direction:column;justify-content:center}
.c-top{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1.5px solid var(--line);padding-bottom:12px;margin-bottom:34px}
.c-title{font-size:clamp(28px,8.4vw,36px);font-weight:900;line-height:1.44;
  letter-spacing:-.01em;margin:0;color:var(--deep)}
.lede{font-size:13px;line-height:1.95;color:#4C6A5C;margin:26px 0 0}
.cover-foot{display:flex;flex-direction:column;gap:14px;margin-top:24px}
.facts{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.14em;color:var(--dim)}

/* ---------- 答题 ---------- */
#s-quiz{padding-top:26px}
.qtop{display:flex;justify-content:space-between;align-items:baseline}
.q-no{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--coral)}
.q-pct{font-size:10px;letter-spacing:.18em;color:var(--dim)}
.qtrack{height:6px;margin-top:13px;border-radius:4px;background:rgba(31,71,57,.10);overflow:hidden}
.qtrack i{display:block;height:100%;width:var(--w,0);border-radius:4px;background:var(--deep);
  transform-origin:left;animation:grow .9s cubic-bezier(.2,.9,.3,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.qwrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:56px}
.qkicker{font-size:9px;font-weight:700;letter-spacing:.3em;color:var(--dim);margin:0 0 16px}
.qtext{font-size:21.5px;font-weight:800;line-height:1.66;margin:0 0 24px;color:var(--deep)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:13px;width:100%;background:var(--paper);
  border:1.5px solid var(--line);border-radius:12px;padding:15px 14px;
  text-align:left;font-family:var(--sans);font-size:15px;line-height:1.45;color:#26443A;
  cursor:pointer;transition:border-color .15s,opacity .15s}
.opt .k{width:24px;height:24px;flex:0 0 auto;border-radius:50%;background:var(--mint);
  color:var(--deep);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--coral)}
.opt.sel .k{background:var(--coral);color:#fff}
.opt.dim{opacity:.42}
.qfoot{text-align:center;font-size:10px;letter-spacing:.16em;color:var(--dim);margin:0}

/* ---------- 结果 ---------- */
.rtop{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1.5px solid var(--line);padding-bottom:10px}
.note.name-note{margin-top:26px;padding:18px 20px;transform:rotate(-1.4deg)}
.rname{font-size:clamp(34px,9.4vw,42px);font-weight:900;line-height:1.16;
  letter-spacing:.02em;margin:0;color:var(--deep)}
.rtag{font-size:12px;letter-spacing:.04em;color:#4C6A5C;margin:16px 0 0}
.dims,.sec,.advice{margin-top:26px}
.seclab{font-size:9px;font-weight:700;letter-spacing:.28em;color:var(--dim);margin:0 0 12px}
.dim-row{display:flex;align-items:center;gap:11px;margin:12px 0}
.dim-row .n{width:44px;flex:0 0 auto;font-size:11.5px;font-weight:700;color:#33564A}
.dim-row .track{flex:1;height:9px;border-radius:5px;background:rgba(31,71,57,.09);overflow:hidden}
.dim-row .track i{display:block;height:100%;width:var(--w,0);border-radius:5px;background:var(--deep);
  transform-origin:left;animation:grow .9s cubic-bezier(.2,.9,.3,1) both}
.dim-row .v{width:28px;flex:0 0 auto;text-align:right;font-size:10.5px;font-weight:800;color:var(--dim)}
.body-text{font-size:13.5px;line-height:2.02;color:#2C4A3E;margin:0;text-align:justify}
.traits{display:flex;flex-wrap:wrap;gap:8px}
.traits span{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--deep);
  background:var(--sticky);border-radius:4px;padding:6px 13px;transform:rotate(-.6deg)}
.traits span:nth-child(even){transform:rotate(.8deg)}
.quote{font-size:17px;font-weight:800;line-height:1.76;letter-spacing:.005em;
  margin:28px 0 0;padding:20px 22px;background:var(--paper);color:var(--deep);
  border-left:4px solid var(--coral);border-radius:0 10px 10px 0;
  box-shadow:2px 4px 14px rgba(31,71,57,.08)}
.advice{border-top:1.5px dashed var(--line);padding-top:18px;margin-top:28px}
.advice p:last-child{margin:0;font-size:12.5px;line-height:1.95;color:#4C6A5C}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.acts-row{display:flex;gap:10px}
.acts-row .btn{flex:1}
.rfoot{text-align:center;font-size:8.5px;letter-spacing:.3em;color:var(--dim);margin:26px 0 0}

.modal-tip{color:#C8DDD2}


/* ---------- 共用弹层 ---------- */
.modal{position:fixed;inset:0;background:rgba(8,10,9,.9);display:none;z-index:80;
  padding:24px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal.on{display:flex;flex-direction:column;align-items:center;justify-content:center}
.modal-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px;align-items:center}
.poster-img{width:100%;display:block;border-radius:3px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.modal-tip{font-size:12.5px;line-height:1.8;text-align:center;opacity:.62;margin:0}
.modal-x{margin-top:4px;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;
  font-size:13px;padding:9px 26px;border-radius:2px;letter-spacing:.08em;cursor:pointer}
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,12px);
  background:rgba(20,20,20,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:3px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:90;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

</style>
</head>
<body>
<div class="app">

  <!-- 封面 -->
  <section class="screen active" id="s-cover">
    <div class="cover">
      <div class="c-top">
        <span class="eyebrow">DORM PERSONA</span>
        <span class="eyebrow">NO. 05</span>
      </div>

    <div class="sec">

      <div class="traits" id="rTraits"></div>
    </div>
    <p class="quote" id="rLine"></p>
    <div class="advice">
      <p class="seclab">给 你 的 建 议</p>
      <p id="rAdvice"></p>
    </div>

    <div class="acts">
      <button class="btn" id="btnPoster">生成人设海报</button>
      <div class="acts-row">
        <button class="btn ghost" id="btnShare">复制链接</button>
        <button class="btn ghost" id="btnAgain">再测一次</button>
      </div>
    </div>
    <p class="rfoot">DORM PERSONA TEST</p>
  </section>

</div>

<div class="modal" id="modal">
  <div class="modal-card" id="modalBody"></div>
  <button class="modal-x" onclick="closeModal()">关闭</button>
</div>
<div class="toast" id="toast"></div>

/* ===== 共用引擎：抽题 / 打乱 / 计分 / 弹层 / 通用画笔 =====
   每个主题只提供 SKIN 对象和 TEST 数据，其余都走这里。 */

const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';

/* ---------- 二维码（每套主题在 data.js 里配） ---------- */
let QR_IMG = null;
if (TEST.qrImage){
  QR_IMG = new Image();
  QR_IMG.src = TEST.qrImage;
}

/* ---------- 工具 ---------- */
function shuffleArr(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 按维度配比抽题：slots 之和 = TEST.quizLen */
function drawQuiz(){
  const picked = [];
  const slots = shuffleArr(TEST.slots.slice());
  TEST.dims.forEach((m, di) => {
    const pool = shuffleArr(TEST.bank.filter(x => x.d === di));
    picked.push.apply(picked, pool.slice(0, slots[di]));
  });
  return shuffleArr(picked);
}

/* ---------- 状态 ---------- */
const state = { i:0, scores:[], drawn:[], opts:[], total:0, result:null, dims:null };
let locked = false;

/* ---------- 流程 ---------- */
function startQuiz(){
  state.i = 0;
  state.scores = [];
  state.drawn = drawQuiz();
  state.opts = state.drawn.map(q => shuffleArr(q.o.map(o => ({ t:o[0], s:o[1] }))));
  locked = false;
  SKIN.goQuiz();
  SKIN.renderQuestion();
}

function choose(score, el){
  if (locked) return;
  locked = true;
  if (el) el.classList.add('sel');
  state.scores.push(score);
  SKIN.afterChoose(el, score);
  setTimeout(() => {
    locked = false;
    if (state.i < TEST.quizLen - 1){
      state.i++;
      SKIN.renderQuestion();
    } else {
      finish();
    }
  }, SKIN.advanceDelay || 240);
}

function finish(){
  state.total = state.scores.reduce((a,b) => a + b, 0);
  state.result = TEST.results.find(r => state.total >= r.min && state.total <= r.max) || TEST.results[0];

  const sum = [0,0,0], cnt = [0,0,0];
  state.drawn.forEach((q, i) => { sum[q.d] += state.scores[i]; cnt[q.d]++; });
  state.dims = TEST.dims.map((m, d) => ({
    name: m.name,
    pct: Math.max(TEST.pctFloor || 6, Math.min(100, Math.round(sum[d] / (cnt[d] * 3) * 100)))
  }));

  SKIN.goResult();
  SKIN.renderResult();
  window.scrollTo(0,0);
}

/* ---------- 弹层 ---------- */
function openModal(html){
  $('modalBody').innerHTML = html;
  $('modal').classList.add('on');
}
function closeModal(){ $('modal').classList.remove('on'); }

function showPoster(){
  const url = SKIN.buildPoster();
  openModal('<img class="poster-img" src="' + url + '" alt="测试结果海报">'
    + '<p class="modal-tip">长按图片保存到相册<br>电脑上右键另存为</p>');
}

function copyLink(){
  const url = location.href;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(
      () => toast('链接已复制'),
      () => toast('长按地址栏复制链接')
    );
  } else {
    toast('长按地址栏复制链接');
  }
}

let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1900);
}

/* ---------- 画布通用件 ---------- */
function makeCanvas(w, h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function wrapLines(g, text, maxW){
  const out = []; let line = '';
  for (const ch of text){
    if (g.measureText(line + ch).width > maxW && line){ out.push(line); line = ch; }
    else line += ch;
  }
  if (line) out.push(line);
  return out;
}
/* 防伪扭索纹：r = R + A·sin(Nθ) 旋转复制 */
function drawRosette(g, cx, cy, R, amp, N, P, steps, color, alpha, lw){
  g.save();
  g.strokeStyle = color; g.globalAlpha = alpha; g.lineWidth = lw || 0.9;
  for (let k = 0; k < P; k++){
    const rot = k * 2 * Math.PI / (N * P);
    g.beginPath();
    for (let i = 0; i <= steps; i++){
      const t = i / steps * Math.PI * 2;
      const r = R + amp * Math.sin(N * t);
      const a = t + rot;
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  }
  g.restore();
}
function roundRect(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

/* ===== 宿舍人设 · 界面层 ===== */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0, 0);
}
const SERIF = '"Songti SC","STSong",serif';
const SANS = '"PingFang SC","Microsoft YaHei",sans-serif';
const MINT = '#E9F5EE', DEEP = '#1F4739', INK = '#17352A', CORAL = '#FF6B5E';
const PAPER = '#FFFDF6', STICKY = '#FFF3B8', DIM = '#7C9488', LINE = '#CFE3D7';

const SKIN = {
  advanceDelay: 250,

  goQuiz(){ show('s-quiz'); },
  goResult(){ show('s-result'); },

  renderQuestion(){
    const i = state.i;
    $('qCount').textContent = String(i + 1).padStart(2, '0') + ' / ' + TEST.quizLen;
    $('qPct').textContent = Math.round((i + 1) / TEST.quizLen * 100) + '%';
    $('qBar').style.width = ((i + 1) / TEST.quizLen * 100) + '%';
    $('qText').textContent = state.drawn[i].q;

    const box = $('opts');
    box.innerHTML = '';
    state.opts[i].forEach((o, k) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      const key = document.createElement('span');
      key.className = 'k'; key.textContent = '0' + (k + 1);
      const tx = document.createElement('span');
      tx.className = 't'; tx.textContent = o.t;
      b.appendChild(key); b.appendChild(tx);
      b.addEventListener('click', () => choose(o.s, b));
      box.appendChild(b);
    });
  },

  afterChoose(el){
    document.querySelectorAll('.opt').forEach(x => { if (x !== el) x.classList.add('dim'); });
  },

  renderResult(){
    const r = state.result, t = state.total;
    $('rNo').textContent = 'NO.' + String(1000 + t * 37).slice(-4);
    $('rTitle').textContent = r.title;
    $('rTag').textContent = r.tag;
    $('rAnalysis').textContent = r.analysis;
    $('rTraits').innerHTML = r.traits.map(x => '<span>' + x + '</span>').join('');
    $('rLine').textContent = r.line;
    $('rAdvice').textContent = r.advice;
    $('rDims').innerHTML = state.dims.map(d =>
      '<div class="dim-row"><span class="n">' + d.name + '</span>'
      + '<span class="track"><i style="--w:' + Math.max(4, d.pct) + '%"></i></span>'
      + '<span class="v">' + d.pct + '</span></div>'
    ).join('');
  },

  buildPoster(){
    const W = 750, H = 1200;
    const c = makeCanvas(W, H), g = c.getContext('2d');
    const r = state.result, M = 96, R = W - M;

    g.fillStyle = MINT; g.fillRect(0, 0, W, H);
    g.strokeStyle = 'rgba(31,71,57,.06)'; g.lineWidth = 1;
    for (let x = 0; x < W; x += 26){ g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
    for (let y = 0; y < H; y += 26){ g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }

    // 便签阴影 + 纸
    g.fillStyle = 'rgba(31,71,57,.055)';
    roundRect(g, 56, 80, W - 104, H - 122, 4); g.fill();
    g.fillStyle = PAPER;
    roundRect(g, 46, 70, W - 110, H - 128, 3); g.fill();

    // 胶带
    g.save();
    g.translate(W / 2, 62); g.rotate(-.05);
    g.fillStyle = 'rgba(255,107,94,.60)';
    g.fillRect(-80, -16, 160, 32);
    g.restore();

    // 抬头
    g.fillStyle = DIM; g.font = '700 10px ' + SANS;
    g.fillText('DORM PERSONA  ·  NO. ' + String(1000 + state.total * 37).slice(-4), M, 128);

    // 名字
    g.fillStyle = DEEP; g.font = '900 72px ' + SANS;
    g.fillText(r.title, M, 224);
    g.fillStyle = '#4C6A5C'; g.font = '15px ' + SANS;
    const tg = wrapLines(g, r.tag, R - M).slice(0, 2);
    tg.forEach((ln, i) => g.fillText(ln, M, 266 + i * 26));

    // 珊瑚短线
    g.fillStyle = CORAL; g.fillRect(M, 322, 44, 4);

    // 三维度
    let dy = 380;
    state.dims.forEach(d => {
      g.fillStyle = '#33564A'; g.font = '700 13px ' + SANS;
      g.fillText(d.name, M, dy + 4);
      roundRect(g, 168, dy - 5, 404, 10, 5); g.fillStyle = 'rgba(31,71,57,.09)'; g.fill();
      roundRect(g, 168, dy - 5, Math.max(10, 404 * d.pct / 100), 10, 5); g.fillStyle = DEEP; g.fill();
      g.fillStyle = DIM; g.font = '800 12px ' + SANS;
      g.textAlign = 'right'; g.fillText(String(d.pct), R, dy + 4);
      g.textAlign = 'left';
      dy += 50;
    });

    // 正文
    g.fillStyle = '#2C4A3E'; g.font = '15.5px ' + SANS;
    const al = wrapLines(g, r.analysis, R - M).slice(0, 5);
    al.forEach((ln, i) => g.fillText(ln, M, 566 + i * 34));

    // 金句
    g.font = '800 22px ' + SANS;
    const ql = wrapLines(g, r.line, R - M - 44).slice(0, 2);
    roundRect(g, M - 12, 744, R - M + 24, 30 + ql.length * 38, 4);
    g.fillStyle = STICKY; g.fill();
    g.fillStyle = DEEP;
    ql.forEach((ln, i) => g.fillText(ln, M + 10, 786 + i * 38));

    // 关键词
    g.fillStyle = '#5C7A6C'; g.font = '700 13px ' + SANS;
    g.fillText(r.traits.join('    ·    '), M, 900);

    // 页脚
    g.strokeStyle = '#DCEAE2'; g.lineWidth = 1;
    g.setLineDash([6, 6]);
    g.beginPath(); g.moveTo(M, 936); g.lineTo(R, 936); g.stroke();
    g.setLineDash([]);

    const qs = 96, qx = R - qs, qy = 968;
    g.fillStyle = '#FFFFFF';
    roundRect(g, qx - 8, qy - 8, qs + 16, qs + 16, 4); g.fill();
    if (QR_IMG) g.drawImage(QR_IMG, qx, qy, qs, qs);
    else {
      g.fillStyle = '#BFD2C7'; g.font = '12px ' + SANS; g.textAlign = 'center';
      g.fillText('二维码', qx + qs / 2, qy + 46);
      g.fillText('放这里', qx + qs / 2, qy + 66);
      g.textAlign = 'left';
    }

    g.fillStyle = DEEP; g.font = '800 17px ' + SANS;
    const cl = wrapLines(g, TEST.qrCaption, 460).slice(0, 2);
    cl.forEach((ln, i) => g.fillText(ln, M, 1002 + i * 28));
    g.fillStyle = 'rgba(23,53,42,.42)'; g.font = '11px ' + SANS;
    g.fillText('仅供娱乐 · 不构成任何专业评价', M, 1108);

    return c.toDataURL('image/png');
  }
};

/* ---------- 绑定 ---------- */
$('btnStart').addEventListener('click', startQuiz);
$('btnAgain').addEventListener('click', startQuiz);
$('btnPoster').addEventListener('click', showPoster);
$('btnShare').addEventListener('click', copyLink);

</script>
